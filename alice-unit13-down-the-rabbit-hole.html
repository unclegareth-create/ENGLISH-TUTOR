      "passageHtml": "<p>'There was nothing so <em>very</em> remarkable in that; nor did Alice think it so <em>very</em> much out of the way to hear the Rabbit say to itself, \"Oh dear! Oh dear! I shall be late!\" But when the Rabbit actually <em>took a watch out of its waistcoat-pocket</em>, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that <span class=\"highlight-clause violet\" title=\"Negative Inversion: Never before had she...\">never before had she seen a rabbit with either a waistcoat-pocket, or a watch to take out of it</span>.</p><p>Burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge. In another moment down went Alice after it, <span class=\"highlight-clause violet\" title=\"Negative cognition participle\">never once considering how in the world she was to get out again</span>.</p><p>The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well. <span class=\"highlight-clause violet\" title=\"Result Inversion: So deep was the shaft...\">So deep was the shaft that she had plenty of time as she went down to look about her</span> and to wonder what was going to happen next.</p><p>First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. <span class=\"highlight-clause violet\" title=\"Cognition Inversion: Little did she anticipate...\">Little did she anticipate</span>, as she snatched an empty marmalade jar from a shelf, that this precipitous plunge would overturn every scientific axiom she had ever studied.'</p>",

          "heading": "2. Negative Cognition (Little did + Subject + Verb)",

          "heading": "3. Restrictive Conditionals (Only after / Only by + Inversion)",
          "bodyHtml": "Beware the common examination trap: when <em>Only after</em> or <em>Only when</em> introduces an adverbial time clause, that clause maintains standard order. The inversion occurs strictly in the <strong>main clause</strong>.",
