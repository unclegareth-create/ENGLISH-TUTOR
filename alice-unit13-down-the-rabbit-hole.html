      "passageHtml": "<p>'There was nothing so <em>very</em> remarkable in that; nor did Alice think it so <em>very</em> much out of the way to hear the Rabbit say to itself, \"Oh dear! Oh dear! I shall be late!\" But when the Rabbit actually <em>took a watch out of its waistcoat-pocket</em>, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that <span class=\"highlight-clause violet\" title=\"Negative Inversion: Never before had she...\">never before had she seen a rabbit with either a waistcoat-pocket, or a watch to take out of it</span>.</p><p>Burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge. In another moment down went Alice after it, <span class=\"highlight-clause violet\" title=\"Negative cognition participle\">never once considering how in the world she was to get out again</span>.</p><p>The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well. <span class=\"highlight-clause violet\" title=\"Result Inversion: So deep was the shaft...\">So deep was the shaft that she had plenty of time as she went down to look about her</span> and to wonder what was going to happen next.</p><p>First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. <span class=\"highlight-clause violet\" title=\"Cognition Inversion: Little did she anticipate...\">Little did she anticipate</span>, as she snatched an empty marmalade jar from a shelf, that this precipitous plunge would overturn every scientific axiom she had ever studied.'</p>",

          "heading": "3. Restrictive Conditionals (Only after / Only by + Inversion)",

  let unitTimerInterval = null;
  function startUnitTimer(seconds, mode) {
    stopUnitTimer();
    let rem = seconds;
    const disp = document.getElementById('unit-timer-display');
    const tick = () => {
      const m = String(Math.floor(rem / 60)).padStart(2, '0');
      const s = String(rem % 60).padStart(2, '0');
      if (disp) {
        disp.textContent = `${m}:${s}`;
        disp.style.borderColor = mode === 'Speak' ? '#4ade80' : '#f59e0b';
        disp.style.color = rem <= 10 ? '#f87171' : (mode === 'Speak' ? '#86efac' : '#fde68a');
      }
    };
    tick();
    unitTimerInterval = setInterval(() => {
      rem -= 1;
      if (rem <= 0) {
        rem = 0;
        tick();
        clearInterval(unitTimerInterval);
        unitTimerInterval = null;
      } else {
        tick();
      }
    }, 1000);
  }
  function stopUnitTimer() {
    if (unitTimerInterval) { clearInterval(unitTimerInterval); unitTimerInterval = null; }
    const disp = document.getElementById('unit-timer-display');
    if (disp) { disp.textContent = '01:00'; disp.style.borderColor = 'rgba(245,158,11,0.4)'; disp.style.color = '#fde68a'; }
  }

  function checkWbItem(idx) {

      fb.textContent = `⚠️ Unchanged Keyword Guard: You must include the exact word "${item.keyWord}" without altering its form.`;

      fb.textContent = `⚠️ Word Count Alert: Your phrase has ${words.length} words. Cambridge C1 Part 4 requires between 3 and 6 words.`;

  function auditC1Writing(text) {
    const raw = (text || '').trim();
    const words = raw ? raw.split(/\s+/).length : 0;
    const wcEl = document.getElementById('transfer-word-count');
    if (wcEl) wcEl.textContent = `${words} Words`;

    const rules = [
      { id: 'c1-badge-inversion', re: /\b(?:much\s+as|[a-z]+\s+(?:though|as)\s+(?:the|a|an|it|he|she|they|we|this|that|[a-z]+)\s+(?:is|are|was|were|seem|seemed|look|looked|sound|sounded|appear|appeared|may|might)|never\s+before|seldom|rarely|little\s+(?:did|do|does)|not\s+until|only\s+(?:when|after|by)|scarcely|hardly|no\s+sooner|under\s+no\s+circumstances|so\s+[a-z]+\s+(?:was|were|is|are|has|have)|such\s+(?:was|were|is)|nowhere\s+(?:is|was|could))\b/i },
      { id: 'c1-badge-cleft', re: /\b(?:what\s+[^.!?]{2,45}\s+(?:is|was|are|were)\b|it\s+(?:is|was)\s+(?:only\s+when|not\s+until|[^.!?]{2,35})\s+that\b)/i },
      { id: 'c1-badge-participle', re: /(?:^|[.!?]\s+)(?:having\s+[a-z]+ed|having\s+been|not\s+[a-z]+ing|far\s+from\s+[a-z]+ing|hemmed\s+in|shrouded\s+in|faced\s+with|confronted\s+with|[a-z]+ing\s+[^.!?]{3,50},)/im },
      { id: 'c1-badge-passive', re: /\b(?:(?:is|are|was|were)\s+(?:widely\s+|commonly\s+|frequently\s+)?(?:believed|alleged|thought|presumed|said|reported|rumoured|claimed|known)\s+to\b|it\s+(?:is|was)\s+(?:widely\s+)?(?:believed|argued|thought|claimed|alleged)\s+that\b|corroborated\s+by\b)/i },
      { id: 'c1-badge-modal', re: /\b(?:(?:must|can't|cannot|couldn't|may|might|could)\s+(?:well\s+)?have\s+[a-z]+|ought\s+(?:not\s+)?to\s+have|were\s+[^.!?]{2,25}\s+to\s+[a-z]+|had\s+it\s+not\s+been\s+for|but\s+for\s+the|high\s+time\s+[^.!?]{2,25}\s+[a-z]+ed|would\s+rather\s+[^.!?]{2,25}\s+(?:did|had|[a-z]+ed))\b/i }
    ];

    rules.forEach(r => {
      const el = document.getElementById(r.id);
      if (!el) return;
      const dot = el.querySelector('.da-c1-dot');
      const matched = r.re.test(raw);
      el.classList.toggle('active', matched);
      if (dot) dot.textContent = matched ? '✓' : '○';
    });
  }
