<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="triBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2b1d0e"/>
      <stop offset="60%" stop-color="#120c07"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3bd"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#876112"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#triBg)"/>
  <!-- Triumphal Three-Pillar Candelabrum / Trident of Rhetoric -->
  <g transform="translate(300, 340)">
    <path d="M-135,10 C-135,95 -65,115 0,115 C65,115 135,95 135,10" fill="none" stroke="url(#goldCrown)" stroke-width="10"/>
    <!-- 3 Ascending Columns -->
    <rect x="-143" y="-110" width="16" height="125" fill="url(#goldCrown)"/>
    <rect x="-10" y="-155" width="20" height="325" fill="url(#goldCrown)"/>
    <rect x="127" y="-110" width="16" height="125" fill="url(#goldCrown)"/>
    <!-- 3 Blazing Rhetorical Flames (Clause I, Clause II, Clause III) -->
    <path d="M-135,-120 C-165,-160 -150,-205 -135,-235 C-120,-205 -105,-160 -135,-120 Z" fill="url(#goldCrown)"/>
    <path d="M0,-165 C-40,-215 -20,-265 0,-305 C20,-265 40,-215 0,-165 Z" fill="#fff5c0" stroke="url(#goldCrown)" stroke-width="3"/>
    <path d="M135,-120 C105,-160 120,-205 135,-235 C150,-205 165,-160 135,-120 Z" fill="url(#goldCrown)"/>
    <!-- Pedestal -->
    <polygon points="-85,170 85,170 115,205 -115,205" fill="url(#goldCrown)"/>
  </g>
  <rect x="24" y="24" width="552" height="552" rx="18" fill="none" stroke="url(#goldCrown)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="528" rx="12" fill="none" stroke="url(#goldCrown)" stroke-width="1"/>
</svg>
