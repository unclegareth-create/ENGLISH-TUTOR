<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="compBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#21180b"/>
      <stop offset="65%" stop-color="#0e0a06"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldStair" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6414"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#fff0b3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#compBg)"/>
  <!-- Twin Interlocking Celestial Gears (The more..., the more...) -->
  <g transform="translate(215, 375)">
    <circle r="98" fill="#140e08" stroke="url(#goldStair)" stroke-width="4"/>
    <circle r="68" fill="none" stroke="url(#goldStair)" stroke-width="2" stroke-dasharray="8 6"/>
    <polygon points="0,-112 18,-25 112,0 18,25 0,112 -18,25 -112,0 -18,-25" fill="url(#goldStair)" fill-opacity="0.35" stroke="url(#goldStair)" stroke-width="2"/>
    <circle r="24" fill="#0d0905" stroke="url(#goldStair)" stroke-width="3"/>
  </g>
  <g transform="translate(385, 225)">
    <circle r="115" fill="#140e08" stroke="url(#goldStair)" stroke-width="4"/>
    <circle r="84" fill="none" stroke="url(#goldStair)" stroke-width="2" stroke-dasharray="8 6"/>
    <polygon points="0,-130 22,-30 130,0 22,30 0,130 -22,30 -130,0 -22,-30" fill="url(#goldStair)" fill-opacity="0.45" stroke="url(#goldStair)" stroke-width="2.5"/>
    <circle r="30" fill="url(#goldStair)"/>
  </g>
  <!-- Ascending Golden Stairway Arc -->
  <path d="M95,500 L185,500 L185,430 L275,430 L275,355 L365,355 L365,275 L455,275 L455,185 L520,185" fill="none" stroke="url(#goldStair)" stroke-width="5"/>
  <rect x="24" y="24" width="552" height="552" rx="18" fill="none" stroke="url(#goldStair)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="528" rx="12" fill="none" stroke="url(#goldStair)" stroke-width="1"/>
</svg>
