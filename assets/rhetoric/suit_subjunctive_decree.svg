<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="decreeBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#291512"/>
      <stop offset="60%" stop-color="#120a08"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce694"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7d5b10"/>
    </linearGradient>
    <radialGradient id="crimsonWax" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c93b2b"/>
      <stop offset="60%" stop-color="#7c1911"/>
      <stop offset="100%" stop-color="#3d0905"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#decreeBg)"/>
  <!-- Rolled Sovereign Scroll -->
  <g transform="translate(300, 275)">
    <rect x="-155" y="-175" width="310" height="330" rx="8" fill="#1b140d" stroke="url(#goldLeaf)" stroke-width="3"/>
    <rect x="-175" y="-190" width="350" height="26" rx="12" fill="#2c1f11" stroke="url(#goldLeaf)" stroke-width="2.5"/>
    <rect x="-175" y="145" width="350" height="26" rx="12" fill="#2c1f11" stroke="url(#goldLeaf)" stroke-width="2.5"/>
    <!-- Engraved Script Lines -->
    <g stroke="url(#goldLeaf)" stroke-width="2" stroke-opacity="0.55">
      <line x1="-110" y1="-120" x2="110" y2="-120"/>
      <line x1="-110" y1="-85" x2="90" y2="-85"/>
      <line x1="-110" y1="-50" x2="110" y2="-50"/>
      <line x1="-110" y1="-15" x2="75" y2="-15"/>
      <line x1="-110" y1="20" x2="105" y2="20"/>
    </g>
    <!-- Ribbons hanging down -->
    <polygon points="-45,165 -75,270 -35,250 -15,275 -10,165" fill="#8c1d14" stroke="url(#goldLeaf)" stroke-width="2"/>
    <polygon points="45,165 75,270 35,250 15,275 10,165" fill="#8c1d14" stroke="url(#goldLeaf)" stroke-width="2"/>
    <!-- Imperial Crimson & Gold Wax Seal -->
    <circle cx="0" cy="145" r="68" fill="url(#crimsonWax)" stroke="url(#goldLeaf)" stroke-width="4"/>
    <circle cx="0" cy="145" r="52" fill="none" stroke="url(#goldLeaf)" stroke-width="1.8" stroke-dasharray="5 3"/>
    <!-- Crown Emblem inside Seal -->
    <polygon points="-28,158 -34,125 -14,140 0,118 14,140 34,125 28,158" fill="url(#goldLeaf)"/>
  </g>
  <rect x="24" y="24" width="552" height="552" rx="18" fill="none" stroke="url(#goldLeaf)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="528" rx="12" fill="none" stroke="url(#goldLeaf)" stroke-width="1"/>
</svg>
