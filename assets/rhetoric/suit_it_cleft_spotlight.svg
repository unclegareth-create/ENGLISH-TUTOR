<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="spotBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#281d0f"/>
      <stop offset="55%" stop-color="#110c07"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#e5c158" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae29c"/>
      <stop offset="50%" stop-color="#c99e32"/>
      <stop offset="100%" stop-color="#6e500f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#spotBg)"/>
  <!-- Victorian Woodcut Engraving Sunburst Lines -->
  <g stroke="#d4af37" stroke-opacity="0.18" stroke-width="1">
    <line x1="120" y1="110" x2="580" y2="300"/>
    <line x1="120" y1="110" x2="560" y2="380"/>
    <line x1="120" y1="110" x2="520" y2="480"/>
    <line x1="120" y1="110" x2="420" y2="560"/>
    <line x1="120" y1="110" x2="300" y2="580"/>
    <line x1="120" y1="110" x2="200" y2="560"/>
  </g>
  <!-- Focused Limelight Beam -->
  <polygon points="135,125 495,435 265,505" fill="url(#goldBeam)"/>
  <!-- Ornate Brass Limelight Lantern Top-Left -->
  <g transform="translate(115, 110) rotate(-32)">
    <rect x="-42" y="-32" width="76" height="64" rx="8" fill="#18120a" stroke="url(#brass)" stroke-width="4"/>
    <path d="M34,-26 L56,-38 L56,38 L34,26 Z" fill="url(#brass)"/>
    <ellipse cx="56" cy="0" rx="8" ry="36" fill="#fff6cc"/>
    <circle cx="-5" cy="0" r="18" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
  </g>
  <!-- Illuminated Pedestal & Sovereign Diamond in Spotlight -->
  <g transform="translate(380, 445)">
    <ellipse cx="0" cy="40" rx="115" ry="26" fill="#e5c158" fill-opacity="0.22" stroke="url(#brass)" stroke-width="2"/>
    <polygon points="0,-95 62,-25 0,32 -62,-25" fill="#1c140b" stroke="url(#brass)" stroke-width="3.5"/>
    <polygon points="0,-95 62,-25 0,-12" fill="#f7e09e" fill-opacity="0.7"/>
    <polygon points="0,-95 -62,-25 0,-12" fill="#c99e32" fill-opacity="0.5"/>
    <polygon points="-62,-25 62,-25 0,32" fill="#9b741b" fill-opacity="0.65"/>
    <circle cx="0" cy="-35" r="95" fill="none" stroke="url(#brass)" stroke-width="1.2" stroke-dasharray="6 4"/>
    <!-- Pedestal Base -->
    <rect x="-70" y="42" width="140" height="22" fill="#140e08" stroke="url(#brass)" stroke-width="2.5"/>
    <rect x="-90" y="64" width="180" height="32" fill="#0d0905" stroke="url(#brass)" stroke-width="3"/>
  </g>
  <!-- Outer Tarot Engraving Border -->
  <rect x="24" y="24" width="552" height="552" rx="18" fill="none" stroke="url(#brass)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="528" rx="12" fill="none" stroke="url(#brass)" stroke-width="1"/>
</svg>
