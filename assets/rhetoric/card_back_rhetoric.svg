<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18120c"/>
      <stop offset="65%" stop-color="#0d0a07"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e09e"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="55%" stop-color="#9b741b"/>
      <stop offset="80%" stop-color="#e5c158"/>
      <stop offset="100%" stop-color="#7a5811"/>
    </linearGradient>
    <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0 M-2 2 L2 -2 M6 10 L10 6" stroke="#d4af37" stroke-width="0.35" stroke-opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="400" height="600" rx="22" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="376" height="576" rx="16" fill="url(#crosshatch)" stroke="url(#goldFoil)" stroke-width="2.5"/>
  <rect x="22" y="22" width="356" height="556" rx="10" fill="none" stroke="url(#goldFoil)" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="30" y="30" width="340" height="540" rx="8" fill="none" stroke="url(#goldFoil)" stroke-width="1.5"/>

  <!-- Corner Filigree Ornaments -->
  <g stroke="url(#goldFoil)" fill="none" stroke-width="1.5">
    <path d="M30 70 C55 70 70 55 70 30 M30 55 C45 55 55 45 55 30"/>
    <path d="M370 70 C345 70 330 55 330 30 M370 55 C355 55 345 45 345 30"/>
    <path d="M30 530 C55 530 70 545 70 570 M30 545 C45 545 55 555 55 570"/>
    <path d="M370 530 C345 530 330 545 330 570 M370 545 C355 545 345 555 345 570"/>
  </g>

  <!-- Central Astrolabe & Rhetorical Rose -->
  <g transform="translate(200, 300)">
    <circle r="135" fill="none" stroke="url(#goldFoil)" stroke-width="2"/>
    <circle r="126" fill="none" stroke="url(#goldFoil)" stroke-width="0.8" stroke-dasharray="3 5"/>
    <circle r="105" fill="#0d0906" fill-opacity="0.85" stroke="url(#goldFoil)" stroke-width="1.5"/>
    <circle r="78" fill="none" stroke="url(#goldFoil)" stroke-width="1"/>
    <!-- 8-point Star of Eloquence -->
    <polygon points="0,-125 22,-32 115,-55 38,-5 125,0 38,5 115,55 22,32 0,125 -22,32 -115,55 -38,5 -125,0 -38,-5 -115,-55 -22,-32" fill="url(#goldFoil)" fill-opacity="0.18" stroke="url(#goldFoil)" stroke-width="1.2"/>
    <polygon points="0,-95 25,-25 95,0 25,25 0,95 -25,25 -95,0 -25,-25" fill="#130e09" stroke="url(#goldFoil)" stroke-width="1.8"/>
    <!-- Crossed Quills / Nib Centerpiece -->
    <path d="M-45,-45 L45,45 M45,-45 L-45,45" stroke="url(#goldFoil)" stroke-width="2.2"/>
    <polygon points="0,-42 28,0 0,42 -28,0" fill="url(#goldFoil)"/>
    <circle r="9" fill="#0d0906" stroke="#f7e09e" stroke-width="2"/>
  </g>

  <!-- Top & Bottom Sun/Moon Medallions -->
  <circle cx="200" cy="95" r="24" fill="#130e09" stroke="url(#goldFoil)" stroke-width="1.6"/>
  <polygon points="200,76 206,90 220,95 206,100 200,114 194,100 180,95 194,90" fill="url(#goldFoil)"/>
  <circle cx="200" cy="505" r="24" fill="#130e09" stroke="url(#goldFoil)" stroke-width="1.6"/>
  <polygon points="200,486 206,500 220,505 206,510 200,524 194,510 180,505 194,500" fill="url(#goldFoil)"/>

  <text x="200" y="55" text-anchor="middle" fill="#e5c158" font-family="Georgia, serif" font-size="11" letter-spacing="4">ARS RHETORICA</text>
  <text x="200" y="552" text-anchor="middle" fill="#e5c158" font-family="Georgia, serif" font-size="11" letter-spacing="4">PONDUS VERBORUM</text>
</svg>
