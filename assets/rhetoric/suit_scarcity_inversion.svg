<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="stormBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#24190e"/>
      <stop offset="60%" stop-color="#0f0b07"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="45%" stop-color="#f0c75e"/>
      <stop offset="100%" stop-color="#9e7316"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#stormBg)"/>
  <!-- Concentric Celestial Sundial Rings -->
  <g transform="translate(300, 340)">
    <circle r="190" fill="none" stroke="url(#goldBolt)" stroke-width="2" stroke-opacity="0.45"/>
    <circle r="165" fill="none" stroke="url(#goldBolt)" stroke-width="1.2" stroke-dasharray="10 6"/>
    <circle r="135" fill="#120d08" stroke="url(#goldBolt)" stroke-width="3"/>
    <circle r="95" fill="none" stroke="url(#goldBolt)" stroke-width="1.5"/>
    <!-- Roman Numeral Ticks -->
    <g stroke="url(#goldBolt)" stroke-width="2.5">
      <line x1="0" y1="-135" x2="0" y2="-112"/>
      <line x1="135" y1="0" x2="112" y2="0"/>
      <line x1="0" y1="135" x2="0" y2="112"/>
      <line x1="-135" y1="0" x2="-112" y2="0"/>
      <line x1="95" y1="-95" x2="78" y2="-78"/>
      <line x1="-95" y1="-95" x2="-78" y2="-78"/>
      <line x1="95" y1="95" x2="78" y2="78"/>
      <line x1="-95" y1="95" x2="-78" y2="78"/>
    </g>
    <!-- Sundial Gnomon Blade -->
    <polygon points="0,-115 28,25 -28,25" fill="#1a120a" stroke="url(#goldBolt)" stroke-width="2.5"/>
  </g>
  <!-- Lightning Bolt of Immediate Sequence (Hardly... when / No sooner... than) -->
  <polygon points="345,45 235,235 320,235 225,435 405,205 312,205" fill="url(#goldBolt)" stroke="#fffbe6" stroke-width="2"/>
  <!-- Spark bursts -->
  <g stroke="#fff8d6" stroke-width="2">
    <line x1="225" y1="435" x2="175" y2="415"/>
    <line x1="225" y1="435" x2="195" y2="475"/>
    <line x1="225" y1="435" x2="265" y2="465"/>
  </g>
  <rect x="24" y="24" width="552" height="552" rx="18" fill="none" stroke="url(#goldBolt)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="528" rx="12" fill="none" stroke="url(#goldBolt)" stroke-width="1"/>
</svg>
