<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="anchorBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1d1812"/>
      <stop offset="65%" stop-color="#0d0a07"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="goldIron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae39c"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#75530e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#anchorBg)"/>
  <!-- Classical Pillars Framing the Anchor -->
  <rect x="75" y="95" width="38" height="410" fill="#140f0a" stroke="url(#goldIron)" stroke-width="2.5"/>
  <rect x="487" y="95" width="38" height="410" fill="#140f0a" stroke="url(#goldIron)" stroke-width="2.5"/>
  <!-- The Sovereign Fountain-Nib Admiralty Anchor -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="-165" r="28" fill="none" stroke="url(#goldIron)" stroke-width="8"/>
    <!-- Crossbar Stock -->
    <rect x="-125" y="-115" width="250" height="18" rx="9" fill="url(#goldIron)"/>
    <!-- Central Shaft morphing into a Fountain Pen Nib -->
    <polygon points="-14,-135 14,-135 26,85 0,155 -26,85" fill="url(#goldIron)" stroke="#140f0a" stroke-width="2"/>
    <circle cx="0" cy="45" r="9" fill="#0d0a07"/>
    <line x1="0" y1="54" x2="0" y2="152" stroke="#0d0a07" stroke-width="3"/>
    <!-- Curved Anchor Flukes -->
    <path d="M-155,45 C-145,165 -55,195 0,195 C55,195 145,165 155,45" fill="none" stroke="url(#goldIron)" stroke-width="14" stroke-linecap="round"/>
    <polygon points="-155,20 -185,68 -130,62" fill="url(#goldIron)"/>
    <polygon points="155,20 185,68 130,62" fill="url(#goldIron)"/>
  </g>
  <rect x="24" y="24" width="552" height="552" rx="18" fill="none" stroke="url(#goldIron)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="528" rx="12" fill="none" stroke="url(#goldIron)" stroke-width="1"/>
</svg>
