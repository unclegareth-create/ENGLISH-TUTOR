<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#070d19; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Drafting Grid Patterns -->
    <pattern id="grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16233b" stroke-width="0.75" />
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-fine)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1f3659" stroke-width="1.5" />
    </pattern>
    
    <!-- Gradients -->
    <linearGradient id="grad-fail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="grad-pass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.25" />
    </linearGradient>

    <!-- Marker Arrowheads -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d4af37" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171" />
    </marker>
  </defs>

  <!-- Background Blueprint Grid -->
  <rect width="1000" height="580" fill="#070d19" />
  <rect width="1000" height="580" fill="url(#grid-major)" />

  <!-- Outer Technical Drafting Frame -->
  <rect x="25" y="25" width="950" height="530" fill="none" stroke="#253e66" stroke-width="2" />
  <rect x="29" y="29" width="942" height="522" fill="none" stroke="#16233b" stroke-width="1" />

  <!-- Corner Precision Crosshairs -->
  <path d="M 15 25 L 35 25 M 25 15 L 25 35" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 965 25 L 985 25 M 975 15 L 975 35" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 15 555 L 35 555 M 25 545 L 25 565" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 965 555 L 985 555 M 975 545 L 975 565" stroke="#38bdf8" stroke-width="1.5" />

  <!-- TECHNICAL HEADER BLOCK -->
  <g transform="translate(50, 45)">
    <text x="0" y="16" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="3">GARETHENGLISH &#183; ADVANCED SYNTACTIC SCHEMATIC</text>
    <text x="0" y="38" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.5">STRUCTURAL VECTOR ANALYSIS: B2/6.5 vs C1/8.0</text>
    
    <!-- Title Block Info Tag (Right-Aligned) -->
    <g transform="translate(680, 0)">
      <rect x="0" y="0" width="220" height="42" fill="#0b172a" stroke="#203a61" stroke-width="1" rx="4" />
      <text x="12" y="16" fill="#64748b" font-size="9" font-weight="700" letter-spacing="1">REF: CAMBRIDGE-C1-SPEC-2026</text>
      <text x="12" y="32" fill="#d4af37" font-size="11" font-weight="800">STATUS: APPROVED FOR C1/8.0+</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- SPECIMEN A: FLAT B2 / BAND 6.5 TRUSS (CRITICAL STRESS FAILURE) -->
  <!-- ============================================================== -->
  <g transform="translate(50, 115)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="900" height="150" fill="url(#grad-fail)" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,4" rx="8" />
    
    <!-- Section Identifier Badge -->
    <rect x="15" y="-12" width="370" height="24" fill="#1e131d" stroke="#ef4444" stroke-width="1" rx="4" />
    <text x="25" y="4" fill="#f87171" font-size="10.5" font-weight="800" letter-spacing="1">&#9888; SPECIMEN A: FLAT B2 LOAD-BEARING TRUSS (BAND 6.0/6.5)</text>

    <!-- Sentence Flow Diagram: 4 Linear Boxes -->
    <!-- Box 1: Subject -->
    <g transform="translate(30, 35)">
      <rect x="0" y="0" width="130" height="50" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="6" />
      <text x="65" y="22" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">SUBJECT (PERSONAL)</text>
      <text x="65" y="38" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">&quot;I was worried&quot;</text>
    </g>

    <!-- Weak Connector 1 -->
    <path d="M 160 60 L 195 60" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />
    <text x="178" y="52" fill="#ef4444" font-size="9" font-weight="800" text-anchor="middle">because</text>

    <!-- Box 2: Verb &amp; Object -->
    <g transform="translate(200, 35)">
      <rect x="0" y="0" width="180" height="50" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="6" />
      <text x="90" y="22" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">NEGATIVE VERB CHAIN</text>
      <text x="90" y="38" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">&quot;the company didn't give&quot;</text>
    </g>

    <!-- Weak Connector 2 -->
    <path d="M 380 60 L 415 60" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />
    <text x="398" y="52" fill="#ef4444" font-size="9" font-weight="800" text-anchor="middle">any</text>

    <!-- Box 3: Vague Object -->
    <g transform="translate(420, 35)">
      <rect x="0" y="0" width="170" height="50" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="6" />
      <text x="85" y="22" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">COLLOQUIAL NOUN</text>
      <text x="85" y="38" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">&quot;clear instructions&quot;</text>
    </g>

    <!-- Weak Connector 3 -->
    <path d="M 590 60 L 625 60" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />
    <text x="608" y="52" fill="#ef4444" font-size="9" font-weight="800" text-anchor="middle">about</text>

    <!-- Box 4: Weak Modifier -->
    <g transform="translate(630, 35)">
      <rect x="0" y="0" width="140" height="50" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="6" />
      <text x="70" y="22" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">BASIC TIMING</text>
      <text x="70" y="38" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">&quot;the timeline.&quot;</text>
    </g>

    <!-- Diagnostic Annotations Below -->
    <g transform="translate(30, 105)">
      <!-- Warning Tag 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="28" fill="#2d1217" stroke="#7f1d1d" rx="4" />
        <text x="10" y="18" fill="#fca5a5" font-size="10" font-weight="700">&#10007; Informal Personal Stance (&quot;I was worried&quot;)</text>
      </g>
      <!-- Warning Tag 2 -->
      <g transform="translate(235, 0)">
        <rect x="0" y="0" width="230" height="28" fill="#2d1217" stroke="#7f1d1d" rx="4" />
        <text x="10" y="18" fill="#fca5a5" font-size="10" font-weight="700">&#10007; Linear Causal Chain (Subject + because + SVO)</text>
      </g>
      <!-- Result Stamp -->
      <g transform="translate(680, 0)">
        <rect x="0" y="0" width="180" height="28" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" rx="4" />
        <text x="90" y="18" fill="#fecaca" font-size="11" font-weight="800" text-anchor="middle">SCORE CEILING: BAND 6.5</text>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- SPECIMEN B: CANTILEVERED C1 ARCHITECTURE (BAND 8.0+ INTEGRITY)  -->
  <!-- ============================================================== -->
  <g transform="translate(50, 300)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="900" height="235" fill="url(#grad-pass)" stroke="#38bdf8" stroke-width="1.5" rx="8" />

    <!-- Section Identifier Badge -->
    <rect x="15" y="-12" width="410" height="24" fill="#042f2e" stroke="#34d399" stroke-width="1" rx="4" />
    <text x="25" y="4" fill="#6ee7b7" font-size="10.5" font-weight="800" letter-spacing="1">&#9889; SPECIMEN B: CANTILEVERED C1 ARCHITECTURE (BAND 7.5&#8211;8.5+)</text>

    <!-- Structural Arch Component 1: Wh- Focus Cleft (Keystone) -->
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="280" height="65" fill="#091e3a" stroke="#38bdf8" stroke-width="1.8" rx="6" />
      <text x="12" y="20" fill="#38bdf8" font-size="10" font-weight="800" letter-spacing="1">KEYSTONE &#183; WH- CLEFT INITIATOR</text>
      <text x="12" y="42" fill="#ffffff" font-size="14" font-weight="700">&quot;What caused the greatest anxiety&quot;</text>
      <text x="12" y="57" fill="#93c5fd" font-size="9.5" font-weight="600">Replaces personal emotion with depersonalised focus</text>
    </g>

    <!-- Fulcrum Vector (Copula Pivot) -->
    <g transform="translate(325, 42)">
      <circle cx="20" cy="20" r="18" fill="#d4af37" />
      <text x="20" y="25" fill="#000000" font-size="12" font-weight="900" text-anchor="middle">WAS</text>
      <!-- Vectors radiating -->
      <path d="M -15 20 L 0 20" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)" />
      <path d="M 40 20 L 55 20" stroke="#d4af37" stroke-width="2" marker-end="url(#arrow-gold)" />
    </g>

    <!-- Structural Arch Component 2: Nominalized Load Base -->
    <g transform="translate(395, 30)">
      <rect x="0" y="0" width="475" height="65" fill="#1e1b18" stroke="#d4af37" stroke-width="1.8" rx="6" />
      <text x="12" y="20" fill="#d4af37" font-size="10" font-weight="800" letter-spacing="1">LOAD-BEARING BASE &#183; DENSE NOMINAL CORE</text>
      <text x="12" y="42" fill="#ffffff" font-size="14" font-weight="700">&quot;the total absence of clear guidance...&quot;</text>
      <text x="12" y="57" fill="#fde68a" font-size="9.5" font-weight="600">Nominalisation: converts verb &quot;didn't give&quot; into high C1 noun architecture</text>
    </g>

    <!-- Secondary Syntactic Arch: Dynamic Participle Vector -->
    <g transform="translate(30, 115)">
      <rect x="0" y="0" width="600" height="52" fill="#062d24" stroke="#34d399" stroke-width="1.5" rx="6" />
      <text x="12" y="18" fill="#34d399" font-size="9.5" font-weight="800" letter-spacing="1">KINETIC VECTOR &#183; RESULTING PARTICIPLE CLAUSE (, thereby + -ing)</text>
      <text x="12" y="38" fill="#ecfdf5" font-size="13" font-weight="700">&quot;..., thereby jeopardising delivery of the core milestones.&quot;</text>
    </g>

    <!-- Examiner Score Stamps Box -->
    <g transform="translate(650, 115)">
      <rect x="0" y="0" width="220" height="98" fill="#0b172a" stroke="#38bdf8" stroke-width="1.5" rx="6" />
      <text x="110" y="22" fill="#38bdf8" font-size="10" font-weight="800" letter-spacing="1.5" text-anchor="middle">EXAMINER AUDIT RATING</text>
      <line x1="15" y1="30" x2="205" y2="30" stroke="#1e293b" stroke-width="1" />
      
      <text x="20" y="48" fill="#94a3b8" font-size="10" font-weight="600">Grammatical Range:</text>
      <text x="195" y="48" fill="#34d399" font-size="12" font-weight="800" text-anchor="end">Band 8.0 / 8.5</text>
      
      <text x="20" y="68" fill="#94a3b8" font-size="10" font-weight="600">Coherence &amp; Flow:</text>
      <text x="195" y="68" fill="#34d399" font-size="12" font-weight="800" text-anchor="end">Seamless (9.0)</text>

      <text x="20" y="88" fill="#94a3b8" font-size="10" font-weight="600">Task Register:</text>
      <text x="195" y="88" fill="#d4af37" font-size="12" font-weight="800" text-anchor="end">Academic C1</text>
    </g>

    <!-- Blueprint Annotations & Legend -->
    <g transform="translate(30, 185)">
      <text x="0" y="14" fill="#94a3b8" font-size="10.5" font-weight="600">
        <tspan fill="#38bdf8">&#10003; Wh- Cleft Focus</tspan> &#183; 
        <tspan fill="#d4af37">&#10003; Dense Nominalisation</tspan> &#183; 
        <tspan fill="#34d399">&#10003; Trailing Participle Consequence</tspan> &#183; 
        <tspan fill="#ffffff">&#10003; Zero Memorised Template Clich&#233;s</tspan>
      </text>
    </g>
  </g>

  <!-- Technical Footer Bar -->
  <g transform="translate(50, 545)">
    <text x="0" y="10" fill="#475569" font-size="9" font-family="monospace">FIG 1.0 // DISCOURSE VECTOR DECONSTRUCTION // GARETHENGLISH METHODOLOGY // VERIFIED BELFAST MET CIR. 2008-2026</text>
  </g>
</svg>
