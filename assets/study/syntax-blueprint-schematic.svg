<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
  <defs>
    <pattern id="editorial-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="1000" height="580" fill="#0b1324" />
  <rect width="1000" height="580" fill="url(#editorial-grid)" />
  <rect x="24" y="24" width="952" height="532" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(52, 50)" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif">
    <text x="0" y="16" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="2.2">GARETH MONTGOMERY &#183; C1 SENTENCE ANATOMY</text>
    <text x="0" y="46" fill="#f8fafc" font-size="24" font-weight="800">Why Linear Band 6.5 Clauses Stall vs. Balanced C1 Focus</text>
    <rect x="700" y="2" width="196" height="42" rx="8" fill="#172554" stroke="#38bdf8" stroke-width="1.5" />
    <text x="798" y="20" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">EXAMINER BENCHMARK</text>
    <text x="798" y="36" fill="#fbbf24" font-size="13" font-weight="800" text-anchor="middle">BAND 6.5 &#8594; BAND 8.0+</text>
  </g>

  <!-- Panel A: Flat B2 / Band 6.5 -->
  <g transform="translate(52, 122)" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="896" height="152" rx="10" fill="#1f1218" stroke="#f87171" stroke-width="2" stroke-dasharray="8 5" />
    <rect x="18" y="-13" width="380" height="26" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1.5" />
    <text x="30" y="4" fill="#fecaca" font-size="12" font-weight="800" letter-spacing="0.8">BEFORE: FLAT LINEAR CLAUSE (BAND 6.0 / 6.5)</text>

    <g transform="translate(24, 34)">
      <rect x="0" y="0" width="160" height="58" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
      <text x="80" y="22" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">PERSONAL OPENER</text>
      <text x="80" y="44" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">"I was worried"</text>
    </g>
    <line x1="184" y1="63" x2="226" y2="63" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-red)" />
    <text x="205" y="53" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">because</text>

    <g transform="translate(234, 34)">
      <rect x="0" y="0" width="212" height="58" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
      <text x="106" y="22" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">SPOKEN NEGATIVE VERB</text>
      <text x="106" y="44" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">"the company didn't give"</text>
    </g>
    <line x1="446" y1="63" x2="486" y2="63" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-red)" />
    <text x="466" y="53" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">any</text>

    <g transform="translate(494, 34)">
      <rect x="0" y="0" width="186" height="58" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
      <text x="93" y="22" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">PLAIN OBJECT</text>
      <text x="93" y="44" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">"clear instructions"</text>
    </g>
    <line x1="680" y1="63" x2="718" y2="63" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-red)" />
    <text x="699" y="53" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">about</text>

    <g transform="translate(724, 34)">
      <rect x="0" y="0" width="148" height="58" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
      <text x="74" y="22" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">END FOCUS</text>
      <text x="74" y="44" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">"the timeline."</text>
    </g>

    <g transform="translate(24, 108)">
      <rect x="0" y="0" width="276" height="30" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1.2" />
      <text x="14" y="20" fill="#fecaca" font-size="12" font-weight="700">&#10007; Personal tone ("I was worried")</text>
      <rect x="290" y="0" width="330" height="30" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1.2" />
      <text x="304" y="20" fill="#fecaca" font-size="12" font-weight="700">&#10007; Predictable SVO + because chain</text>
      <rect x="652" y="0" width="196" height="30" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5" />
      <text x="750" y="20" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">CEILING: BAND 6.5</text>
    </g>
  </g>

  <!-- Panel B: Balanced C1 / Band 8.0+ -->
  <g transform="translate(52, 304)" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="896" height="224" rx="10" fill="#0d2238" stroke="#38bdf8" stroke-width="2" />
    <rect x="18" y="-13" width="440" height="26" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="30" y="4" fill="#a7f3d0" font-size="12" font-weight="800" letter-spacing="0.8">AFTER: BALANCED C1 FOCUS &amp; PARTICIPLE FRAME (BAND 8.0+)</text>

    <g transform="translate(24, 28)">
      <rect x="0" y="0" width="310" height="72" rx="8" fill="#0f294a" stroke="#38bdf8" stroke-width="2" />
      <text x="14" y="22" fill="#7dd3fc" font-size="11" font-weight="800" letter-spacing="0.8">1. WH- CLEFT OPENER</text>
      <text x="14" y="46" fill="#ffffff" font-size="15.5" font-weight="800">"What caused the greatest concern"</text>
      <text x="14" y="63" fill="#bae6fd" font-size="11" font-weight="600">Shifts away from personal "I" to objective focus</text>
    </g>

    <g transform="translate(346, 42)">
      <line x1="-10" y1="22" x2="8" y2="22" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-sky)" />
      <circle cx="34" cy="22" r="22" fill="#fbbf24" />
      <text x="34" y="27" fill="#0f172a" font-size="13" font-weight="900" text-anchor="middle">WAS</text>
      <line x1="56" y1="22" x2="74" y2="22" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arr-gold)" />
    </g>

    <g transform="translate(428, 28)">
      <rect x="0" y="0" width="444" height="72" rx="8" fill="#1e2433" stroke="#fbbf24" stroke-width="2" />
      <text x="14" y="22" fill="#fde68a" font-size="11" font-weight="800" letter-spacing="0.8">2. COMPACT NOMINAL CORE</text>
      <text x="14" y="46" fill="#ffffff" font-size="15.5" font-weight="800">"the complete absence of clear guidance..."</text>
      <text x="14" y="63" fill="#fef3c7" font-size="11" font-weight="600">Packs "didn't give any" into crisp formal noun phrasing</text>
    </g>

    <g transform="translate(24, 118)">
      <rect x="0" y="0" width="600" height="62" rx="8" fill="#06372c" stroke="#34d399" stroke-width="2" />
      <text x="14" y="22" fill="#6ee7b7" font-size="11" font-weight="800" letter-spacing="0.8">3. TRAILING PARTICIPLE CONSEQUENCE (, thereby + -ing)</text>
      <text x="14" y="46" fill="#ffffff" font-size="15" font-weight="700">"..., thereby jeopardising delivery of the core milestones."</text>
    </g>

    <g transform="translate(642, 118)">
      <rect x="0" y="0" width="230" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
      <text x="115" y="22" fill="#7dd3fc" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">EXAMINER SCORECARD</text>
      <line x1="16" y1="30" x2="214" y2="30" stroke="#334155" stroke-width="1" />
      <text x="18" y="50" fill="#cbd5e1" font-size="12" font-weight="600">Grammar Range</text>
      <text x="212" y="50" fill="#34d399" font-size="13" font-weight="800" text-anchor="end">Band 8.0+</text>
      <text x="18" y="74" fill="#cbd5e1" font-size="12" font-weight="600">Register Control</text>
      <text x="212" y="74" fill="#fbbf24" font-size="13" font-weight="800" text-anchor="end">Natural C1</text>
    </g>

    <g transform="translate(24, 198)">
      <text x="0" y="8" fill="#e2e8f0" font-size="12" font-weight="700">
        <tspan fill="#7dd3fc">&#10003; Wh- Cleft Focus</tspan>   &#183;   
        <tspan fill="#fde68a">&#10003; Crisp Nominalisation</tspan>   &#183;   
        <tspan fill="#6ee7b7">&#10003; Participle Result</tspan>   &#183;   
        <tspan fill="#ffffff">&#10003; Zero Template Padding</tspan>
      </text>
    </g>
  </g>
</svg>
