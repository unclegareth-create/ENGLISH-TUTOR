<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="bg3d" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07040e"/>
      <stop offset="50%" stop-color="#150d2a"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="320" cy="148" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#4f46e5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#07040e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg3d)"/>
  <!-- 3D First-Person Corridor Perspective Lines -->
  <g stroke="#312e81" stroke-width="1.5" opacity="0.65">
    <line x1="0" y1="0" x2="210" y2="95"/>
    <line x1="640" y1="0" x2="430" y2="95"/>
    <line x1="0" y1="275" x2="210" y2="205"/>
    <line x1="640" y1="275" x2="430" y2="205"/>
    <rect x="110" y="48" width="420" height="195" stroke="#4338ca" stroke-width="1.5" fill="none"/>
    <rect x="210" y="95" width="220" height="110" stroke="#6366f1" stroke-width="2" fill="#0b0719"/>
  </g>
  <circle cx="320" cy="148" r="105" fill="url(#portalGlow)"/>
  <!-- Top 3D Engine HUD -->
  <rect x="18" y="14" width="604" height="32" rx="8" fill="#090d1f" stroke="#4338ca" stroke-width="1.5"/>
  <text x="34" y="34" fill="#a5b4fc" font-family="monospace, sans-serif" font-size="11" font-weight="800">CHAMBER 04/25 • WEBGL 3D DUNGEON</text>
  <text x="598" y="34" text-anchor="end" fill="#fbbf24" font-family="monospace, sans-serif" font-size="11" font-weight="800">TORCH: 88% • HP ♥♥♥</text>
  <!-- Center Gate Key Word Prompt -->
  <rect x="234" y="112" width="172" height="74" rx="10" fill="#13102b" stroke="#818cf8" stroke-width="2"/>
  <text x="320" y="135" text-anchor="middle" fill="#c7d2fe" font-family="monospace, sans-serif" font-size="10" font-weight="700">PART 4 KEY WORD GATE</text>
  <text x="320" y="160" text-anchor="middle" fill="#fbbf24" font-family="monospace, sans-serif" font-size="18" font-weight="900" letter-spacing="2">SOONER</text>
  <text x="320" y="176" text-anchor="middle" fill="#34d399" font-family="monospace, sans-serif" font-size="9" font-weight="700">[WASD / CLICK TO UNLOCK]</text>
  <!-- Bottom Live Transformation Input Console -->
  <rect x="18" y="254" width="604" height="90" rx="12" fill="#090d1f" stroke="#4f46e5" stroke-width="2"/>
  <text x="36" y="278" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">“The moment the gate opened, the torches flared.”</text>
  <rect x="36" y="290" width="430" height="36" rx="8" fill="#040711" stroke="#6366f1" stroke-width="1.5"/>
  <text x="50" y="313" fill="#38bdf8" font-family="monospace, sans-serif" font-size="13" font-weight="800">No sooner had the gate opened</text>
  <rect x="478" y="290" width="126" height="36" rx="8" fill="#4f46e5"/>
  <text x="541" y="313" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="800">CAST SPELL →</text>
</svg>
