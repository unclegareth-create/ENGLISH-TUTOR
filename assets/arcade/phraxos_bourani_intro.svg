<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <!-- Twilight & Golden Hour Aegean Sky -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071126"/>
      <stop offset="28%" stop-color="#172a52"/>
      <stop offset="56%" stop-color="#4c2c54"/>
      <stop offset="78%" stop-color="#b4532a"/>
      <stop offset="94%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Setting Sun & Firelight Aura -->
    <radialGradient id="sunGlow" cx="0.64" cy="0.54" r="0.42">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="18%" stop-color="#fde047" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#9a3412" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#071126" stop-opacity="0"/>
    </radialGradient>

    <!-- Aegean Sea Gradient -->
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="18%" stop-color="#0369a1"/>
      <stop offset="55%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#06192d"/>
    </linearGradient>

    <!-- Pentelic Marble Lit by Firelight -->
    <linearGradient id="marbleLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="terracotta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Brazier Fire Glow -->
    <radialGradient id="fireAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#fb923c" stop-opacity="0.72"/>
      <stop offset="65%" stop-color="#ea580c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="flameGrad" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="72%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flagstoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#1e293b" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <!-- 1. Sky & Sun -->
  <rect width="800" height="420" fill="url(#skyGrad)"/>
  <rect width="800" height="420" fill="url(#sunGlow)"/>
  <circle cx="512" cy="218" r="46" fill="#fef9c3" opacity="0.92"/>
  <circle cx="512" cy="218" r="72" fill="#f59e0b" opacity="0.28"/>

  <!-- Stars in Upper Twilight Sky -->
  <g fill="#fef08a" opacity="0.65">
    <circle cx="95" cy="38" r="1.3"/><circle cx="168" cy="24" r="1.0"/><circle cx="255" cy="48" r="1.4"/>
    <circle cx="340" cy="29" r="1.1"/><circle cx="445" cy="36" r="1.5"/><circle cx="590" cy="28" r="1.2"/>
    <circle cx="675" cy="44" r="1.4"/><circle cx="742" cy="26" r="1.0"/><circle cx="132" cy="72" r="1.1"/>
  </g>

  <!-- 2. Distant Peloponnese & Spetses/Phraxos Headlands -->
  <path d="M0,232 L75,204 L155,214 L245,182 L330,208 L415,222 L465,232 Z" fill="#1e1b4b" opacity="0.78"/>
  <path d="M555,232 L615,196 L690,174 L765,192 L800,178 L800,232 Z" fill="#1e1b4b" opacity="0.82"/>

  <!-- 3. Aegean Sea & Shimmering Sun/Fire Reflections -->
  <rect x="0" y="230" width="800" height="190" fill="url(#seaGrad)"/>
  <g fill="#fde047" opacity="0.65">
    <ellipse cx="512" cy="238" rx="68" ry="2.2"/>
    <ellipse cx="512" cy="246" rx="58" ry="2.0"/>
    <ellipse cx="510" cy="256" rx="74" ry="2.5"/>
    <ellipse cx="514" cy="268" rx="52" ry="2.2"/>
    <ellipse cx="508" cy="282" rx="64" ry="2.6"/>
    <ellipse cx="515" cy="298" rx="45" ry="2.0"/>
    <ellipse cx="512" cy="316" rx="36" ry="1.8"/>
  </g>

  <!-- 4. Craggy Phraxos Limestone Cliffs & Aleppo Pines (Left & Right) -->
  <path d="M0,125 L62,138 L118,168 L175,218 L215,268 L0,268 Z" fill="#1e293b"/>
  <path d="M0,135 L48,148 L96,178 L142,225 L0,255 Z" fill="#334155" opacity="0.65"/>
  <path d="M635,260 L678,195 L732,148 L800,118 L800,275 Z" fill="#1e293b"/>
  <path d="M668,255 L708,198 L758,158 L800,136 L800,265 Z" fill="#475569" opacity="0.45"/>

  <!-- Mediterranean Cypress & Aleppo Pine Silhouettes -->
  <g fill="#062c1e">
    <path d="M28,245 C22,185 32,135 38,92 C44,135 54,185 48,245 Z"/>
    <path d="M58,252 C53,202 61,158 66,118 C71,158 79,202 74,252 Z"/>
    <path d="M748,248 C742,188 752,132 758,86 C764,132 774,188 768,248 Z"/>
    <path d="M718,254 C713,204 721,162 726,124 C731,162 739,204 734,254 Z"/>
  </g>
  <!-- Umbrella Aleppo Pine Canopy Left -->
  <ellipse cx="112" cy="152" rx="48" ry="18" fill="#064e3b"/>
  <ellipse cx="128" cy="144" rx="38" ry="14" fill="#047857" opacity="0.7"/>
  <path d="M108,245 L114,156 L120,156 L115,245 Z" fill="#451a03"/>

  <!-- 5. Villa Bourani Classical Neoclassical Colonnade & Pediment (Left-Center) -->
  <g transform="translate(88, 128)">
    <!-- Terracotta Roof & Pediment -->
    <polygon points="-12,42 108,-6 228,42" fill="url(#terracotta)" stroke="#fdba74" stroke-width="1.5"/>
    <polygon points="4,38 108,-1 212,38" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <!-- Golden Phi Relief in Pediment -->
    <circle cx="108" cy="21" r="9" fill="none" stroke="#facc15" stroke-width="2.2"/>
    <line x1="108" y1="8" x2="108" y2="34" stroke="#facc15" stroke-width="2.2"/>
    <!-- Architrave -->
    <rect x="-4" y="42" width="224" height="12" fill="url(#marbleLit)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Villa Inner Shadow & Lit Windows -->
    <rect x="8" y="54" width="200" height="106" fill="#0f172a"/>
    <!-- Warm Firelit French Doors -->
    <rect x="38" y="74" width="28" height="72" rx="14" fill="#ea580c" opacity="0.85"/>
    <rect x="42" y="78" width="20" height="64" rx="10" fill="#fef08a" opacity="0.9"/>
    <rect x="94" y="74" width="28" height="72" rx="14" fill="#ea580c" opacity="0.85"/>
    <rect x="98" y="78" width="20" height="64" rx="10" fill="#fef08a" opacity="0.9"/>
    <rect x="150" y="74" width="28" height="72" rx="14" fill="#ea580c" opacity="0.85"/>
    <rect x="154" y="78" width="20" height="64" rx="10" fill="#fef08a" opacity="0.9"/>

    <!-- Fluted Doric Marble Columns -->
    <g fill="url(#marbleLit)">
      <rect x="10" y="54" width="16" height="106"/>
      <rect x="68" y="54" width="16" height="106"/>
      <rect x="132" y="54" width="16" height="106"/>
      <rect x="190" y="54" width="16" height="106"/>
      <!-- Capitals -->
      <rect x="6" y="54" width="24" height="6" rx="2"/>
      <rect x="64" y="54" width="24" height="6" rx="2"/>
      <rect x="128" y="54" width="24" height="6" rx="2"/>
      <rect x="186" y="54" width="24" height="6" rx="2"/>
    </g>
    <!-- Marble Steps -->
    <rect x="-10" y="160" width="236" height="8" fill="#e2e8f0"/>
    <rect x="-18" y="168" width="252" height="9" fill="#cbd5e1"/>
  </g>

  <!-- 6. Foreground Flagstone Terrace & Perspective Grid -->
  <polygon points="0,295 800,295 800,420 0,420" fill="url(#flagstoneGrad)"/>
  <g stroke="#f59e0b" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="318" x2="800" y2="318"/>
    <line x1="0" y1="346" x2="800" y2="346"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="400" y1="295" x2="80" y2="420"/>
    <line x1="400" y1="295" x2="240" y2="420"/>
    <line x1="400" y1="295" x2="400" y2="420"/>
    <line x1="400" y1="295" x2="560" y2="420"/>
    <line x1="400" y1="295" x2="720" y2="420"/>
  </g>

  <!-- 7. Foreground Stone Grammar Altar & Glowing Carved Tablets (Right-Center) -->
  <g transform="translate(545, 225)">
    <polygon points="0,58 148,58 164,118 -16,118" fill="#1e293b" stroke="#d97706" stroke-width="1.8"/>
    <polygon points="6,26 142,26 148,58 0,58" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- 3 Glowing Socket Tablets -->
    <rect x="15" y="33" width="34" height="18" rx="2" fill="#1e3a8a" stroke="#facc15" stroke-width="1.4"/>
    <rect x="57" y="33" width="34" height="18" rx="2" fill="#1e3a8a" stroke="#facc15" stroke-width="1.4"/>
    <rect x="99" y="33" width="34" height="18" rx="2" fill="#065f46" stroke="#34d399" stroke-width="1.4"/>
  </g>

  <!-- 8. Flaming Greek Bronze Tripod Braziers (Left & Right of Terrace) -->
  <!-- Brazier 1 (Center-Left) -->
  <g transform="translate(368, 222)">
    <circle cx="24" cy="18" r="68" fill="url(#fireAura)"/>
    <!-- Dancing Flame Plumes -->
    <path d="M10,36 C6,12 18,-8 24,-24 C30,-8 42,12 38,36 Z" fill="url(#flameGrad)"/>
    <path d="M16,36 C14,18 22,2 24,-10 C28,2 34,18 32,36 Z" fill="#fef08a" opacity="0.9"/>
    <!-- Bronze Bowl -->
    <path d="M4,34 L44,34 L36,48 L12,48 Z" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Tripod Legs -->
    <line x1="12" y1="48" x2="2" y2="96" stroke="#b45309" stroke-width="3.5"/>
    <line x1="24" y1="48" x2="24" y2="98" stroke="#d97706" stroke-width="3.5"/>
    <line x1="36" y1="48" x2="46" y2="96" stroke="#b45309" stroke-width="3.5"/>
    <!-- Rising Sparks -->
    <circle cx="20" cy="-30" r="2" fill="#fef08a"/>
    <circle cx="29" cy="-42" r="1.5" fill="#fb923c"/>
    <circle cx="16" cy="-52" r="1.3" fill="#fde047"/>
  </g>

  <!-- Brazier 2 (Far Right) -->
  <g transform="translate(715, 228) scale(0.88)">
    <circle cx="24" cy="18" r="62" fill="url(#fireAura)"/>
    <path d="M10,36 C6,12 18,-8 24,-24 C30,-8 42,12 38,36 Z" fill="url(#flameGrad)"/>
    <path d="M16,36 C14,18 22,2 24,-10 C28,2 34,18 32,36 Z" fill="#fef08a" opacity="0.9"/>
    <path d="M4,34 L44,34 L36,48 L12,48 Z" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="12" y1="48" x2="2" y2="96" stroke="#b45309" stroke-width="3.5"/>
    <line x1="24" y1="48" x2="24" y2="98" stroke="#d97706" stroke-width="3.5"/>
    <line x1="36" y1="48" x2="46" y2="96" stroke="#b45309" stroke-width="3.5"/>
  </g>
</svg>
