<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" shape-rendering="crispEdges">
  <defs>
    <pattern id="ditherMagenta" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <rect x="0" y="0" width="1" height="1" fill="#ff00ff"/>
      <rect x="2" y="2" width="1" height="1" fill="#ff00ff"/>
    </pattern>
    <pattern id="ditherCheckCounter" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <rect x="0" y="0" width="2" height="2" fill="#0000ff"/>
      <rect x="2" y="2" width="2" height="2" fill="#0000ff"/>
    </pattern>
    <pattern id="ditherBluePortrait" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <rect x="0" y="0" width="1" height="1" fill="#0000ff"/>
      <rect x="2" y="2" width="1" height="1" fill="#0000ff"/>
    </pattern>
    <pattern id="ditherSkinHero" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#ffff00"/>
      <rect x="0" y="0" width="1" height="1" fill="#ff0000"/>
      <rect x="2" y="2" width="1" height="1" fill="#ff0000"/>
    </pattern>
    <pattern id="scanlinesHero" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="4" height="2" fill="#000000" fill-opacity="0.32"/>
    </pattern>
  </defs>

  <!-- PC-88 Outer Frame -->
  <rect width="640" height="360" fill="#000000"/>
  <rect x="2" y="2" width="636" height="356" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="6" y="6" width="628" height="348" fill="none" stroke="#0000ff" stroke-width="2"/>

  <!-- Top Status Bar with Live HUD Stats -->
  <rect x="8" y="8" width="624" height="22" fill="#0000ff"/>
  <text x="16" y="23" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">CHRONICLE ’88 · SECTOR 4 · NOODLE BAR 88</text>
  <text x="624" y="23" text-anchor="end" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">STA 12/12 · CMP 7 · TOK 3</text>

  <!-- ================= PIXEL SCENE CANVAS (y: 30..234) ================= -->
  <g transform="translate(0, 30)">
    <rect x="8" y="0" width="624" height="134" fill="url(#ditherMagenta)"/>
    <!-- Vertical Neon Wall Strips -->
    <g fill="#ff00ff">
      <rect x="28" y="0" width="4" height="134"/>
      <rect x="108" y="0" width="4" height="134"/>
      <rect x="188" y="0" width="4" height="134"/>
      <rect x="268" y="0" width="4" height="134"/>
      <rect x="348" y="0" width="4" height="134"/>
      <rect x="428" y="0" width="4" height="134"/>
    </g>

    <!-- Location Badge Top-Left -->
    <rect x="16" y="8" width="144" height="22" fill="#000000" stroke="#ffff00" stroke-width="2"/>
    <text x="24" y="23" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="11" font-weight="bold">NOODLE BAR 88</text>

    <!-- Left Arcade/Menu Console Bank -->
    <rect x="16" y="36" width="136" height="90" fill="#ffffff"/>
    <rect x="18" y="38" width="132" height="86" fill="#000000"/>
    <rect x="22" y="42" width="124" height="16" fill="#ff00ff"/>
    <text x="26" y="54" fill="#ffffff" font-family="'Courier New', monospace" font-size="10" font-weight="bold">EVIDENCE FOUND</text>
    <text x="24" y="72" fill="#ffff00" font-family="'Courier New', monospace" font-size="10" font-weight="bold">◆ LOYALTY CARD:</text>
    <text x="24" y="86" fill="#00ffff" font-family="'Courier New', monospace" font-size="9">9 RAMEN STAMPS</text>
    <text x="24" y="102" fill="#00ff00" font-family="'Courier New', monospace" font-size="9">KAEL LIES ABOUT</text>
    <text x="24" y="114" fill="#00ff00" font-family="'Courier New', monospace" font-size="9">SECTOR 4 ALIBI!</text>

    <!-- Giant Neon "NOODLE 88" Signboard -->
    <rect x="168" y="10" width="244" height="44" fill="#ff00ff"/>
    <rect x="172" y="14" width="236" height="36" fill="#000000"/>
    <text x="290" y="39" text-anchor="middle" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="22" font-weight="bold">NOODLE BAR 88</text>

    <!-- Hanging Menu Lanterns / Bottles Behind Counter -->
    <g>
      <rect x="178" y="62" width="28" height="36" fill="#0000ff"/><rect x="180" y="64" width="24" height="32" fill="#000000"/><rect x="184" y="72" width="16" height="6" fill="#ff00ff"/>
      <rect x="222" y="62" width="28" height="36" fill="#0000ff"/><rect x="224" y="64" width="24" height="32" fill="#000000"/><rect x="228" y="72" width="16" height="6" fill="#00ffff"/>
      <rect x="266" y="62" width="28" height="36" fill="#0000ff"/><rect x="268" y="64" width="24" height="32" fill="#000000"/><rect x="272" y="72" width="16" height="6" fill="#ff00ff"/>
      <rect x="310" y="62" width="28" height="36" fill="#0000ff"/><rect x="312" y="64" width="24" height="32" fill="#000000"/><rect x="316" y="72" width="16" height="6" fill="#00ffff"/>
      <rect x="354" y="62" width="28" height="36" fill="#0000ff"/><rect x="356" y="64" width="24" height="32" fill="#000000"/><rect x="360" y="72" width="16" height="6" fill="#ff00ff"/>
    </g>

    <!-- Ceiling Security Turret + Red Targeting Laser -->
    <rect x="452" y="0" width="8" height="18" fill="#ffffff"/>
    <rect x="432" y="18" width="48" height="16" fill="#ffffff"/>
    <rect x="434" y="20" width="44" height="12" fill="#0000ff"/>
    <rect x="450" y="28" width="12" height="6" fill="#ff0000"/>
    <!-- Red Laser Sight Beam -->
    <rect x="455" y="34" width="2" height="98" fill="#ff0000"/>

    <!-- Kael at the Noodle Counter (Magenta Coat, Green Hair) -->
    <g transform="translate(254, 78)">
      <rect x="2" y="0" width="22" height="7" fill="#00ff00"/>
      <rect x="0" y="5" width="26" height="16" fill="url(#ditherSkinHero)"/>
      <rect x="2" y="9" width="22" height="5" fill="#00ffff"/>
      <rect x="-4" y="21" width="34" height="35" fill="#ff00ff"/>
      <rect x="9" y="21" width="8" height="12" fill="#ffffff"/>
      <rect x="12" y="23" width="2" height="12" fill="#ffff00"/>
    </g>

    <!-- Noodle Cook (White Coat, Yellow Hair) -->
    <g transform="translate(402, 78)">
      <rect x="2" y="0" width="22" height="7" fill="#ffff00"/>
      <rect x="0" y="5" width="26" height="16" fill="url(#ditherSkinHero)"/>
      <rect x="5" y="9" width="4" height="3" fill="#000000"/>
      <rect x="16" y="9" width="4" height="3" fill="#000000"/>
      <rect x="-4" y="21" width="34" height="35" fill="#ffffff"/>
      <rect x="9" y="21" width="8" height="12" fill="#ff0000"/>
    </g>

    <!-- Steaming Ramen Bowl on Counter -->
    <ellipse cx="308" cy="128" rx="18" ry="5" fill="#ffffff"/>
    <ellipse cx="308" cy="129" rx="14" ry="3" fill="#ff0000"/>
    <rect x="302" y="114" width="4" height="3" fill="#ffffff"/>
    <rect x="308" y="108" width="4" height="3" fill="#ffffff"/>
    <rect x="312" y="116" width="4" height="3" fill="#ffffff"/>

    <!-- Noodle Bar Countertop & Checkered Front -->
    <rect x="8" y="132" width="490" height="6" fill="#ffffff"/>
    <rect x="8" y="138" width="490" height="4" fill="#00ffff"/>
    <rect x="8" y="142" width="490" height="62" fill="url(#ditherCheckCounter)"/>

    <!-- 2d6 Hazard Roll Overlay Box on Counter -->
    <g transform="translate(168, 150)">
      <rect x="0" y="0" width="268" height="44" fill="#000000" stroke="#00ff00" stroke-width="2"/>
      <rect x="10" y="8" width="28" height="28" fill="#000000" stroke="#ffffff" stroke-width="2"/>
      <text x="24" y="27" text-anchor="middle" fill="#ffff00" font-family="'DotGothic16', monospace" font-size="16" font-weight="bold">2</text>
      <rect x="44" y="8" width="28" height="28" fill="#000000" stroke="#ffffff" stroke-width="2"/>
      <text x="58" y="27" text-anchor="middle" fill="#ffff00" font-family="'DotGothic16', monospace" font-size="16" font-weight="bold">4</text>
      <text x="84" y="21" fill="#00ff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="12" font-weight="bold">ROLLED 6 ≤ CMP 8 (SAFE!)</text>
      <text x="84" y="36" fill="#ffffff" font-family="'Courier New', monospace" font-size="10">Turret misses! Kael drops chopsticks.</text>
    </g>

    <!-- Right-Hand Talking Character Portrait Window (INSPECTOR DECK) -->
    <g transform="translate(506, 10)">
      <rect x="-2" y="-2" width="122" height="122" fill="#000000"/>
      <rect x="0" y="0" width="118" height="118" fill="#ff00ff"/>
      <rect x="2" y="2" width="114" height="114" fill="#ffffff"/>
      <rect x="4" y="4" width="110" height="96" fill="url(#ditherBluePortrait)"/>
      <!-- Inspector Deck Trenchcoat & Tie -->
      <rect x="17" y="72" width="84" height="28" fill="#0000ff"/>
      <rect x="43" y="72" width="32" height="28" fill="#ffffff"/>
      <rect x="53" y="74" width="12" height="26" fill="#ffff00"/>
      <!-- Neck & Face -->
      <rect x="49" y="62" width="20" height="14" fill="#ffff00"/>
      <rect x="41" y="28" width="36" height="36" fill="url(#ditherSkinHero)"/>
      <!-- Magenta Detective Hair -->
      <rect x="37" y="18" width="44" height="12" fill="#ff00ff"/>
      <rect x="37" y="26" width="6" height="24" fill="#ff00ff"/>
      <rect x="75" y="26" width="6" height="24" fill="#ff00ff"/>
      <rect x="45" y="20" width="12" height="2" fill="#ffffff"/>
      <!-- Eyes -->
      <rect x="45" y="36" width="10" height="2" fill="#000000"/>
      <rect x="63" y="36" width="10" height="2" fill="#000000"/>
      <rect x="46" y="39" width="8" height="5" fill="#ffffff"/>
      <rect x="64" y="39" width="8" height="5" fill="#ffffff"/>
      <rect x="48" y="39" width="5" height="5" fill="#0000ff"/>
      <rect x="66" y="39" width="5" height="5" fill="#0000ff"/>
      <!-- Nose & Talking Mouth -->
      <rect x="58" y="47" width="2" height="5" fill="#ff0000"/>
      <rect x="53" y="55" width="12" height="5" fill="#000000"/>
      <rect x="55" y="56" width="8" height="3" fill="#ff0000"/>
      <!-- Portrait Nameplate -->
      <rect x="2" y="100" width="114" height="16" fill="#000000"/>
      <rect x="2" y="100" width="114" height="2" fill="#ff00ff"/>
      <text x="10" y="112" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="11" font-weight="bold">INSP. DECK</text>
      <rect x="106" y="106" width="5" height="5" fill="#00ff00"/>
    </g>

    <!-- Episode Switcher Mini Pill Below Portrait -->
    <g transform="translate(506, 138)">
      <rect x="0" y="0" width="118" height="56" fill="#000000" stroke="#0000ff" stroke-width="2"/>
      <text x="8" y="16" fill="#00ffff" font-family="'Courier New', monospace" font-size="9" font-weight="bold">3 PLAYABLE TAPES:</text>
      <text x="8" y="30" fill="#ffff00" font-family="'Courier New', monospace" font-size="9" font-weight="bold">1. NEON ALIBI</text>
      <text x="8" y="41" fill="#00ff00" font-family="'Courier New', monospace" font-size="9" font-weight="bold">2. CITADEL ECHOES</text>
      <text x="8" y="52" fill="#ffffff" font-family="'Courier New', monospace" font-size="9" font-weight="bold">3. STATION ZERO</text>
    </g>
  </g>

  <!-- Divider Line Between CG Viewport & Lower Split Window -->
  <rect x="8" y="234" width="624" height="2" fill="#ffffff"/>

  <!-- ================= LOWER SPLIT WINDOW (y: 236..352) ================= -->
  <!-- Left Text Window -->
  <rect x="8" y="236" width="462" height="116" fill="#000000"/>
  <text x="20" y="258" fill="#00ffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="14" font-weight="bold">『INSPECTOR DECK』</text>
  <text x="20" y="282" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13">“Nine stamps on your Noodle Bar 88 card, Kael. You’d</text>
  <text x="20" y="306" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13">never entered Sector 4 before tonight, </text>
  <text x="292" y="306" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">had you</text>
  <text x="350" y="306" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13">?”</text>

  <text x="20" y="334" fill="#00ff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="12" font-weight="bold">✔ Kael drops his chopsticks. The lie is over!</text>
  <text x="448" y="340" fill="#ffff00" font-family="monospace" font-size="14">▼</text>

  <!-- Vertical Split Border -->
  <rect x="470" y="236" width="2" height="116" fill="#ffffff"/>

  <!-- Right Command Menu Window -->
  <rect x="472" y="236" width="160" height="116" fill="#000000"/>
  <text x="484" y="255" fill="#ff00ff" font-family="'DotGothic16', 'Courier New', monospace" font-size="12" font-weight="bold">COMMAND</text>
  <text x="484" y="276" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13"><tspan fill="#ffff00">1</tspan> LOOK</text>
  <text x="484" y="296" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13"><tspan fill="#ffff00">2</tspan> TALK</text>
  <text x="484" y="316" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13"><tspan fill="#ffff00">3</tspan> EXAMINE</text>
  <rect x="478" y="323" width="148" height="22" fill="#0000ff"/>
  <text x="484" y="339" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">▶ 4 CHALLENGE</text>

  <!-- Authentic CRT Scanline Overlay -->
  <rect width="640" height="360" fill="url(#scanlinesHero)" pointer-events="none"/>
</svg>
