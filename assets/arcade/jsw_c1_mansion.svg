<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="100%" stop-color="#141826"/>
    </linearGradient>
    <linearGradient id="crtGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- ZX Cabinet Frame -->
  <rect width="640" height="360" rx="14" fill="url(#bgSky)"/>
  <rect x="8" y="8" width="624" height="344" rx="10" stroke="#2a2f42" stroke-width="2"/>

  <!-- Spectrum Diagonal Rainbow Ribbon -->
  <g clip-path="inset(0 round 10px)">
    <polygon points="480,8 516,8 370,154 334,154" fill="#d70000" opacity="0.88"/>
    <polygon points="516,8 552,8 406,154 370,154" fill="#d7d700" opacity="0.88"/>
    <polygon points="552,8 588,8 442,154 406,154" fill="#00d700" opacity="0.88"/>
    <polygon points="588,8 624,8 478,154 442,154" fill="#00d7d7" opacity="0.88"/>
  </g>

  <!-- Header Badge -->
  <rect x="26" y="22" width="320" height="28" rx="6" fill="#1a1d28" stroke="#2a2f42"/>
  <text x="40" y="40" fill="#e6c875" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0.8">ZX SPECTRUM 48K · 8-ROOM C1 MANSION</text>

  <!-- Left: Mini CRT Playfield -->
  <rect x="26" y="64" width="328" height="236" rx="8" fill="#0000d7" stroke="#3c435c" stroke-width="2"/>
  <rect x="42" y="80" width="296" height="176" fill="#000000"/>
  <rect x="42" y="80" width="296" height="176" fill="url(#crtGlow)"/>

  <!-- Platforms & Brick Walls inside CRT -->
  <g fill="#00d7d7">
    <rect x="54" y="132" width="76" height="8"/>
    <rect x="148" y="164" width="88" height="8"/>
    <rect x="42" y="244" width="296" height="12" fill="#d70000"/>
  </g>

  <!-- Diagonal Ramp -->
  <g fill="#00ffff">
    <rect x="242" y="232" width="12" height="12"/>
    <rect x="254" y="220" width="12" height="12"/>
    <rect x="266" y="208" width="12" height="12"/>
    <rect x="278" y="196" width="12" height="12"/>
    <rect x="290" y="184" width="12" height="12"/>
  </g>

  <!-- Parabolic 18-Tick Jump Arc -->
  <g fill="#00f0ff">
    <circle cx="110" cy="196" r="2.3"/>
    <circle cx="120" cy="182" r="2.3"/>
    <circle cx="130" cy="171" r="2.3"/>
    <circle cx="140" cy="162" r="2.3"/>
    <circle cx="150" cy="156" r="2.3"/>
    <circle cx="160" cy="153" r="2.3"/>
    <circle cx="170" cy="153" r="2.3"/>
    <circle cx="180" cy="156" r="2.3"/>
  </g>

  <!-- Pixel Miner Willy Sprite -->
  <g fill="#ffffff" transform="translate(152, 130)">
    <rect x="4" y="0" width="10" height="3"/>
    <rect x="2" y="3" width="14" height="3"/>
    <rect x="4" y="6" width="10" height="6"/>
    <rect x="3" y="12" width="12" height="7"/>
    <rect x="3" y="19" width="4" height="6"/>
    <rect x="11" y="19" width="4" height="6"/>
  </g>

  <!-- Flashing Collectible Item -->
  <g transform="translate(86, 110)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#ff2a85" opacity="0.25"/>
    <polygon points="8,2 14,8 8,14 2,8" fill="#ffff00"/>
  </g>

  <!-- Room Status Strip inside CRT -->
  <rect x="42" y="264" width="296" height="22" fill="#d7d700"/>
  <text x="190" y="279" text-anchor="middle" fill="#000000" font-family="monospace" font-size="11" font-weight="700">0xE100 · RM 33: THE BATHROOM</text>

  <!-- Right: Cambridge C1 Part 4 Riddle Card & 8-Room Mini-Map -->
  <rect x="372" y="64" width="242" height="154" rx="8" fill="#13151d" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="386" y="86" fill="#00f0ff" font-family="monospace" font-size="10.5" font-weight="700">CAMBRIDGE C1 · PART 4 RIDDLE</text>
  <rect x="386" y="96" width="106" height="22" rx="4" fill="#1a1d28" stroke="#e6c875"/>
  <text x="439" y="111" text-anchor="middle" fill="#e6c875" font-family="monospace" font-size="11" font-weight="700">KEY: SOONER</text>
  <rect x="500" y="96" width="98" height="22" rx="4" fill="#1a1d28" stroke="#00ff66"/>
  <text x="549" y="111" text-anchor="middle" fill="#00ff66" font-family="monospace" font-size="10.5" font-weight="700">3–6 WORDS</text>

  <text x="386" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="11">No ____ into the room than</text>
  <text x="386" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="11">the cold bath tap snapped.</text>

  <!-- Word Chips -->
  <g transform="translate(386, 170)">
    <rect x="0" y="0" width="56" height="24" rx="4" fill="#00f0ff" fill-opacity="0.18" stroke="#00f0ff"/>
    <text x="28" y="16" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700">sooner</text>
    <rect x="62" y="0" width="38" height="24" rx="4" fill="#00f0ff" fill-opacity="0.18" stroke="#00f0ff"/>
    <text x="81" y="16" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700">had</text>
    <rect x="106" y="0" width="48" height="24" rx="4" fill="#00f0ff" fill-opacity="0.18" stroke="#00f0ff"/>
    <text x="130" y="16" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700">Willy</text>
    <rect x="160" y="0" width="54" height="24" rx="4" fill="#00f0ff" fill-opacity="0.18" stroke="#00f0ff"/>
    <text x="187" y="16" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10.5" font-weight="700">stepped</text>
  </g>

  <!-- Bottom Right: 8-Room Mansion Matrix + Xbox Ready Pill -->
  <rect x="372" y="228" width="242" height="72" rx="8" fill="#13151d" stroke="#2a2f42"/>
  <text x="386" y="246" fill="#e6c875" font-family="monospace" font-size="10" font-weight="700">8 MANSION ROOMS · 16 C1 ITEMS</text>
  <g transform="translate(386, 256)" font-family="monospace" font-size="9" font-weight="700">
    <rect x="0" y="0" width="48" height="15" rx="3" fill="#1e293b" stroke="#00f0ff"/>
    <text x="24" y="10.5" text-anchor="middle" fill="#00f0ff">RM 33</text>
    <rect x="54" y="0" width="48" height="15" rx="3" fill="#1e293b" stroke="#475569"/>
    <text x="78" y="10.5" text-anchor="middle" fill="#e2e8f0">RM 35</text>
    <rect x="108" y="0" width="48" height="15" rx="3" fill="#1e293b" stroke="#ff2a85"/>
    <text x="132" y="10.5" text-anchor="middle" fill="#ff8ab8">RM 42</text>
    <rect x="162" y="0" width="48" height="15" rx="3" fill="#1e293b" stroke="#475569"/>
    <text x="186" y="10.5" text-anchor="middle" fill="#e2e8f0">RM 27</text>
    <rect x="0" y="20" width="48" height="15" rx="3" fill="#1e293b" stroke="#475569"/>
    <text x="24" y="30.5" text-anchor="middle" fill="#e2e8f0">RM 28</text>
    <rect x="54" y="20" width="48" height="15" rx="3" fill="#1e293b" stroke="#475569"/>
    <text x="78" y="30.5" text-anchor="middle" fill="#e2e8f0">RM 32</text>
    <rect x="108" y="20" width="48" height="15" rx="3" fill="#1e293b" stroke="#475569"/>
    <text x="132" y="30.5" text-anchor="middle" fill="#e2e8f0">RM 18</text>
    <rect x="162" y="20" width="48" height="15" rx="3" fill="#1e293b" stroke="#00ff66"/>
    <text x="186" y="30.5" text-anchor="middle" fill="#00ff66">RM 34</text>
  </g>

  <!-- Footer Strip -->
  <text x="26" y="328" fill="#94a3b8" font-family="monospace" font-size="10.5">Z80 14Hz PARABOLA · PIPER BRITISH CLUES · 8-BIT ROOM BUILDER · XBOX &amp; TOUCH</text>
</svg>
