<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <rect width="640" height="360" fill="#03111f"/>
  <circle cx="510" cy="145" r="82" fill="#041e34" stroke="#0284c7" stroke-width="2"/>
  <circle cx="510" cy="145" r="54" stroke="#0369a1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="510" y1="145" x2="568" y2="102" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="545" cy="118" r="4" fill="#34d399"/>
  <!-- Top Bathysphere Telemetry Bar -->
  <rect x="22" y="18" width="596" height="36" rx="8" fill="#061e36" stroke="#0284c7" stroke-width="1.5"/>
  <text x="40" y="41" fill="#7dd3fc" font-family="monospace, sans-serif" font-size="12" font-weight="800">ABYSSAL BATHYSPHERE • DEPTH: -2,840m</text>
  <text x="598" y="41" text-anchor="end" fill="#34d399" font-family="monospace, sans-serif" font-size="11" font-weight="800">HULL INTEGRITY: 94%</text>
  <!-- Left Conditional Syntax Console -->
  <rect x="22" y="68" width="380" height="162" rx="12" fill="#061a2e" stroke="#0ea5e9" stroke-width="2"/>
  <text x="42" y="96" fill="#38bdf8" font-family="monospace, sans-serif" font-size="11" font-weight="800">C1 MIXED CONDITIONAL INVERSION</text>
  <text x="42" y="124" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">“_______ we reinforced the titanium seal,</text>
  <text x="42" y="144" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">the cabin wouldn’t be leaking now.”</text>
  <rect x="42" y="164" width="156" height="44" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
  <text x="120" y="191" text-anchor="middle" fill="#ffffff" font-family="monospace, sans-serif" font-size="14" font-weight="800">A) HAD ✓</text>
  <rect x="214" y="164" width="166" height="44" rx="8" fill="#041322" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="297" y="191" text-anchor="middle" fill="#94a3b8" font-family="monospace, sans-serif" font-size="14" font-weight="700">B) SHOULD</text>
  <!-- Bottom Pressure Readout -->
  <rect x="22" y="246" width="596" height="92" rx="12" fill="#061a2e" stroke="#0284c7" stroke-width="1.5"/>
  <text x="42" y="276" fill="#34d399" font-family="monospace, sans-serif" font-size="12" font-weight="800">✓ SEAL STABILISED: “Had + subject + past participle” (Past condition → Present result)</text>
  <text x="42" y="302" fill="#bae6fd" font-family="sans-serif" font-size="12">Descending to Trench Sector 5: Inverted Third Conditionals.</text>
