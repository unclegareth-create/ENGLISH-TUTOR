<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="rpPaperBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="rpNibSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="rpShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Daylight Editorial Desk Backdrop -->
  <rect width="640" height="360" fill="url(#rpPaperBg)"/>
  <line x1="0" y1="44" x2="640" y2="44" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="36" y1="0" x2="36" y2="360" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Top Desk Strip -->
  <text x="54" y="28" fill="#0f172a" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="0.5">BELFAST DESK · RED-PEN SPEED-RUN</text>
  <rect x="486" y="12" width="122" height="24" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <circle cx="502" cy="24" r="4" fill="#be123c"/>
  <text x="513" y="28" fill="#be123c" font-family="monospace" font-size="11.5" font-weight="800">90.0s CLOCK</text>

  <!-- Left: Annotated C1 Manuscript Card -->
  <g filter="url(#rpShadow)">
    <rect x="54" y="62" width="336" height="202" rx="11" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
    <text x="72" y="84" fill="#be123c" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="0.8">ACT I · C1 ESSAY SCRIPT AUDIT</text>
    <line x1="72" y1="92" x2="372" y2="92" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Line 1: Actual Grammar Error -->
    <text x="72" y="118" fill="#334155" font-family="Georgia, serif" font-size="13.5">Remote teams still hold</text>
    <rect x="218" y="102" width="102" height="21" rx="5" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
    <text x="225" y="117" fill="#be123c" font-family="Georgia, serif" font-size="13.5" font-weight="700" text-decoration="line-through">much meetings</text>
    <text x="326" y="117" fill="#047857" font-family="Georgia, serif" font-size="13.5" font-weight="700">many</text>

    <!-- Line 2: Spoken Slip -->
    <text x="72" y="156" fill="#334155" font-family="Georgia, serif" font-size="13.5">Staff waste hours sorting</text>
    <rect x="220" y="140" width="90" height="21" rx="5" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="227" y="155" fill="#b45309" font-family="Georgia, serif" font-size="13.5" font-weight="700">a lot of stuff</text>
    <text x="315" y="155" fill="#334155" font-family="Georgia, serif" font-size="13.5">each</text>
    <text x="72" y="177" fill="#334155" font-family="Georgia, serif" font-size="13.5">week before Friday reviews.</text>

    <!-- Line 3: Natural C1 Style (Leave Alone) -->
    <text x="72" y="212" fill="#334155" font-family="Georgia, serif" font-size="13.5">Poor handovers</text>
    <rect x="167" y="196" width="168" height="21" rx="5" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="174" y="211" fill="#047857" font-family="Georgia, serif" font-size="13" font-weight="700">pose a serious challenge for</text>
    <text x="72" y="233" fill="#334155" font-family="Georgia, serif" font-size="13.5">incoming shift coordinators.</text>

    <!-- Red-Pen Legend Footer inside Card -->
    <rect x="72" y="242" width="14" height="10" rx="3" fill="#be123c"/>
    <text x="90" y="251" fill="#475569" font-family="sans-serif" font-size="9.5" font-weight="700">1 Error</text>
    <rect x="148" y="242" width="14" height="10" rx="3" fill="#b45309"/>
    <text x="166" y="251" fill="#475569" font-family="sans-serif" font-size="9.5" font-weight="700">2 Spoken Slip</text>
    <rect x="246" y="242" width="14" height="10" rx="3" fill="#047857"/>
    <text x="264" y="251" fill="#475569" font-family="sans-serif" font-size="9.5" font-weight="700">3 Leave Alone</text>
  </g>

  <!-- Crimson Fountain Pen Nib hovering over script -->
  <g transform="translate(324, 118) rotate(-26)">
    <path d="M0 0 L19 -9 L54 -6 L58 6 L19 9 Z" fill="url(#rpNibSteel)" stroke="#0f172a" stroke-width="1"/>
    <line x1="0" y1="0" x2="26" y2="0" stroke="#fff1f2" stroke-width="1.3"/>
    <circle cx="29" cy="0" r="2.2" fill="#fff1f2"/>
    <rect x="54" y="-7.5" width="7" height="15" rx="1.5" fill="#0f172a"/>
    <rect x="61" y="-6.5" width="44" height="13" rx="3" fill="#be123c"/>
  </g>

  <!-- Right: Restraint & Precision Score Card -->
  <g filter="url(#rpShadow)">
    <rect x="408" y="62" width="200" height="202" rx="11" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
    <path d="M408 72 Q408 62 418 62 L598 62 Q608 62 608 72 L608 92 L408 92 Z" fill="#f0f9ff"/>
    <text x="424" y="81" fill="#0369a1" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="0.8">LIVE TELEMETRY</text>

    <!-- Precision Pill -->
    <rect x="424" y="106" width="168" height="44" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
    <text x="436" y="123" fill="#be123c" font-family="sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.6">PRECISION</text>
    <text x="436" y="141" fill="#0f172a" font-family="monospace" font-size="15" font-weight="800">96% · 🔥 12 STREAK</text>

    <!-- Restraint Pill -->
    <rect x="424" y="160" width="168" height="44" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="436" y="177" fill="#047857" font-family="sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.6">RESTRAINT SCORE</text>
    <text x="436" y="195" fill="#047857" font-family="monospace" font-size="15" font-weight="800">100% CLEAN SPARED</text>

    <!-- Ledger Pill -->
    <rect x="424" y="214" width="168" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="508" y="236" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="10.5" font-weight="800">DEL / INS AUDIT LEDGER</text>
  </g>

  <!-- Bottom Desk Caption Strip -->
  <g transform="translate(54, 284)">
    <rect x="0" y="0" width="554" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="24" cy="22" r="6" fill="#be123c"/>
    <circle cx="42" cy="22" r="6" fill="#b45309"/>
    <circle cx="60" cy="22" r="6" fill="#047857"/>
    <text x="80" y="26" fill="#0f172a" font-family="sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.4">20 C1 PARAGRAPHS · 60 SPANS · ERROR vs SPOKEN SLIP vs NATURAL STYLE</text>
  </g>
</svg>
