<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="skylineNight" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#021014"/>
      <stop offset="55%" stop-color="#062825"/>
      <stop offset="100%" stop-color="#041218"/>
    </linearGradient>
    <linearGradient id="tableSurface" x1="0" y1="240" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#092226"/>
      <stop offset="100%" stop-color="#030b0f"/>
    </linearGradient>
  </defs>

  <!-- Executive Penthouse Skyline Backdrop -->
  <rect width="640" height="360" fill="url(#skylineNight)"/>

  <!-- London Canary Wharf / City Skyscraper Silhouettes -->
  <g fill="#071a21" stroke="#0d9488" stroke-opacity="0.3" stroke-width="1">
    <rect x="36" y="78" width="58" height="175"/>
    <polygon points="65,42 36,78 94,78"/>
    <rect x="110" y="105" width="48" height="148"/>
    <rect x="172" y="64" width="64" height="189"/>
    <path d="M415 253 L432 58 L448 253 Z"/>
    <rect x="468" y="88" width="62" height="165"/>
    <rect x="546" y="112" width="54" height="141"/>
  </g>

  <!-- Illuminated Skyscraper Office Windows -->
  <g fill="#34d399" opacity="0.45">
    <rect x="48" y="92" width="8" height="4"/><rect x="64" y="92" width="8" height="4"/><rect x="48" y="106" width="8" height="4"/>
    <rect x="184" y="80" width="10" height="4"/><rect x="204" y="80" width="10" height="4"/><rect x="184" y="96" width="10" height="4"/><rect x="204" y="112" width="10" height="4"/>
    <rect x="480" y="104" width="10" height="4"/><rect x="502" y="104" width="10" height="4"/><rect x="480" y="120" width="10" height="4"/>
  </g>

  <!-- Floor-to-Ceiling Penthouse Window Mullions -->
  <line x1="160" y1="0" x2="160" y2="250" stroke="#0f3d3e" stroke-width="4"/>
  <line x1="320" y1="0" x2="320" y2="250" stroke="#0f3d3e" stroke-width="4"/>
  <line x1="480" y1="0" x2="480" y2="250" stroke="#0f3d3e" stroke-width="4"/>
  <line x1="0" y1="250" x2="640" y2="250" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Conference Table Perspective Surface -->
  <polygon points="0,250 640,250 640,360 0,360" fill="url(#tableSurface)"/>
  <polygon points="75,260 565,260 620,360 20,360" fill="#06191e" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Top-Left: Blunt Internal Thought Card (Crossed Out) -->
  <g transform="translate(32, 54)">
    <rect width="262" height="74" rx="10" fill="#2a0a18" fill-opacity="0.94" stroke="#f43f5e" stroke-width="2"/>
    <text x="16" y="23" fill="#fda4af" font-family="monospace, sans-serif" font-size="10" font-weight="800" letter-spacing="1">RAW BLUNT THOUGHT (REJECTED):</text>
    <text x="16" y="48" fill="#fecdd3" font-family="sans-serif" font-size="13" font-weight="700" text-decoration="line-through">“Your Q4 deadline is impossible.”</text>
    <text x="16" y="64" fill="#fb7185" font-family="monospace, sans-serif" font-size="10" font-weight="700">CEO PATIENCE: -35% CRASH</text>
  </g>

  <!-- Diplomatic C1/C2 Transformation Arrow -->
  <path d="M302 92 L338 92" stroke="#34d399" stroke-width="3"/>
  <polygon points="336,85 348,92 336,99" fill="#34d399"/>

  <!-- Top-Right: Diplomatic C1/C2 Executive Reframe Card -->
  <g transform="translate(354, 46)">
    <rect width="256" height="90" rx="10" fill="#042f2e" fill-opacity="0.96" stroke="#10b981" stroke-width="2.5"/>
    <text x="16" y="24" fill="#6ee7b7" font-family="monospace, sans-serif" font-size="10" font-weight="900" letter-spacing="1">✓ C1 DIPLOMATIC REGISTER:</text>
    <text x="16" y="47" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="800">“May we revisit the timeline scope</text>
    <text x="16" y="65" fill="#ffffff" font-family="sans-serif" font-size="12.5" font-weight="800">to safeguard delivery quality?”</text>
    <text x="16" y="81" fill="#34d399" font-family="monospace, sans-serif" font-size="10" font-weight="800">STAKEHOLDER TRUST: +94%</text>
  </g>

  <!-- Center Boardroom Holographic Pitch Chart & CEO Patience Meter -->
  <g transform="translate(135, 162)">
    <rect width="370" height="72" rx="10" fill="#03141a" fill-opacity="0.92" stroke="#14b8a6" stroke-width="1.8"/>
    <!-- Mini Bar Chart -->
    <rect x="22" y="42" width="12" height="18" rx="2" fill="#0d9488"/>
    <rect x="40" y="32" width="12" height="28" rx="2" fill="#14b8a6"/>
    <rect x="58" y="18" width="12" height="42" rx="2" fill="#34d399"/>
    <!-- CEO Patience Bar -->
    <text x="90" y="26" fill="#99f6e4" font-family="monospace, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8">CEO PATIENCE &amp; BOARD APPROVAL</text>
    <rect x="90" y="36" width="256" height="16" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="1.2"/>
    <rect x="93" y="39" width="232" height="10" rx="5" fill="#10b981"/>
  </g>

  <!-- Bottom Executive Telemetry Strip -->
  <rect x="76" y="286" width="488" height="36" rx="8" fill="#021014" stroke="#10b981" stroke-width="1.5"/>
  <text x="320" y="309" text-anchor="middle" fill="#a7f3d0" font-family="monospace, sans-serif" font-size="12" font-weight="900" letter-spacing="1">EXECUTIVE C1/C2 SIMULATION • HEDGING • NEGOTIATION TACT</text>
</svg>
