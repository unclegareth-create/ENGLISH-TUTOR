<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="citadelBg" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04130f"/>
      <stop offset="55%" stop-color="#09261e"/>
      <stop offset="100%" stop-color="#040d0b"/>
    </linearGradient>
    <pattern id="crtLines2" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#citadelBg)"/>

  <!-- Stone Chamber Frame (PC-98 Dungeon Crawler Viewport) -->
  <rect x="34" y="24" width="330" height="190" rx="6" fill="#061512" stroke="#10b981" stroke-width="2.2"/>
  <path d="M74 214 L74 88 Q74 42 199 42 Q324 42 324 88 L324 214 Z" fill="#030b09" stroke="#059669" stroke-width="2"/>

  <!-- 3 Pedestal Levers Inside Dungeon Room -->
  <rect x="104" y="168" width="190" height="34" rx="4" fill="#11221c" stroke="#10b981" stroke-width="1.5"/>

  <!-- Lever 1 (Left - Rusty/Cobwebbed) -->
  <line x1="138" y1="168" x2="122" y2="118" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="122" cy="116" r="7" fill="#94a3b8"/>

  <!-- Lever 2 (Center - Glowing Sapphire Defining Clause Lever!) -->
  <circle cx="199" cy="112" r="24" fill="#38bdf8" fill-opacity="0.25"/>
  <line x1="199" y1="168" x2="199" y2="112" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="199" cy="110" r="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>

  <!-- Lever 3 (Right - Broken) -->
  <line x1="260" y1="168" x2="278" y2="122" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="278" cy="120" r="7" fill="#94a3b8"/>

  <!-- Right Panel: Fighting Fantasy 2d6 Adventure Sheet & Dice -->
  <rect x="382" y="24" width="224" height="190" rx="6" fill="#05100e" stroke="#34d399" stroke-width="2.2"/>
  <rect x="390" y="32" width="208" height="22" rx="3" fill="#064e3b"/>
  <text x="400" y="47" fill="#a7f3d0" font-family="monospace, sans-serif" font-size="11" font-weight="900">TAPE 02 // 2D6 LUCK CHECK</text>

  <!-- Two 3D Polyhedral 6-Sided Dice (Showing 5 + 4 = 9) -->
  <g transform="translate(418, 72)">
    <rect width="58" height="58" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="16" cy="16" r="4.5" fill="#ecfdf5"/>
    <circle cx="42" cy="16" r="4.5" fill="#ecfdf5"/>
    <circle cx="29" cy="29" r="4.5" fill="#34d399"/>
    <circle cx="16" cy="42" r="4.5" fill="#ecfdf5"/>
    <circle cx="42" cy="42" r="4.5" fill="#ecfdf5"/>
  </g>
  <g transform="translate(508, 72)">
    <rect width="58" height="58" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="16" cy="16" r="4.5" fill="#ecfdf5"/>
    <circle cx="42" cy="16" r="4.5" fill="#ecfdf5"/>
    <circle cx="16" cy="42" r="4.5" fill="#ecfdf5"/>
    <circle cx="42" cy="42" r="4.5" fill="#ecfdf5"/>
  </g>

  <text x="494" y="156" text-anchor="middle" fill="#6ee7b7" font-family="monospace, sans-serif" font-size="12" font-weight="900">ROLLED: 5 + 4 = 9 (PASS!)</text>
  <text x="494" y="178" text-anchor="middle" fill="#cbd5e1" font-family="monospace, sans-serif" font-size="10">COMPOSURE: 10 • LUCK: 9</text>
  <text x="494" y="196" text-anchor="middle" fill="#fbbf24" font-family="monospace, sans-serif" font-size="10" font-weight="800">REWIND TOKENS: 3</text>

  <!-- Bottom PC-98 Dialogue Frame -->
  <rect x="34" y="232" width="572" height="104" rx="6" fill="#040d0b" stroke="#10b981" stroke-width="2.2"/>
  <text x="52" y="258" fill="#34d399" font-family="monospace, sans-serif" font-size="12" font-weight="900">CITADEL INSCRIPTION [FIGHTING FANTASY // 1988]:</text>
  <text x="52" y="282" fill="#f8fafc" font-family="monospace, sans-serif" font-size="13" font-weight="700">“Pull the lever WHICH GLOWS BLUE — the others CAN’T HAVE been used.”</text>
  <text x="52" y="312" fill="#fbbf24" font-family="monospace, sans-serif" font-size="11" font-weight="800">▶ B1–B2 MODALS OF DEDUCTION • RELATIVE CLAUSES • CONDITIONALS</text>

  <rect width="640" height="360" fill="url(#crtLines2)" pointer-events="none"/>
</svg>
