<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <rect width="640" height="360" fill="#061411"/>
  <g stroke="#064e3b" stroke-width="1" opacity="0.45">
    <line x1="0" y1="72" x2="640" y2="72"/>
    <line x1="0" y1="144" x2="640" y2="144"/>
    <line x1="0" y1="216" x2="640" y2="216"/>
    <line x1="0" y1="288" x2="640" y2="288"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>
  <!-- Top Dossier Bar -->
  <rect x="24" y="18" width="592" height="36" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
  <text x="42" y="41" fill="#6ee7b7" font-family="monospace, sans-serif" font-size="12" font-weight="800">CLASSIFIED DOSSIER • OPERATION NOBODY</text>
  <text x="598" y="41" text-anchor="end" fill="#fbbf24" font-family="monospace, sans-serif" font-size="11" font-weight="800">CLEARANCE: B1–B2</text>
  <!-- Spy Briefing & Indefinite Pronoun Challenge -->
  <rect x="24" y="68" width="592" height="178" rx="12" fill="#041f18" stroke="#059669" stroke-width="2"/>
  <rect x="44" y="86" width="128" height="24" rx="5" fill="#064e3b"/>
  <text x="108" y="102" text-anchor="middle" fill="#a7f3d0" font-family="monospace, sans-serif" font-size="10" font-weight="800">INTERCEPT #04</text>
  <text x="44" y="134" fill="#ecfdf5" font-family="sans-serif" font-size="15" font-weight="700">“The safe was open, yet _______ had touched the microfilm.”</text>
  <text x="44" y="160" fill="#94a3b8" font-family="sans-serif" font-size="12">Select the correct pronoun to decode the Vienna station cipher:</text>
  <!-- 3 Choice Pills -->
  <rect x="44" y="180" width="168" height="44" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="128" y="207" text-anchor="middle" fill="#ffffff" font-family="monospace, sans-serif" font-size="14" font-weight="800">A) NOBODY ✓</text>
  <rect x="232" y="180" width="168" height="44" rx="8" fill="#022c22" stroke="#047857" stroke-width="1.5"/>
  <text x="316" y="207" text-anchor="middle" fill="#94a3b8" font-family="monospace, sans-serif" font-size="14" font-weight="700">B) ANYBODY</text>
  <rect x="420" y="180" width="168" height="44" rx="8" fill="#022c22" stroke="#047857" stroke-width="1.5"/>
  <text x="504" y="207" text-anchor="middle" fill="#94a3b8" font-family="monospace, sans-serif" font-size="14" font-weight="700">C) SOMEBODY</text>
  <!-- Bottom Decoder Status -->
  <rect x="24" y="262" width="592" height="74" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
  <text x="44" y="292" fill="#34d399" font-family="monospace, sans-serif" font-size="12" font-weight="800">✓ CIPHER VERIFIED: Affirmative verb + “nobody” (no double negative)</text>
  <text x="44" y="316" fill="#a7f3d0" font-family="sans-serif" font-size="12">Clue unlocked: Agent Vesper left Berlin before midnight.</text>
</svg>
