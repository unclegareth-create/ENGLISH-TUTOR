<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="foundryBg" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140c06"/>
      <stop offset="55%" stop-color="#26160a"/>
      <stop offset="100%" stop-color="#100904"/>
    </linearGradient>
    <radialGradient id="furnaceFire" cx="565" cy="235" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#100904" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="copperPipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
  </defs>

  <!-- Steampunk Industrial Foundry Backdrop -->
  <rect width="640" height="360" fill="url(#foundryBg)"/>

  <!-- Background Arched Factory Windows -->
  <g opacity="0.28" stroke="#92400e" stroke-width="2" fill="#1c1108">
    <path d="M55 180 L55 75 Q55 35 95 35 Q135 35 135 75 L135 180 Z"/>
    <path d="M175 180 L175 75 Q175 35 215 35 Q255 35 255 180 Z"/>
  </g>

  <!-- Overhead Copper Steam Pipes -->
  <rect x="0" y="42" width="640" height="14" fill="url(#copperPipe)" stroke="#431407" stroke-width="1.5"/>
  <rect x="110" y="36" width="12" height="26" rx="2" fill="#d97706"/>
  <rect x="430" y="36" width="12" height="26" rx="2" fill="#d97706"/>

  <!-- Interlocking Brass Cogwheels -->
  <g transform="translate(115, 130)">
    <circle cx="0" cy="0" r="46" fill="#29180b" stroke="url(#brassMetal)" stroke-width="9" stroke-dasharray="14 8"/>
    <circle cx="0" cy="0" r="34" fill="#1c1008" stroke="#d97706" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="url(#brassMetal)"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#b45309" stroke-width="4"/>
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#b45309" stroke-width="4"/>
  </g>

  <g transform="translate(182, 168)">
    <circle cx="0" cy="0" r="28" fill="#29180b" stroke="url(#brassMetal)" stroke-width="7" stroke-dasharray="10 6"/>
    <circle cx="0" cy="0" r="20" fill="#1c1008" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
  </g>

  <!-- Central Hydraulic Morphology Stamping Press -->
  <rect x="275" y="0" width="90" height="72" fill="#27170a" stroke="#b45309" stroke-width="2.5"/>
  <rect x="302" y="72" width="36" height="44" fill="#57534e" stroke="#a8a29e" stroke-width="2"/>
  <path d="M262 114 L378 114 L366 142 L274 142 Z" fill="url(#brassMetal)" stroke="#fde68a" stroke-width="1.5"/>
  <text x="320" y="133" text-anchor="middle" fill="#1c1008" font-family="monospace, sans-serif" font-size="12" font-weight="900" letter-spacing="1">PART 3 PRESS</text>

  <!-- Roaring Furnace on Right -->
  <circle cx="565" cy="235" r="105" fill="url(#furnaceFire)"/>
  <path d="M510 285 L510 155 Q510 100 572 100 Q630 100 630 155 L630 285 Z" fill="#1c0d06" stroke="#b45309" stroke-width="5"/>
  <path d="M526 285 L526 168 Q526 124 572 124 Q616 124 616 168 L616 285 Z" fill="#450a0a" stroke="#f97316" stroke-width="2"/>
  <path d="M535 285 C540 215 555 180 572 162 C590 180 605 215 610 285 Z" fill="#f97316"/>
  <path d="M548 285 C552 235 562 205 572 190 C582 205 592 235 596 285 Z" fill="#fef08a"/>

  <!-- Conveyor Belt & Rollers -->
  <rect x="24" y="254" width="540" height="36" rx="18" fill="#1c1917" stroke="#b45309" stroke-width="3"/>
  <g fill="#44403c" stroke="#f59e0b" stroke-width="2">
    <circle cx="56" cy="272" r="11"/>
    <circle cx="136" cy="272" r="11"/>
    <circle cx="216" cy="272" r="11"/>
    <circle cx="296" cy="272" r="11"/>
    <circle cx="376" cy="272" r="11"/>
    <circle cx="456" cy="272" r="11"/>
    <circle cx="530" cy="272" r="11"/>
  </g>

  <!-- Prefix, Root & Suffix Ingot Blocks on Conveyor -->
  <!-- Prefix Block: UN- -->
  <g transform="translate(132, 198)">
    <rect width="76" height="48" rx="6" fill="#4c0519" stroke="#fb7185" stroke-width="2.2"/>
    <text x="38" y="18" text-anchor="middle" fill="#fda4af" font-family="monospace, sans-serif" font-size="9" font-weight="700">PREFIX</text>
    <text x="38" y="37" text-anchor="middle" fill="#fff1f2" font-family="monospace, sans-serif" font-size="17" font-weight="900">UN-</text>
  </g>

  <!-- Root Ingot Block: PRECEDENT -->
  <g transform="translate(216, 194)">
    <rect width="184" height="52" rx="7" fill="#29180b" stroke="#fbbf24" stroke-width="2.8"/>
    <text x="92" y="19" text-anchor="middle" fill="#fcd34d" font-family="monospace, sans-serif" font-size="9" font-weight="800" letter-spacing="1">ROOT STEM INGOT</text>
    <text x="92" y="40" text-anchor="middle" fill="#ffffff" font-family="monospace, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5">PRECEDENT</text>
  </g>

  <!-- Suffix Block: -ED -->
  <g transform="translate(408, 198)">
    <rect width="78" height="48" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="2.2"/>
    <text x="39" y="18" text-anchor="middle" fill="#6ee7b7" font-family="monospace, sans-serif" font-size="9" font-weight="700">SUFFIX</text>
    <text x="39" y="37" text-anchor="middle" fill="#ecfdf5" font-family="monospace, sans-serif" font-size="17" font-weight="900">-ED</text>
  </g>

  <!-- Bottom Forged Output Readout -->
  <rect x="44" y="308" width="552" height="34" rx="8" fill="#180e07" stroke="#d97706" stroke-width="1.5"/>
  <text x="320" y="329" text-anchor="middle" fill="#fde68a" font-family="monospace, sans-serif" font-size="12" font-weight="900" letter-spacing="0.8">FORGED ADJECTIVE: “UNPRECEDENTED” • CAMBRIDGE PART 3</text>
</svg>
