<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="reactorBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020813"/>
      <stop offset="50%" stop-color="#061e31"/>
      <stop offset="100%" stop-color="#030914"/>
    </linearGradient>
    <radialGradient id="plasmaCore" cx="320" cy="172" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cffafe" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#06b6d4" stop-opacity="0.75"/>
      <stop offset="62%" stop-color="#0284c7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#020813" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyanGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cybernetic Containment Chamber Background -->
  <rect width="640" height="360" fill="url(#reactorBg)"/>

  <!-- Perspective Hex/Tech Grid -->
  <g stroke="#0e7490" stroke-width="1" opacity="0.3">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- Outer Tokamak Magnetic Containment Rings -->
  <circle cx="320" cy="172" r="132" stroke="#155e75" stroke-width="8" opacity="0.6"/>
  <circle cx="320" cy="172" r="116" stroke="#06b6d4" stroke-width="2" stroke-dasharray="14 8" opacity="0.8"/>
  <circle cx="320" cy="172" r="96" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.65"/>

  <!-- Energy Conduit Beams from 4 Particle Injectors -->
  <line x1="158" y1="108" x2="262" y2="148" stroke="#1e293b" stroke-width="5"/>
  <line x1="158" y1="236" x2="262" y2="196" stroke="#1e293b" stroke-width="5"/>
  <line x1="482" y1="236" x2="378" y2="196" stroke="#1e293b" stroke-width="5"/>
  <!-- Active Stabilising Particle Beam (Top Right: ABOUT) -->
  <line x1="482" y1="108" x2="372" y2="152" stroke="#22d3ee" stroke-width="6" filter="url(#cyanGlow)"/>
  <line x1="482" y1="108" x2="372" y2="152" stroke="#ecfeff" stroke-width="2"/>

  <!-- Central Plasma Core -->
  <circle cx="320" cy="172" r="108" fill="url(#plasmaCore)"/>
  <circle cx="320" cy="172" r="56" fill="#083344" stroke="#22d3ee" stroke-width="3.5" filter="url(#cyanGlow)"/>
  <circle cx="320" cy="172" r="48" fill="#041e2b" stroke="#67e8f9" stroke-width="1.2"/>
  <text x="320" y="164" text-anchor="middle" fill="#67e8f9" font-family="monospace, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">BASE VERB</text>
  <text x="320" y="186" text-anchor="middle" fill="#ffffff" font-family="monospace, sans-serif" font-size="22" font-weight="900" letter-spacing="2">BRING</text>

  <!-- 4 Particle Injector Pods -->
  <!-- Pod 1 (Top-Left): UP -->
  <g transform="translate(52, 84)">
    <rect width="112" height="44" rx="8" fill="#091929" stroke="#334155" stroke-width="2"/>
    <text x="56" y="27" text-anchor="middle" fill="#94a3b8" font-family="monospace, sans-serif" font-size="15" font-weight="800">A) UP</text>
  </g>

  <!-- Pod 2 (Bottom-Left): OFF -->
  <g transform="translate(52, 214)">
    <rect width="112" height="44" rx="8" fill="#091929" stroke="#334155" stroke-width="2"/>
    <text x="56" y="27" text-anchor="middle" fill="#94a3b8" font-family="monospace, sans-serif" font-size="15" font-weight="800">B) OFF</text>
  </g>

  <!-- Pod 3 (Top-Right, ACTIVE LOCK): ABOUT -->
  <g transform="translate(476, 84)">
    <rect width="124" height="44" rx="8" fill="#083344" stroke="#22d3ee" stroke-width="2.5" filter="url(#cyanGlow)"/>
    <text x="62" y="27" text-anchor="middle" fill="#ecfeff" font-family="monospace, sans-serif" font-size="15" font-weight="900">C) ABOUT ✓</text>
  </g>

  <!-- Pod 4 (Bottom-Right): OUT -->
  <g transform="translate(476, 214)">
    <rect width="124" height="44" rx="8" fill="#091929" stroke="#334155" stroke-width="2"/>
    <text x="62" y="27" text-anchor="middle" fill="#94a3b8" font-family="monospace, sans-serif" font-size="15" font-weight="800">D) OUT</text>
  </g>

  <!-- Top Definition Readout Console -->
  <rect x="130" y="14" width="380" height="34" rx="8" fill="#041322" fill-opacity="0.92" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="320" y="35" text-anchor="middle" fill="#a5f3fc" font-family="monospace, sans-serif" font-size="12" font-weight="800" letter-spacing="0.6">TARGET: “CAUSE SOMETHING TO HAPPEN”</text>

  <!-- Bottom Containment Timer & Telemetry Bar -->
  <rect x="64" y="314" width="512" height="28" rx="7" fill="#04101c" stroke="#155e75" stroke-width="1.5"/>
  <rect x="70" y="320" width="390" height="16" rx="4" fill="#06b6d4"/>
  <text x="562" y="332" text-anchor="end" fill="#67e8f9" font-family="monospace, sans-serif" font-size="11" font-weight="900">CORE: 98.4%</text>
</svg>
