<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="aegeanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a8a"/>
      <stop offset="55%" stop-color="#3898d8"/>
      <stop offset="88%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="aegeanSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="whitewashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a5f"/>
      <stop offset="55%" stop-color="#c2593f"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sunHalo" cx="50%" cy="54%" r="36%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Blinding Aegean Sky & Sun -->
  <rect width="640" height="222" fill="url(#aegeanSky)"/>
  <circle cx="320" cy="192" r="135" fill="url(#sunHalo)"/>

  <!-- Distant Cycladic Headlands on the Horizon -->
  <polygon points="35,222 72,155 118,172 148,222" fill="#1e3a5f" opacity="0.8"/>
  <polygon points="495,222 532,148 574,165 608,222" fill="#1e3a5f" opacity="0.8"/>

  <!-- Sparkling Cobalt-Turquoise Aegean Sea -->
  <rect y="218" width="640" height="142" fill="url(#aegeanSea)"/>
  <g fill="#fef9c3" opacity="0.6">
    <rect x="275" y="230" width="90" height="3" rx="1.5"/>
    <rect x="255" y="244" width="130" height="3" rx="1.5"/>
    <rect x="285" y="260" width="70" height="3" rx="1.5"/>
  </g>

  <!-- Bourani Limestone Cliff & Pine Headland -->
  <path d="M105,275 Q150,212 320,208 Q490,212 535,275 Z" fill="#64748b"/>
  <path d="M130,262 Q320,204 510,262 Z" fill="#3f6212"/>
  <ellipse cx="320" cy="258" rx="178" ry="26" fill="url(#whitewashGrad)"/>

  <!-- Dark Tapering Mediterranean Cypresses -->
  <g fill="#1b3b22">
    <polygon points="145,244 134,244 139.5,148"/>
    <polygon points="195,240 185,240 190,154"/>
    <polygon points="445,240 435,240 440,154"/>
    <polygon points="495,244 484,244 489.5,148"/>
  </g>

  <!-- Whitewashed Limestone Causeway Stretching Forward -->
  <polygon points="282,258 358,258 415,360 225,360" fill="url(#whitewashGrad)"/>
  <polygon points="274,258 284,258 232,360 216,360" fill="url(#terracottaGrad)"/>
  <polygon points="356,258 366,258 424,360 408,360" fill="url(#terracottaGrad)"/>

  <!-- Whitewashed Doric Colonnade & Terracotta Capitals -->
  <g fill="url(#whitewashGrad)">
    <rect x="166" y="146" width="16" height="98" rx="2"/>
    <rect x="212" y="136" width="16" height="104" rx="2"/>
    <rect x="412" y="136" width="16" height="104" rx="2"/>
    <rect x="458" y="146" width="16" height="98" rx="2"/>
  </g>
  <g fill="url(#terracottaGrad)">
    <rect x="162" y="140" width="24" height="7" rx="1"/>
    <rect x="208" y="130" width="24" height="7" rx="1"/>
    <rect x="408" y="130" width="24" height="7" rx="1"/>
    <rect x="454" y="140" width="24" height="7" rx="1"/>
  </g>

  <!-- Conchis's Brass Armillary Sphere & Optical Beam -->
  <g transform="translate(320, 126)">
    <rect x="-3" y="-126" width="6" height="245" fill="#38bdf8" opacity="0.45" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="url(#brassGrad)" stroke-width="6"/>
    <ellipse cx="0" cy="0" rx="52" ry="21" transform="rotate(-28)" fill="none" stroke="url(#brassGrad)" stroke-width="4.5"/>
    <ellipse cx="0" cy="0" rx="52" ry="21" transform="rotate(32)" fill="none" stroke="url(#brassGrad)" stroke-width="4.5"/>
    <circle cx="0" cy="0" r="13" fill="#fef08a" filter="url(#glow)"/>
  </g>

  <!-- Bourani Altar of the Godgame in Foreground -->
  <g transform="translate(320, 290)">
    <rect x="-138" y="-22" width="276" height="44" rx="6" fill="#0f172a" stroke="url(#brassGrad)" stroke-width="3"/>
    <rect x="-122" y="-12" width="74" height="24" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="-37" y="-12" width="74" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="48" y="-12" width="74" height="24" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="-85" y="4" fill="#fde68a" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">SCARCELY</text>
    <text x="0" y="4" fill="#7dd3fc" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">HAD I</text>
    <text x="85" y="4" fill="#6ee7b7" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">CROSSED</text>
  </g>
</svg>
