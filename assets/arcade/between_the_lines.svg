<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="nibSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Daylight Editorial Desk Backdrop -->
  <rect width="640" height="360" fill="url(#paperBg)"/>
  <line x1="0" y1="44" x2="640" y2="44" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="36" y1="0" x2="36" y2="360" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Header Strip -->
  <text x="54" y="28" fill="#0f172a" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="0.5">BELFAST DESK BRIEFING · C1/C2 SUBTEXT LAB</text>
  <rect x="492" y="13" width="116" height="22" rx="11" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
  <text x="550" y="28" text-anchor="middle" fill="#be123c" font-family="sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.6">READ THE KNIFE</text>

  <!-- Left: Speaker A & Speaker B Dialogue Cards -->
  <g filter="url(#cardShadow)">
    <!-- Speaker A Bubble -->
    <rect x="54" y="64" width="290" height="68" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="78" cy="88" r="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="78" y="92" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="11" font-weight="800">A</text>
    <text x="98" y="88" fill="#475569" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">PROPOSAL</text>
    <text x="98" y="109" fill="#0f172a" font-family="Georgia, serif" font-size="13.5" font-weight="700">“We’ll double growth by Friday.”</text>
  </g>

  <g filter="url(#cardShadow)">
    <!-- Speaker B Reply Card with Crimson Scalpel Underline -->
    <rect x="54" y="148" width="318" height="104" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="78" cy="174" r="11" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
    <text x="78" y="178" text-anchor="middle" fill="#be123c" font-family="sans-serif" font-size="11" font-weight="800">B</text>
    <text x="98" y="174" fill="#be123c" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="0.8">REPLY · ISOLATE THE SCALPEL</text>
    <text x="70" y="204" fill="#334155" font-family="Georgia, serif" font-size="14" font-weight="400">“That is certainly </text>
    <text x="190" y="204" fill="#be123c" font-family="Georgia, serif" font-size="14" font-weight="700">a brave proposal</text>
    <text x="307" y="204" fill="#334155" font-family="Georgia, serif" font-size="14" font-weight="400">,</text>
    <text x="70" y="226" fill="#334155" font-family="Georgia, serif" font-size="14" font-weight="400">given the audit schedule.”</text>

    <!-- Crimson Red-Pen Scalpel Underline -->
    <path d="M188 210 Q246 214 306 209" stroke="#be123c" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="188" y="190" width="118" height="18" rx="4" fill="#be123c" fill-opacity="0.08"/>
  </g>

  <!-- Fountain Pen Nib Marking the Scalpel -->
  <g transform="translate(306, 206) rotate(-28)">
    <path d="M0 0 L18 -9 L52 -6 L56 6 L18 9 Z" fill="url(#nibSteel)" stroke="#0f172a" stroke-width="1"/>
    <line x1="0" y1="0" x2="26" y2="0" stroke="#f8fafc" stroke-width="1.3"/>
    <circle cx="28" cy="0" r="2.2" fill="#f8fafc"/>
    <rect x="52" y="-7.5" width="7" height="15" rx="1.5" fill="#be123c"/>
    <rect x="59" y="-6.5" width="46" height="13" rx="3" fill="#0f172a"/>
  </g>

  <!-- Right: Briefing Dossier & Surgical Forge Card -->
  <g filter="url(#cardShadow)">
    <rect x="394" y="64" width="214" height="188" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <path d="M394 74 Q394 64 404 64 L490 64 L500 76 L598 76 Q608 76 608 86 L608 94 L394 94 Z" fill="#e0f2fe"/>
    <text x="410" y="84" fill="#0369a1" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="0.8">DOSSIER · RETURN SERVE</text>

    <!-- Subtext Decode Tag -->
    <rect x="410" y="106" width="182" height="44" rx="7" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
    <text x="420" y="123" fill="#be123c" font-family="sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.5">SUBTEXT DECODED:</text>
    <text x="420" y="140" fill="#0f172a" font-family="sans-serif" font-size="11.5" font-weight="700">“Reckless &amp; under-evidenced”</text>

    <!-- Surgical Chip Forge Preview -->
    <text x="410" y="170" fill="#475569" font-family="sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.6">3–6 WORD SURGICAL FORGE</text>
    <g transform="translate(410, 180)">
      <rect x="0" y="0" width="46" height="24" rx="6" fill="#0369a1"/>
      <text x="23" y="15.5" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700">Were</text>
      <rect x="52" y="0" width="24" height="24" rx="6" fill="#0369a1"/>
      <text x="64" y="15.5" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700">I</text>
      <rect x="82" y="0" width="26" height="24" rx="6" fill="#0369a1"/>
      <text x="95" y="15.5" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700">in</text>
      <rect x="114" y="0" width="42" height="24" rx="6" fill="#0369a1"/>
      <text x="135" y="15.5" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="700">your</text>
    </g>
    <g transform="translate(410, 211)">
      <rect x="0" y="0" width="68" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3 2" stroke-width="1.2"/>
      <text x="34" y="15.5" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="10.5" font-weight="700">position</text>
      <rect x="74" y="0" width="108" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
      <text x="128" y="15.5" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="10" font-weight="800">✓ C2 INVERTED</text>
    </g>
  </g>

  <!-- Bottom Desk Scene: Two Teacups & Editorial Pill -->
  <g transform="translate(54, 272)">
    <!-- Teacup 1 -->
    <ellipse cx="28" cy="48" rx="26" ry="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M10 24 L46 24 L42 44 Q28 50 14 44 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M46 28 Q56 28 55 36 Q54 42 43 41" fill="none" stroke="#0f172a" stroke-width="1.5"/>
    <ellipse cx="28" cy="24" rx="18" ry="4" fill="#d97706" fill-opacity="0.35" stroke="#0f172a" stroke-width="1.2"/>
    <path d="M22 14 Q20 8 24 4 M32 14 Q34 8 30 4" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Teacup 2 -->
    <g transform="translate(68, 0)">
      <ellipse cx="28" cy="48" rx="26" ry="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M10 24 L46 24 L42 44 Q28 50 14 44 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <path d="M46 28 Q56 28 55 36 Q54 42 43 41" fill="none" stroke="#0f172a" stroke-width="1.5"/>
      <ellipse cx="28" cy="24" rx="18" ry="4" fill="#be123c" fill-opacity="0.25" stroke="#0f172a" stroke-width="1.2"/>
      <path d="M22 14 Q20 8 24 4 M32 14 Q34 8 30 4" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Bottom Caption Strip -->
    <rect x="148" y="14" width="406" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="170" cy="34" r="5" fill="#be123c"/>
    <text x="184" y="38" fill="#0f172a" font-family="sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.4">24 EXCHANGES · 4 ACTS · LITOTES, INVERSIONS &amp; CLEFTS</text>
  </g>
</svg>
