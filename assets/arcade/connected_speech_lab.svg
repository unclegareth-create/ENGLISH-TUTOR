<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="wellBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="28%" stop-color="#f59e0b"/>
      <stop offset="55%" stop-color="#fde047"/>
      <stop offset="76%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Daylight Editorial Desk Backdrop -->
  <rect width="640" height="360" fill="url(#paperBg)"/>
  <line x1="0" y1="44" x2="640" y2="44" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="36" y1="0" x2="36" y2="360" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Header Strip -->
  <text x="54" y="28" fill="#0f172a" font-family="Georgia, serif" font-size="12.5" font-weight="700" letter-spacing="0.4">BELFAST DESK · CONNECTED SPEECH &amp; PROSODY LAB</text>
  <rect x="478" y="13" width="130" height="22" rx="11" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="543" y="28" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="0.6">SCHWA /ə/ RADAR</text>

  <!-- Main Dark Spectrogram Well Card -->
  <g filter="url(#cardShadow)">
    <rect x="54" y="62" width="356" height="206" rx="12" fill="url(#wellBg)" stroke="#1e293b" stroke-width="1.8"/>
    <!-- Grid lines -->
    <line x1="74" y1="108" x2="390" y2="108" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="74" y1="158" x2="390" y2="158" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="74" y1="208" x2="390" y2="208" stroke="#1e293b" stroke-width="1"/>

    <!-- Spectrogram Heatmap Bars (subtle teal-to-amber intensity columns) -->
    <g opacity="0.52">
      <rect x="78" y="180" width="8" height="28" rx="2" fill="#0ea5e9"/>
      <rect x="92" y="176" width="8" height="32" rx="2" fill="#0284c7"/>
      <rect x="106" y="178" width="8" height="30" rx="2" fill="#0ea5e9"/>
      <rect x="120" y="182" width="8" height="26" rx="2" fill="#0369a1"/>
      <rect x="142" y="106" width="10" height="102" rx="2" fill="#f59e0b"/>
      <rect x="156" y="92" width="10" height="116" rx="2" fill="#fbbf24"/>
      <rect x="170" y="128" width="10" height="80" rx="2" fill="#d97706"/>
      <rect x="192" y="174" width="8" height="34" rx="2" fill="#0ea5e9"/>
      <rect x="206" y="178" width="8" height="30" rx="2" fill="#0284c7"/>
      <rect x="228" y="100" width="10" height="108" rx="2" fill="#f59e0b"/>
      <rect x="242" y="88" width="10" height="120" rx="2" fill="#fde047"/>
      <rect x="256" y="132" width="10" height="76" rx="2" fill="#d97706"/>
      <rect x="278" y="176" width="8" height="32" rx="2" fill="#0ea5e9"/>
      <rect x="292" y="180" width="8" height="28" rx="2" fill="#0369a1"/>
      <rect x="314" y="104" width="10" height="104" rx="2" fill="#f59e0b"/>
      <rect x="328" y="94" width="10" height="114" rx="2" fill="#fbbf24"/>
      <rect x="342" y="126" width="10" height="82" rx="2" fill="#d97706"/>
      <rect x="364" y="172" width="8" height="36" rx="2" fill="#0ea5e9"/>
    </g>

    <!-- Gold Reference Stress Envelope -->
    <path d="M74 196 Q102 184 128 190 Q144 134 158 94 Q174 126 192 184 Q212 190 226 164 Q242 90 256 122 Q274 184 294 188 Q314 132 328 96 Q344 126 364 182 L390 194"
          stroke="url(#goldWave)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Live Voice Cyan Overlay -->
    <path d="M74 198 Q104 188 128 192 Q146 140 160 104 Q176 136 194 186 Q214 192 228 166 Q244 98 258 128 Q276 186 296 190 Q316 138 330 104 Q346 134 366 186 L390 196"
          stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3" stroke-linecap="round" fill="none"/>

    <!-- Peak & Valley Annotations -->
    <rect x="76" y="218" width="54" height="18" rx="4" fill="#0369a1" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1"/>
    <text x="103" y="230" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="9.5" font-weight="700">Ahv-bin</text>

    <circle cx="158" cy="94" r="4.5" fill="#fde047"/>
    <text x="158" y="83" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="700">TAK-ing</text>

    <rect x="184" y="218" width="28" height="18" rx="4" fill="#0369a1" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1"/>
    <text x="198" y="230" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="9.5" font-weight="700">/ə/</text>

    <circle cx="244" cy="90" r="4.5" fill="#fde047"/>
    <text x="244" y="79" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="700">BREAK</text>

    <rect x="272" y="218" width="38" height="18" rx="4" fill="#0369a1" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1"/>
    <text x="291" y="230" text-anchor="middle" fill="#bae6fd" font-family="monospace" font-size="9.5" font-weight="700">/frəm/</text>

    <circle cx="328" cy="96" r="4.5" fill="#fde047"/>
    <text x="328" y="85" text-anchor="middle" fill="#fde047" font-family="monospace" font-size="9.5" font-weight="700">WORK</text>

    <!-- Bottom well legend -->
    <circle cx="76" cy="252" r="3.5" fill="#fbbf24"/>
    <text x="85" y="255" fill="#fde68a" font-family="sans-serif" font-size="9" font-weight="700">Reference peaks</text>
    <circle cx="182" cy="252" r="3.5" fill="#38bdf8"/>
    <text x="191" y="255" fill="#bae6fd" font-family="sans-serif" font-size="9" font-weight="700">Your voice &amp; /ə/ valleys</text>
    <text x="386" y="255" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="700">0.85x · 1.0x · 1.1x</text>
  </g>

  <!-- Right Phonetic Blueprint Card -->
  <g filter="url(#cardShadow)">
    <rect x="424" y="62" width="184" height="206" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <path d="M424 74 Q424 62 436 62 L596 62 Q608 62 608 74 L608 92 L424 92 Z" fill="#fff1f2"/>
    <text x="438" y="81" fill="#be123c" font-family="sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.7">PHONETIC BLUEPRINT</text>

    <text x="438" y="112" fill="#475569" font-family="sans-serif" font-size="9" font-weight="800" letter-spacing="0.5">WRITTEN FORM</text>
    <text x="438" y="130" fill="#0f172a" font-family="Georgia, serif" font-size="12.5" font-weight="700">“I’ve been taking a break”</text>

    <rect x="438" y="144" width="156" height="44" rx="7" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="448" y="160" fill="#0369a1" font-family="sans-serif" font-size="9" font-weight="800">NATURAL REDUCTION</text>
    <text x="448" y="177" fill="#0f172a" font-family="monospace" font-size="11.5" font-weight="700">/aɪv bɪn/ · Ahv-bin</text>

    <rect x="438" y="198" width="156" height="54" rx="7" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2"/>
    <text x="448" y="216" fill="#047857" font-family="sans-serif" font-size="9" font-weight="800">STRESS-TIMING MATCH</text>
    <text x="448" y="239" fill="#047857" font-family="sans-serif" font-size="19" font-weight="800">94%</text>
    <text x="502" y="238" fill="#065f46" font-family="sans-serif" font-size="10" font-weight="700">Peaks + /ə/ contrast</text>
  </g>

  <!-- Bottom Caption Strip -->
  <g transform="translate(54, 286)">
    <rect x="0" y="0" width="554" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="5" fill="#0284c7"/>
    <text x="36" y="25" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="0.35">12 PIPER BRITISH CLIPS · 4 ACTS · WEAK FORMS, MODALS, ELISION &amp; STRESS-TIMING</text>
  </g>
</svg>
