<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="cryptBg" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0616"/>
      <stop offset="55%" stop-color="#180d2c"/>
      <stop offset="100%" stop-color="#090511"/>
    </linearGradient>
    <radialGradient id="torchGlowL" cx="115" cy="135" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="torchGlowR" cx="525" cy="135" r="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lichPortal" cx="320" cy="145" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#6b21a8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090511" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stonePillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e162e"/>
      <stop offset="50%" stop-color="#312548"/>
      <stop offset="100%" stop-color="#150f21"/>
    </linearGradient>
    <linearGradient id="goldRune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Dungeon Vault Backdrop -->
  <rect width="640" height="360" fill="url(#cryptBg)"/>

  <!-- Distant Stone Brick Masonry Courses -->
  <g stroke="#2a1e3f" stroke-width="1" opacity="0.55">
    <line x1="0" y1="45" x2="640" y2="45"/>
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="135" x2="640" y2="135"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="225" x2="640" y2="225"/>
    <line x1="160" y1="0" x2="160" y2="45"/>
    <line x1="320" y1="0" x2="320" y2="45"/>
    <line x1="480" y1="0" x2="480" y2="45"/>
    <line x1="80" y1="45" x2="80" y2="90"/>
    <line x1="240" y1="45" x2="240" y2="90"/>
    <line x1="400" y1="45" x2="400" y2="90"/>
    <line x1="560" y1="45" x2="560" y2="90"/>
    <line x1="140" y1="90" x2="140" y2="135"/>
    <line x1="300" y1="90" x2="300" y2="135"/>
    <line x1="460" y1="90" x2="460" y2="135"/>
  </g>

  <!-- Pointed Gothic Vault Archway -->
  <path d="M135 280 L135 140 Q135 28 320 14 Q505 28 505 140 L505 280 Z" fill="#0d0718" stroke="#3b2d54" stroke-width="6"/>
  <path d="M150 280 L150 145 Q150 44 320 30 Q490 44 490 145 L490 280 Z" fill="#080410" stroke="#c5a059" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Arcane Portal & Arch-Lich Silhouette Inside Arch -->
  <circle cx="320" cy="145" r="110" fill="url(#lichPortal)"/>
  <circle cx="320" cy="145" r="78" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.45"/>
  <circle cx="320" cy="145" r="94" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 6" opacity="0.35"/>

  <!-- Hooded Arch-Lich Guardian Figure -->
  <g transform="translate(320, 128)">
    <!-- Cloak & Shoulders -->
    <path d="M-68 110 C-62 45 -36 18 0 18 C36 18 62 45 68 110 Z" fill="#170d2a" stroke="#581c87" stroke-width="2"/>
    <!-- Jagged Crown & Hood -->
    <path d="M-32 24 C-34 -18 -18 -38 0 -42 C18 -38 34 -18 32 24 Z" fill="#0d061a" stroke="#7e22ce" stroke-width="2"/>
    <polygon points="-22,-32 -14,-52 -6,-36 0,-58 6,-36 14,-52 22,-32" fill="#f59e0b" stroke="#fde68a" stroke-width="1"/>
    <!-- Glowing Eyes -->
    <ellipse cx="-10" cy="-6" rx="5.5" ry="3" fill="#34d399" filter="url(#softGlow)"/>
    <ellipse cx="10" cy="-6" rx="5.5" ry="3" fill="#34d399" filter="url(#softGlow)"/>
    <!-- Floating Grimoire / Staff Energy -->
    <path d="M-45 55 Q0 35 45 55" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.7"/>
  </g>

  <!-- Left & Right Fluted Dungeon Pillars -->
  <rect x="48" y="0" width="56" height="290" fill="url(#stonePillar)" stroke="#2e2246" stroke-width="2"/>
  <rect x="38" y="255" width="76" height="28" rx="3" fill="#271d3b" stroke="#3e2f5b" stroke-width="2"/>
  <rect x="536" y="0" width="56" height="290" fill="url(#stonePillar)" stroke="#2e2246" stroke-width="2"/>
  <rect x="526" y="255" width="76" height="28" rx="3" fill="#271d3b" stroke="#3e2f5b" stroke-width="2"/>

  <!-- Wall Torch Sconces & Volumetric Firelight -->
  <circle cx="115" cy="135" r="125" fill="url(#torchGlowL)"/>
  <circle cx="525" cy="135" r="125" fill="url(#torchGlowR)"/>

  <!-- Left Torch -->
  <g transform="translate(115, 145)">
    <path d="M-6 0 L6 0 L3 28 L-3 28 Z" fill="#451a03" stroke="#78350f" stroke-width="1.5"/>
    <rect x="-9" y="-3" width="18" height="5" rx="2" fill="#92400e"/>
    <path d="M0 -34 C14 -18 12 -4 0 -3 C-12 -4 -14 -18 0 -34 Z" fill="#f59e0b" filter="url(#softGlow)"/>
    <path d="M0 -24 C7 -14 6 -5 0 -4 C-6 -5 -7 -14 0 -24 Z" fill="#fef08a"/>
  </g>

  <!-- Right Torch -->
  <g transform="translate(525, 145)">
    <path d="M-6 0 L6 0 L3 28 L-3 28 Z" fill="#451a03" stroke="#78350f" stroke-width="1.5"/>
    <rect x="-9" y="-3" width="18" height="5" rx="2" fill="#92400e"/>
    <path d="M0 -34 C14 -18 12 -4 0 -3 C-12 -4 -14 -18 0 -34 Z" fill="#f59e0b" filter="url(#softGlow)"/>
    <path d="M0 -24 C7 -14 6 -5 0 -4 C-6 -5 -7 -14 0 -24 Z" fill="#fef08a"/>
  </g>

  <!-- Perspective Flagstone Dungeon Floor & Altar Pedestal -->
  <polygon points="0,275 640,275 640,360 0,360" fill="#120b1d"/>
  <line x1="0" y1="275" x2="640" y2="275" stroke="#4c3a6e" stroke-width="2"/>
  <path d="M85 275 L20 360 M200 275 L165 360 M320 275 L320 360 M440 275 L475 360 M555 275 L620 360" stroke="#261b3a" stroke-width="1.5"/>

  <!-- Stone Rune Altar Table -->
  <rect x="84" y="212" width="472" height="76" rx="10" fill="#191129" stroke="#c5a059" stroke-width="2"/>
  <rect x="92" y="220" width="456" height="60" rx="7" fill="#0e0818" stroke="#4c1d95" stroke-width="1.5"/>

  <!-- Floating Glowing Ember Particles -->
  <g fill="#f59e0b" filter="url(#softGlow)">
    <circle cx="160" cy="188" r="2.5" opacity="0.8"/>
    <circle cx="210" cy="172" r="1.8" opacity="0.6"/>
    <circle cx="270" cy="195" r="2.2" opacity="0.9"/>
    <circle cx="340" cy="165" r="3" opacity="0.7"/>
    <circle cx="410" cy="180" r="2" opacity="0.8"/>
    <circle cx="480" cy="190" r="2.6" opacity="0.65"/>
    <circle cx="510" cy="168" r="1.5" opacity="0.9"/>
  </g>

  <!-- 4 Carved Glowing Grammar Rune Stones on the Altar + POS Slot Blueprints -->
  <!-- Rune 1: SCARCELY [AdvP] -->
  <g transform="translate(106, 224)">
    <rect width="108" height="42" rx="6" fill="#2e1065" stroke="#f59e0b" stroke-width="2"/>
    <rect x="3" y="3" width="102" height="36" rx="4" fill="#1e1b4b" opacity="0.6"/>
    <text x="54" y="26" text-anchor="middle" fill="url(#goldRune)" font-family="monospace, sans-serif" font-weight="900" font-size="14" letter-spacing="1">SCARCELY</text>
    <rect x="24" y="44" width="60" height="15" rx="3" fill="#090511" stroke="#f59e0b" stroke-width="1"/>
    <text x="54" y="55" text-anchor="middle" fill="#fde68a" font-family="monospace, sans-serif" font-weight="800" font-size="9" letter-spacing="0.5">SLOT: AdvP</text>
  </g>

  <!-- Rune 2: HAD [Op] -->
  <g transform="translate(224, 224)">
    <rect width="74" height="42" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="2"/>
    <text x="37" y="26" text-anchor="middle" fill="#e9d5ff" font-family="monospace, sans-serif" font-weight="900" font-size="14" letter-spacing="1">HAD</text>
    <rect x="12" y="44" width="50" height="15" rx="3" fill="#090511" stroke="#a855f7" stroke-width="1"/>
    <text x="37" y="55" text-anchor="middle" fill="#e9d5ff" font-family="monospace, sans-serif" font-weight="800" font-size="9" letter-spacing="0.5">SLOT: Op</text>
  </g>

  <!-- Rune 3: WE [Subj] -->
  <g transform="translate(308, 224)">
    <rect width="68" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="34" y="26" text-anchor="middle" fill="#bae6fd" font-family="monospace, sans-serif" font-weight="900" font-size="14" letter-spacing="1">WE</text>
    <rect x="9" y="44" width="50" height="15" rx="3" fill="#090511" stroke="#38bdf8" stroke-width="1"/>
    <text x="34" y="55" text-anchor="middle" fill="#bae6fd" font-family="monospace, sans-serif" font-weight="800" font-size="9" letter-spacing="0.5">SLOT: Subj</text>
  </g>

  <!-- Rune 4: ENTERED... [Verb] (Active Slot Glow) -->
  <g transform="translate(386, 224)">
    <rect width="146" height="42" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="2.2"/>
    <text x="73" y="26" text-anchor="middle" fill="#a7f3d0" font-family="monospace, sans-serif" font-weight="900" font-size="14" letter-spacing="1">ENTERED...</text>
    <rect x="43" y="44" width="60" height="15" rx="3" fill="#090511" stroke="#34d399" stroke-width="1"/>
    <text x="73" y="55" text-anchor="middle" fill="#a7f3d0" font-family="monospace, sans-serif" font-weight="800" font-size="9" letter-spacing="0.5">SLOT: Verb</text>
  </g>

  <!-- Top Arcade HUD Telemetry Bar -->
  <rect x="16" y="14" width="180" height="26" rx="6" fill="#090511" fill-opacity="0.88" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="28" y="31" fill="#fde68a" font-family="monospace, sans-serif" font-weight="800" font-size="11" letter-spacing="0.8">FLOOR 25 // ARCH-LICH</text>

  <rect x="426" y="14" width="198" height="26" rx="6" fill="#090511" fill-opacity="0.88" stroke="#a855f7" stroke-width="1.2"/>
  <text x="438" y="31" fill="#e9d5ff" font-family="monospace, sans-serif" font-weight="800" font-size="11" letter-spacing="0.8">25 FLOORS • 2D &amp; 3D MODES</text>
</svg>
