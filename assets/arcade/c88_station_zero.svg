<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="spaceBg" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020712"/>
      <stop offset="55%" stop-color="#071930"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>
    <pattern id="crtLines3" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#spaceBg)"/>

  <!-- Left Viewport: Orbital Space Window & Ringed Planet -->
  <rect x="34" y="24" width="310" height="190" rx="6" fill="#030917" stroke="#38bdf8" stroke-width="2.2"/>
  <!-- Stars -->
  <g fill="#e0f2fe" opacity="0.8">
    <circle cx="68" cy="52" r="1.5"/><circle cx="124" cy="44" r="1"/><circle cx="280" cy="58" r="1.5"/>
    <circle cx="88" cy="168" r="1.2"/><circle cx="305" cy="142" r="1.5"/><circle cx="245" cy="185" r="1"/>
  </g>
  <!-- Ringed Gas Giant Planet -->
  <g transform="translate(188, 118)">
    <ellipse cx="0" cy="0" rx="92" ry="22" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.55" transform="rotate(-16)"/>
    <circle cx="0" cy="0" r="44" fill="#0c4a6e" stroke="#7dd3fc" stroke-width="2"/>
    <path d="M-40 -12 Q0 -24 40 -12" stroke="#0284c7" stroke-width="6" fill="none"/>
    <path d="M-43 8 Q0 -4 43 8" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.6"/>
  </g>

  <!-- Right Panel: MOTHER-88 AI Core Mainframe -->
  <rect x="362" y="24" width="244" height="190" rx="6" fill="#040d1a" stroke="#38bdf8" stroke-width="2.2"/>
  <rect x="370" y="32" width="228" height="22" rx="3" fill="#0c4a6e"/>
  <text x="380" y="47" fill="#bae6fd" font-family="monospace, sans-serif" font-size="11" font-weight="900">TAPE 03 // AI: MOTHER-88</text>

  <!-- Glowing AI Optical Lens -->
  <circle cx="484" cy="108" r="36" fill="#082f49" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="484" cy="108" r="22" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5"/>
  <circle cx="484" cy="108" r="9" fill="#e0f2fe"/>

  <text x="484" y="166" text-anchor="middle" fill="#7dd3fc" font-family="monospace, sans-serif" font-size="11" font-weight="900">OXYGEN: 92% • HULL: SEALED</text>
  <text x="484" y="186" text-anchor="middle" fill="#34d399" font-family="monospace, sans-serif" font-size="10" font-weight="800">PROTOCOL: PASSIVE VOICE ONLY</text>

  <!-- Bottom PC-98 Dialogue Frame -->
  <rect x="34" y="232" width="572" height="104" rx="6" fill="#030814" stroke="#38bdf8" stroke-width="2.2"/>
  <text x="52" y="258" fill="#38bdf8" font-family="monospace, sans-serif" font-size="12" font-weight="900">MOTHER-88 MAINFRAME [ORBITAL STATION ZERO // 1988]:</text>
  <text x="52" y="282" fill="#f8fafc" font-family="monospace, sans-serif" font-size="13" font-weight="700">“Airlock 4 IS BEING PRESSURISED. Have the hull breach WELDED.”</text>
  <text x="52" y="312" fill="#fbbf24" font-family="monospace, sans-serif" font-size="11" font-weight="800">▶ B1–B2 PASSIVE VOICE • CAUSATIVE HAVE/GET • FUTURE PERFECT</text>

  <rect width="640" height="360" fill="url(#crtLines3)" pointer-events="none"/>
</svg>
