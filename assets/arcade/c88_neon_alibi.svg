<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="noirSky" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0716"/>
      <stop offset="55%" stop-color="#19102c"/>
      <stop offset="100%" stop-color="#060814"/>
    </linearGradient>
    <pattern id="crtLines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#noirSky)"/>

  <!-- Rain-Streaked Neo-Belfast Window & Neon Skyline -->
  <rect x="34" y="24" width="290" height="190" rx="4" fill="#080c1d" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="52" y="68" width="44" height="146" fill="#111827"/>
  <rect x="108" y="48" width="58" height="166" fill="#0f172a"/>
  <rect x="178" y="82" width="52" height="132" fill="#1e1b4b"/>
  <rect x="242" y="56" width="64" height="158" fill="#0f172a"/>

  <!-- Neon Kanji/Cyberpunk Billboards Outside Window -->
  <rect x="116" y="64" width="42" height="22" rx="2" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="137" y="79" text-anchor="middle" fill="#fde68a" font-family="monospace, sans-serif" font-size="10" font-weight="900">23:15</text>
  <rect x="250" y="72" width="48" height="20" rx="2" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="274" y="86" text-anchor="middle" fill="#a5f3fc" font-family="monospace, sans-serif" font-size="9" font-weight="900">VAULT 4</text>

  <!-- Diagonal Rain Streaks -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.35">
    <line x1="80" y1="32" x2="62" y2="110"/><line x1="150" y1="40" x2="132" y2="120"/>
    <line x1="210" y1="35" x2="192" y2="115"/><line x1="285" y1="45" x2="267" y2="125"/>
    <line x1="115" y1="110" x2="97" y2="190"/><line x1="240" y1="120" x2="222" y2="200"/>
  </g>

  <!-- Detective Kira Silhouette in Trenchcoat -->
  <g transform="translate(182, 162)">
    <path d="M-54 115 L-38 36 L-18 22 L18 22 L38 36 L54 115 Z" fill="#1e1b2e" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="-24,22 -8,48 0,34 8,48 24,22" fill="#fbbf24"/>
    <ellipse cx="0" cy="-6" rx="22" ry="26" fill="#151221" stroke="#f59e0b" stroke-width="2"/>
    <!-- Cyberpunk Visor -->
    <rect x="-16" y="-12" width="32" height="8" rx="2" fill="#22d3ee"/>
  </g>

  <!-- Right Panel: PC-88 Alibi Timeline Monitor -->
  <rect x="348" y="24" width="258" height="190" rx="6" fill="#050b14" stroke="#10b981" stroke-width="2.2"/>
  <rect x="356" y="32" width="242" height="22" rx="3" fill="#064e3b"/>
  <text x="366" y="47" fill="#a7f3d0" font-family="monospace, sans-serif" font-size="11" font-weight="900">TAPE 01 // PC-88 ALIBI TIMELINE</text>

  <!-- Timeline Axis inside Monitor -->
  <line x1="372" y1="108" x2="582" y2="108" stroke="#34d399" stroke-width="2"/>
  <circle cx="412" cy="108" r="6" fill="#fbbf24"/>
  <text x="412" y="92" text-anchor="middle" fill="#fde68a" font-family="monospace, sans-serif" font-size="10" font-weight="800">23:00</text>
  <text x="412" y="128" text-anchor="middle" fill="#fde68a" font-family="monospace, sans-serif" font-size="9" font-weight="800">“HAD LEFT”</text>

  <circle cx="534" cy="108" r="6" fill="#f43f5e"/>
  <text x="534" y="92" text-anchor="middle" fill="#fda4af" font-family="monospace, sans-serif" font-size="10" font-weight="800">23:15 ALARM</text>
  <text x="534" y="128" text-anchor="middle" fill="#fda4af" font-family="monospace, sans-serif" font-size="9" font-weight="800">“WENT OFF”</text>

  <rect x="366" y="150" width="222" height="48" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="376" y="169" fill="#fde68a" font-family="monospace, sans-serif" font-size="10" font-weight="800">CLUE: PAST PERFECT = BEFORE</text>
  <text x="376" y="186" fill="#e2e8f0" font-family="monospace, sans-serif" font-size="10">Kael cleared the vault before 23:15.</text>

  <!-- Bottom PC-88 Dialogue Frame -->
  <rect x="34" y="232" width="572" height="104" rx="6" fill="#050811" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="52" y="258" fill="#fbbf24" font-family="monospace, sans-serif" font-size="12" font-weight="900">INSPECTOR DECK [PC-88 NEO-BELFAST // 1989]:</text>
  <text x="52" y="282" fill="#f8fafc" font-family="monospace, sans-serif" font-size="13" font-weight="700">“Vance was still typing, but Kael HAD ALREADY LEFT with the Omega Chip.”</text>
  <text x="52" y="312" fill="#34d399" font-family="monospace, sans-serif" font-size="11" font-weight="800">▶ B1–B2 PAST SIMPLE vs PAST PERFECT • REPORTED SPEECH • 2D6 COMPOSURE</text>

  <rect width="640" height="360" fill="url(#crtLines)" pointer-events="none"/>
</svg>
