<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" shape-rendering="crispEdges">
  <defs>
    <pattern id="ditherBlue" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <rect x="0" y="0" width="1" height="1" fill="#0000ff"/>
      <rect x="2" y="2" width="1" height="1" fill="#0000ff"/>
    </pattern>
    <pattern id="ditherCheckBlue" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <rect x="0" y="0" width="2" height="2" fill="#0000ff"/>
      <rect x="2" y="2" width="2" height="2" fill="#0000ff"/>
    </pattern>
    <pattern id="ditherVault" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0000ff"/>
      <rect x="0" y="0" width="2" height="2" fill="#00ffff"/>
      <rect x="2" y="2" width="2" height="2" fill="#00ffff"/>
    </pattern>
    <pattern id="ditherSkin" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#ffff00"/>
      <rect x="0" y="0" width="1" height="1" fill="#ff0000"/>
      <rect x="2" y="2" width="1" height="1" fill="#ff0000"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="2" width="4" height="2" fill="#000000" fill-opacity="0.32"/>
    </pattern>
  </defs>

  <!-- PC-88 Outer Frame -->
  <rect width="640" height="360" fill="#000000"/>
  <rect x="2" y="2" width="636" height="356" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="6" y="6" width="628" height="348" fill="none" stroke="#0000ff" stroke-width="2"/>

  <!-- Top Status Bar (Exact PC-88 Blue Header) -->
  <rect x="8" y="8" width="624" height="22" fill="#0000ff"/>
  <text x="16" y="23" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">TAPE 1 · SCENE 1/4 · CYBERCORP VAULT</text>
  <text x="624" y="23" text-anchor="end" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">Past Simple vs Past Perfect</text>

  <!-- ================= PIXEL SCENE CANVAS (y: 30..234) ================= -->
  <g transform="translate(0, 30)">
    <rect x="8" y="0" width="624" height="204" fill="url(#ditherBlue)"/>

    <!-- CyberCorp Architecture Columns -->
    <g>
      <rect x="16" y="0" width="6" height="152" fill="#0000ff"/><rect x="22" y="0" width="2" height="152" fill="#00ffff"/>
      <rect x="88" y="0" width="6" height="152" fill="#0000ff"/><rect x="94" y="0" width="2" height="152" fill="#00ffff"/>
      <rect x="160" y="0" width="6" height="152" fill="#0000ff"/><rect x="166" y="0" width="2" height="152" fill="#00ffff"/>
      <rect x="232" y="0" width="6" height="152" fill="#0000ff"/><rect x="238" y="0" width="2" height="152" fill="#00ffff"/>
      <rect x="368" y="0" width="6" height="152" fill="#0000ff"/><rect x="374" y="0" width="2" height="152" fill="#00ffff"/>
      <rect x="440" y="0" width="6" height="152" fill="#0000ff"/><rect x="446" y="0" width="2" height="152" fill="#00ffff"/>
    </g>
    <rect x="8" y="16" width="494" height="4" fill="#0000ff"/>
    <rect x="8" y="148" width="624" height="4" fill="#00ffff"/>

    <!-- Magenta Perspective Grid Floor -->
    <rect x="8" y="152" width="624" height="52" fill="#000000"/>
    <g fill="#ff00ff">
      <rect x="8" y="154" width="624" height="1"/>
      <rect x="8" y="162" width="624" height="1"/>
      <rect x="8" y="172" width="624" height="1"/>
      <rect x="8" y="185" width="624" height="1"/>
      <rect x="8" y="200" width="624" height="1"/>
      <rect x="36" y="152" width="2" height="52"/><rect x="76" y="152" width="2" height="52"/>
      <rect x="116" y="152" width="2" height="52"/><rect x="156" y="152" width="2" height="52"/>
      <rect x="196" y="152" width="2" height="52"/><rect x="236" y="152" width="2" height="52"/>
      <rect x="276" y="152" width="2" height="52"/><rect x="316" y="152" width="2" height="52"/>
      <rect x="356" y="152" width="2" height="52"/><rect x="396" y="152" width="2" height="52"/>
      <rect x="436" y="152" width="2" height="52"/><rect x="476" y="152" width="2" height="52"/>
      <rect x="516" y="152" width="2" height="52"/><rect x="556" y="152" width="2" height="52"/>
      <rect x="596" y="152" width="2" height="52"/>
    </g>

    <!-- Location Badge Top-Left -->
    <rect x="16" y="8" width="212" height="22" fill="#000000" stroke="#ffff00" stroke-width="2"/>
    <text x="24" y="23" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="12" font-weight="bold">SECTOR 1 • CYBERCORP VAULT</text>

    <!-- Left Security Console Bank (23:05 LOCKED LOG) -->
    <rect x="20" y="38" width="114" height="88" fill="#ffffff"/>
    <rect x="22" y="40" width="110" height="84" fill="#000000"/>
    <rect x="26" y="44" width="102" height="16" fill="#0000ff"/>
    <text x="30" y="56" fill="#00ffff" font-family="'Courier New', monospace" font-size="10" font-weight="bold">SECURITY LOG</text>
    <text x="28" y="74" fill="#00ff00" font-family="'Courier New', monospace" font-size="10" font-weight="bold">23:05 LOCKED</text>
    <text x="28" y="88" fill="#ffffff" font-family="'Courier New', monospace" font-size="9">BY: VANCE</text>
    <text x="28" y="103" fill="#ff0000" font-family="'Courier New', monospace" font-size="10" font-weight="bold">23:15 OPENED!</text>
    <!-- Console indicator LEDs -->
    <rect x="28" y="112" width="8" height="5" fill="#00ff00"/>
    <rect x="42" y="112" width="8" height="5" fill="#ffff00"/>
    <rect x="56" y="112" width="8" height="5" fill="#ff0000"/>
    <rect x="70" y="112" width="8" height="5" fill="#00ffff"/>

    <!-- Heavy Circular CyberCorp Vault Door (Swung Open) -->
    <!-- Vault Opening Cavity -->
    <ellipse cx="268" cy="86" rx="70" ry="44" fill="#ffffff"/>
    <ellipse cx="268" cy="86" rx="64" ry="39" fill="url(#ditherCheckBlue)"/>
    <!-- Open Vault Door Leaf with Locking Spokes -->
    <ellipse cx="304" cy="88" rx="52" ry="34" fill="#ffffff"/>
    <ellipse cx="304" cy="88" rx="46" ry="29" fill="url(#ditherVault)"/>
    <rect x="301" y="62" width="6" height="52" fill="#ffffff"/>
    <rect x="264" y="85" width="80" height="6" fill="#ffffff"/>
    <ellipse cx="304" cy="88" rx="12" ry="9" fill="#ffff00"/>
    <!-- Red Flashing Alarm Lamp Above Vault -->
    <rect x="246" y="8" width="44" height="10" fill="#ff0000" stroke="#ffffff" stroke-width="2"/>

    <!-- ALARM 23:15 Readout & Telemetry Panel -->
    <rect x="380" y="18" width="114" height="108" fill="#000000" stroke="#ff00ff" stroke-width="2"/>
    <rect x="386" y="24" width="102" height="28" fill="#ff0000"/>
    <text x="437" y="43" text-anchor="middle" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="16" font-weight="bold">ALARM 23:15</text>
    <text x="392" y="68" fill="#00ffff" font-family="'Courier New', monospace" font-size="10" font-weight="bold">OMEGA CHIP: GONE</text>
    <!-- Mini Alibi Timeline inside Telemetry -->
    <line x1="394" y1="88" x2="480" y2="88" stroke="#ffffff" stroke-width="2"/>
    <rect x="404" y="83" width="8" height="10" fill="#00ff00"/>
    <text x="408" y="106" text-anchor="middle" fill="#00ff00" font-family="'Courier New', monospace" font-size="9" font-weight="bold">23:05</text>
    <rect x="458" y="83" width="8" height="10" fill="#ff0000"/>
    <text x="462" y="106" text-anchor="middle" fill="#ffff00" font-family="'Courier New', monospace" font-size="9" font-weight="bold">23:15</text>

    <!-- Guard Vance Sprite (Left: Blue Coat, White Hair, Red Visor) -->
    <g transform="translate(152, 110)">
      <rect x="2" y="0" width="22" height="7" fill="#ffffff"/>
      <rect x="0" y="5" width="26" height="16" fill="url(#ditherSkin)"/>
      <rect x="2" y="9" width="22" height="5" fill="#ff0000"/>
      <rect x="-4" y="21" width="34" height="26" fill="#0000ff"/>
      <rect x="9" y="21" width="8" height="12" fill="#ffffff"/>
      <rect x="12" y="23" width="2" height="12" fill="#00ffff"/>
      <rect x="2" y="47" width="9" height="18" fill="#00ffff"/>
      <rect x="15" y="47" width="9" height="18" fill="#00ffff"/>
      <rect x="-2" y="65" width="12" height="4" fill="#ffffff"/>
      <rect x="16" y="65" width="12" height="4" fill="#ffffff"/>
      <rect x="-8" y="-16" width="44" height="13" fill="#000000" stroke="#00ffff" stroke-width="1"/>
      <text x="14" y="-6" text-anchor="middle" fill="#00ffff" font-family="'Courier New', monospace" font-size="9" font-weight="bold">VANCE</text>
    </g>

    <!-- Wet Cyan Bootprints leading from Vault to Kael -->
    <g fill="#00ffff">
      <rect x="312" y="168" width="10" height="4"/>
      <rect x="334" y="175" width="10" height="4"/>
      <rect x="356" y="168" width="10" height="4"/>
      <rect x="378" y="175" width="10" height="4"/>
      <rect x="400" y="168" width="10" height="4"/>
    </g>

    <!-- Courier Kael Sprite (Center-Right: Magenta Coat, Green Hair, Cyan Visor) -->
    <g transform="translate(422, 110)">
      <rect x="2" y="0" width="22" height="7" fill="#00ff00"/>
      <rect x="0" y="5" width="26" height="16" fill="url(#ditherSkin)"/>
      <rect x="2" y="9" width="22" height="5" fill="#00ffff"/>
      <rect x="-4" y="21" width="34" height="26" fill="#ff00ff"/>
      <rect x="9" y="21" width="8" height="12" fill="#ffffff"/>
      <rect x="12" y="23" width="2" height="12" fill="#ffff00"/>
      <rect x="2" y="47" width="9" height="18" fill="#ff0000"/>
      <rect x="15" y="47" width="9" height="18" fill="#ff0000"/>
      <rect x="-2" y="65" width="12" height="4" fill="#ffffff"/>
      <rect x="16" y="65" width="12" height="4" fill="#ffffff"/>
      <rect x="-6" y="-16" width="40" height="13" fill="#000000" stroke="#ff00ff" stroke-width="1"/>
      <text x="14" y="-6" text-anchor="middle" fill="#ffff00" font-family="'Courier New', monospace" font-size="9" font-weight="bold">KAEL</text>
    </g>

    <!-- Right-Hand Talking Character Portrait Window (COURIER KAEL) -->
    <g transform="translate(506, 10)">
      <rect x="-2" y="-2" width="122" height="122" fill="#000000"/>
      <rect x="0" y="0" width="118" height="118" fill="#ff00ff"/>
      <rect x="2" y="2" width="114" height="114" fill="#ffffff"/>
      <rect x="4" y="4" width="110" height="96" fill="url(#ditherBlue)"/>
      <!-- Shoulders & Magenta Jacket -->
      <rect x="17" y="72" width="84" height="28" fill="#ff00ff"/>
      <rect x="43" y="72" width="32" height="28" fill="#ffffff"/>
      <rect x="53" y="74" width="12" height="26" fill="#ffff00"/>
      <!-- Neck & Face -->
      <rect x="49" y="62" width="20" height="14" fill="#ffff00"/>
      <rect x="41" y="28" width="36" height="36" fill="url(#ditherSkin)"/>
      <!-- Green Spiky Cyberpunk Hair -->
      <rect x="36" y="16" width="46" height="14" fill="#00ff00"/>
      <rect x="36" y="26" width="6" height="24" fill="#00ff00"/>
      <rect x="76" y="26" width="6" height="24" fill="#00ff00"/>
      <rect x="44" y="18" width="14" height="3" fill="#ffffff"/>
      <!-- Cyan Cyber-Visor -->
      <rect x="41" y="38" width="36" height="9" fill="#000000"/>
      <rect x="43" y="40" width="32" height="5" fill="#00ffff"/>
      <rect x="58" y="40" width="8" height="2" fill="#ffffff"/>
      <!-- Nose & Talking Mouth -->
      <rect x="58" y="49" width="2" height="5" fill="#ff0000"/>
      <rect x="53" y="56" width="12" height="5" fill="#000000"/>
      <rect x="55" y="57" width="8" height="3" fill="#ff0000"/>
      <!-- Portrait Nameplate -->
      <rect x="2" y="100" width="114" height="16" fill="#000000"/>
      <rect x="2" y="100" width="114" height="2" fill="#ff00ff"/>
      <text x="10" y="112" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="11" font-weight="bold">KAEL [SUSPECT]</text>
      <rect x="106" y="106" width="5" height="5" fill="#00ff00"/>
    </g>
  </g>

  <!-- Divider Line Between CG Viewport & Lower Split Window -->
  <rect x="8" y="234" width="624" height="2" fill="#ffffff"/>

  <!-- ================= LOWER SPLIT WINDOW (y: 236..352) ================= -->
  <!-- Left Text Window -->
  <rect x="8" y="236" width="462" height="116" fill="#000000"/>
  <text x="20" y="258" fill="#00ffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="14" font-weight="bold">『INSPECTOR DECK』</text>
  <text x="20" y="282" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13">Vance: “When the 23:15 alarm went off, I </text>
  <text x="308" y="282" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">had already locked</text>
  <text x="442" y="282" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13"> it.”</text>

  <text x="20" y="306" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13">Kael: “When the alarm went off, I </text>
  <text x="252" y="306" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">left the vault</text>
  <text x="356" y="306" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13">.”</text>

  <text x="20" y="334" fill="#00ff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="12" font-weight="bold">▶ Whose tense places them INSIDE the vault at 23:15?</text>
  <text x="448" y="340" fill="#ffff00" font-family="monospace" font-size="14">▼</text>

  <!-- Vertical Split Border -->
  <rect x="470" y="236" width="2" height="116" fill="#ffffff"/>

  <!-- Right Command Menu Window -->
  <rect x="472" y="236" width="160" height="116" fill="#000000"/>
  <text x="484" y="255" fill="#ff00ff" font-family="'DotGothic16', 'Courier New', monospace" font-size="12" font-weight="bold">COMMAND</text>
  <text x="484" y="276" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13"><tspan fill="#ffff00">1</tspan> LOOK</text>
  <text x="484" y="296" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13"><tspan fill="#ffff00">2</tspan> TALK</text>
  <text x="484" y="316" fill="#ffffff" font-family="'DotGothic16', 'Courier New', monospace" font-size="13"><tspan fill="#ffff00">3</tspan> EXAMINE</text>
  <rect x="478" y="323" width="148" height="22" fill="#0000ff"/>
  <text x="484" y="339" fill="#ffff00" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" font-weight="bold">▶ 4 ACCUSE</text>

  <!-- Authentic CRT Scanline Overlay -->
  <rect width="640" height="360" fill="url(#scanlines)" pointer-events="none"/>
</svg>
