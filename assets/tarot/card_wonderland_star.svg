<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <radialGradient id="starBg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#112b3c"/>
      <stop offset="55%" stop-color="#081520"/>
      <stop offset="100%" stop-color="#03080d"/>
    </radialGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#967419"/>
      <stop offset="100%" stop-color="#faecc0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="840" fill="url(#starBg)"/>

  <!-- Victorian Outer Frame -->
  <rect x="24" y="24" width="552" height="792" rx="18" fill="none" stroke="url(#goldStar)" stroke-width="3.5"/>
  <rect x="36" y="36" width="528" height="768" rx="12" fill="none" stroke="url(#goldStar)" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- The Great 8-Pointed Star of Wonderland -->
  <g transform="translate(300, 270)">
    <circle cx="0" cy="0" r="145" fill="none" stroke="url(#goldStar)" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="110" fill="#091a26" stroke="url(#goldStar)" stroke-width="2.5"/>
    <!-- 8-Pointed Celestial Starburst -->
    <polygon points="0,-135 28,-28 135,0 28,28 0,135 -28,28 -135,0 -28,-28" fill="url(#goldStar)"/>
    <polygon points="-95,-95 -18,-35 95,-95 35,-18 95,95 18,35 -95,95 -35,18" fill="none" stroke="url(#goldStar)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="32" fill="#091a26" stroke="url(#goldStar)" stroke-width="3"/>
    <!-- Cheshire Crescent Grin Inside the Star -->
    <path d="M -18 -4 Q 0 18 18 -4 Q 0 28 -18 -4 Z" fill="url(#goldStar)"/>
  </g>

  <!-- White Rabbit's Pocket Watch & Rabbit-Hole Vortex Below -->
  <g transform="translate(300, 565)">
    <ellipse cx="0" cy="40" rx="180" ry="68" fill="none" stroke="url(#goldStar)" stroke-width="2" stroke-dasharray="8 6"/>
    <ellipse cx="0" cy="40" rx="130" ry="46" fill="none" stroke="url(#goldStar)" stroke-width="1.8"/>
    <ellipse cx="0" cy="40" rx="75" ry="26" fill="#040b11" stroke="url(#goldStar)" stroke-width="2.5"/>

    <!-- Pocket Watch Crown & Hands -->
    <circle cx="0" cy="-45" r="56" fill="#0b1f2e" stroke="url(#goldStar)" stroke-width="3.5"/>
    <circle cx="0" cy="-112" r="12" fill="none" stroke="url(#goldStar)" stroke-width="3"/>
    <line x1="0" y1="-45" x2="-22" y2="-72" stroke="url(#goldStar)" stroke-width="3"/>
    <line x1="0" y1="-45" x2="28" y2="-45" stroke="url(#goldStar)" stroke-width="2.5"/>
  </g>

  <!-- 7 Smaller Constellation Stars -->
  <g fill="url(#goldStar)">
    <circle cx="120" cy="150" r="6"/>
    <circle cx="480" cy="150" r="6"/>
    <circle cx="95" cy="360" r="5"/>
    <circle cx="505" cy="360" r="5"/>
    <circle cx="145" cy="470" r="7"/>
    <circle cx="455" cy="470" r="7"/>
  </g>
</svg>
