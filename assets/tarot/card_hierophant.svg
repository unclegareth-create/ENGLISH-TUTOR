<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <radialGradient id="hieroBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1f1629"/>
      <stop offset="58%" stop-color="#0d0a14"/>
      <stop offset="100%" stop-color="#050408"/>
    </radialGradient>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc0"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#8c6d1f"/>
      <stop offset="100%" stop-color="#f7e5a9"/>
    </linearGradient>
    <pattern id="engravingLines" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="600" height="840" fill="url(#hieroBg)"/>
  <rect width="600" height="840" fill="url(#engravingLines)"/>

  <!-- Victorian Outer Frame -->
  <rect x="24" y="24" width="552" height="792" rx="18" fill="none" stroke="url(#goldKey)" stroke-width="3.5"/>
  <rect x="36" y="36" width="528" height="768" rx="12" fill="none" stroke="url(#goldKey)" stroke-width="1.2" stroke-dasharray="8 4"/>

  <!-- Twin Cathedral Pillars of C1 Syntax -->
  <rect x="64" y="150" width="54" height="580" fill="#120c18" stroke="url(#goldKey)" stroke-width="2.5"/>
  <rect x="482" y="150" width="54" height="580" fill="#120c18" stroke="url(#goldKey)" stroke-width="2.5"/>

  <!-- Gothic Arch Inscribed Frame -->
  <path d="M 90 150 Q 300 35 510 150" fill="none" stroke="url(#goldKey)" stroke-width="4"/>
  <path d="M 105 165 Q 300 65 495 165" fill="none" stroke="url(#goldKey)" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- Sacred Halo & Grammatical Balance -->
  <circle cx="300" cy="390" r="168" fill="#150f20" stroke="url(#goldKey)" stroke-width="3"/>
  <circle cx="300" cy="390" r="148" fill="none" stroke="url(#goldKey)" stroke-width="1.5" stroke-dasharray="10 6"/>

  <!-- Two Crossed Brass Keys of Cleft & Inversion -->
  <g transform="translate(300, 390)">
    <!-- Key 1 (Rotated -38 deg) -->
    <g transform="rotate(-38)" stroke="url(#goldKey)" stroke-width="3" fill="#231832">
      <circle cx="0" cy="-115" r="36" fill="none" stroke-width="5"/>
      <circle cx="0" cy="-115" r="20" fill="none" stroke-width="2"/>
      <rect x="-6" y="-79" width="12" height="215" fill="url(#goldKey)"/>
      <path d="M 6 95 L 34 95 L 34 110 L 18 110 L 18 122 L 34 122 L 34 136 L 6 136 Z" fill="url(#goldKey)"/>
    </g>
    <!-- Key 2 (Rotated +38 deg) -->
    <g transform="rotate(38)" stroke="url(#goldKey)" stroke-width="3" fill="#231832">
      <circle cx="0" cy="-115" r="36" fill="none" stroke-width="5"/>
      <circle cx="0" cy="-115" r="20" fill="none" stroke-width="2"/>
      <rect x="-6" y="-79" width="12" height="215" fill="url(#goldKey)"/>
      <path d="M -6 95 L -34 95 L -34 110 L -18 110 L -18 122 L -34 122 L -34 136 L -6 136 Z" fill="url(#goldKey)"/>
    </g>
    <!-- Central Rosette Lock -->
    <circle cx="0" cy="0" r="28" fill="#120c18" stroke="url(#goldKey)" stroke-width="3.5"/>
    <polygon points="0,-18 15,9 -15,9" fill="url(#goldKey)"/>
    <polygon points="0,18 15,-9 -15,-9" fill="none" stroke="url(#goldKey)" stroke-width="2"/>
  </g>

  <!-- Inscribed Formula Scroll Banner -->
  <rect x="135" y="610" width="330" height="58" rx="8" fill="#120c18" stroke="url(#goldKey)" stroke-width="2.5"/>
  <text x="300" y="635" text-anchor="middle" fill="#faecc0" font-family="Cinzel, serif" font-size="14" font-weight="700" letter-spacing="2">NOT ONLY · BUT ALSO</text>
  <text x="300" y="655" text-anchor="middle" fill="#d4af37" font-family="Cormorant Garamond, serif" font-style="italic" font-size="14">What + Clause + BE + Pivot</text>
</svg>
