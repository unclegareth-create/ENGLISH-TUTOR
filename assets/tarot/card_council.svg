<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <radialGradient id="councilBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2c1d11"/>
      <stop offset="55%" stop-color="#140d08"/>
      <stop offset="100%" stop-color="#080503"/>
    </radialGradient>
    <linearGradient id="goldCouncil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc0"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#967419"/>
      <stop offset="100%" stop-color="#f7e5a9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="840" fill="url(#councilBg)"/>

  <!-- Victorian Outer Frame -->
  <rect x="24" y="24" width="552" height="792" rx="18" fill="none" stroke="url(#goldCouncil)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="768" rx="12" fill="none" stroke="url(#goldCouncil)" stroke-width="1.2" stroke-dasharray="8 4"/>

  <!-- The Circular Oak Round Table & 7 Persona Thrones -->
  <g transform="translate(300, 420)">
    <!-- Outer Halo -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="url(#goldCouncil)" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="205" fill="#181009" stroke="url(#goldCouncil)" stroke-width="4"/>
    <circle cx="0" cy="0" r="150" fill="#0f231b" stroke="url(#goldCouncil)" stroke-width="3"/>

    <!-- Sacred Heptagram (7-Pointed Star of the Council) -->
    <polygon points="0,-190 148,118 -185,-42 185,-42 -148,118 82,-171 -82,-171" fill="none" stroke="url(#goldCouncil)" stroke-width="2" opacity="0.75"/>
    <polygon points="0,-190 185,-42 -82,171 -82,-171 148,118 -185,-42 82,171" fill="none" stroke="url(#goldCouncil)" stroke-width="2.2"/>

    <!-- 7 Seat Medallions around the Rim -->
    <circle cx="0" cy="-190" r="22" fill="#181009" stroke="url(#goldCouncil)" stroke-width="2.5"/>
    <circle cx="148" cy="-118" r="22" fill="#181009" stroke="url(#goldCouncil)" stroke-width="2.5"/>
    <circle cx="185" cy="42" r="22" fill="#181009" stroke="url(#goldCouncil)" stroke-width="2.5"/>
    <circle cx="82" cy="171" r="22" fill="#181009" stroke="url(#goldCouncil)" stroke-width="2.5"/>
    <circle cx="-82" cy="171" r="22" fill="#181009" stroke="url(#goldCouncil)" stroke-width="2.5"/>
    <circle cx="-185" cy="42" r="22" fill="#181009" stroke="url(#goldCouncil)" stroke-width="2.5"/>
    <circle cx="-148" cy="-118" r="22" fill="#181009" stroke="url(#goldCouncil)" stroke-width="2.5"/>

    <!-- Central Sovereign Lantern Flame -->
    <circle cx="0" cy="0" r="54" fill="#181009" stroke="url(#goldCouncil)" stroke-width="3"/>
    <path d="M 0 -34 C 20 -10, 22 18, 0 32 C -22 18, -20 -10, 0 -34 Z" fill="url(#goldCouncil)"/>
    <path d="M 0 -16 C 9 -2, 10 12, 0 20 C -10 12, -9 -2, 0 -16 Z" fill="#181009"/>
  </g>
</svg>
