<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <radialGradient id="sunBg" cx="50%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#38240c"/>
      <stop offset="55%" stop-color="#191005"/>
      <stop offset="100%" stop-color="#080502"/>
    </radialGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#faecc0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="840" fill="url(#sunBg)"/>

  <!-- Victorian Outer Frame -->
  <rect x="24" y="24" width="552" height="792" rx="18" fill="none" stroke="url(#goldSun)" stroke-width="3.5"/>
  <rect x="36" y="36" width="528" height="768" rx="12" fill="none" stroke="url(#goldSun)" stroke-width="1.2" stroke-dasharray="8 4"/>

  <!-- The Blazing Sun of the Five Local Sovereign Blades -->
  <g transform="translate(300, 395)">
    <!-- Outer Solar Corona Rings -->
    <circle cx="0" cy="0" r="225" fill="none" stroke="url(#goldSun)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="190" fill="#1e1306" stroke="url(#goldSun)" stroke-width="3.5"/>

    <!-- 5 Sovereign Damascus Blades Radiating in Pentagonal Symmetry -->
    <g stroke="url(#goldSun)" stroke-width="2.5" fill="#2d1c09">
      <polygon points="0,-215 22,-95 0,-70 -22,-95" transform="rotate(0)"/>
      <polygon points="0,-215 22,-95 0,-70 -22,-95" transform="rotate(72)"/>
      <polygon points="0,-215 22,-95 0,-70 -22,-95" transform="rotate(144)"/>
      <polygon points="0,-215 22,-95 0,-70 -22,-95" transform="rotate(216)"/>
      <polygon points="0,-215 22,-95 0,-70 -22,-95" transform="rotate(288)"/>
    </g>

    <!-- 5 Interlocking Clockwork & Audio Waveform Rings -->
    <polygon points="0,-155 147,-48 91,125 -91,125 -147,-48" fill="none" stroke="url(#goldSun)" stroke-width="2"/>
    <polygon points="0,155 147,48 91,-125 -91,-125 -147,48" fill="none" stroke="url(#goldSun)" stroke-width="1.8" stroke-dasharray="5 5"/>

    <!-- Central Sovereign Solar Disc -->
    <circle cx="0" cy="0" r="82" fill="url(#goldSun)" stroke="#fef08a" stroke-width="3"/>
    <circle cx="0" cy="0" r="64" fill="#191005" stroke="url(#goldSun)" stroke-width="2"/>
    <!-- 5-Pointed Star of Zero Cloud Rent -->
    <polygon points="0,-52 14,-16 52,-16 22,8 32,46 0,24 -32,46 -22,8 -52,-16 -14,-16" fill="url(#goldSun)"/>
  </g>

  <!-- Inscribed Hardware Plaque -->
  <rect x="115" y="655" width="370" height="50" rx="8" fill="#140c04" stroke="url(#goldSun)" stroke-width="2"/>
  <text x="300" y="685" text-anchor="middle" fill="#fef08a" font-family="Cinzel, serif" font-size="13" font-weight="700" letter-spacing="2">WHISPER · PIPER · OCR · SYNTH · LAN</text>
</svg>
