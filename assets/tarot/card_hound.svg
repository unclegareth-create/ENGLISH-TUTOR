<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <radialGradient id="mireBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#132a21"/>
      <stop offset="55%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#050807"/>
    </radialGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e5a9"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#9a7b1c"/>
      <stop offset="100%" stop-color="#f3dc90"/>
    </linearGradient>
    <radialGradient id="phosphorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#052e16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="woodcutLines" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="600" height="840" fill="url(#mireBg)"/>
  <rect width="600" height="840" fill="url(#woodcutLines)"/>

  <!-- Ornate Victorian Outer Border -->
  <rect x="24" y="24" width="552" height="792" rx="18" fill="none" stroke="url(#goldLeaf)" stroke-width="3"/>
  <rect x="34" y="34" width="532" height="772" rx="12" fill="none" stroke="url(#goldLeaf)" stroke-width="1.2" stroke-dasharray="6 4"/>

  <!-- Gothic Arch Frame -->
  <path d="M 60 760 L 60 260 Q 60 80 300 55 Q 540 80 540 260 L 540 760 Z" fill="none" stroke="url(#goldLeaf)" stroke-width="2.5"/>
  
  <!-- Blood Moon & Astronomical Halo -->
  <circle cx="300" cy="210" r="88" fill="#1b3b2b" stroke="url(#goldLeaf)" stroke-width="2"/>
  <circle cx="300" cy="210" r="108" fill="none" stroke="url(#goldLeaf)" stroke-width="1" stroke-dasharray="3 6"/>
  <circle cx="322" cy="198" r="70" fill="#0a1410" opacity="0.55"/>

  <!-- Phosphorescent Aura -->
  <circle cx="300" cy="390" r="190" fill="url(#phosphorGlow)"/>

  <!-- Dartmoor Tors & Dead Bog Trees -->
  <path d="M 60 580 L 145 495 L 220 535 L 300 475 L 395 530 L 470 485 L 540 575 L 540 760 L 60 760 Z" fill="#060d0a" stroke="url(#goldLeaf)" stroke-width="1.5"/>
  
  <!-- Spectral Hound Silhouette & Woodcut Engraving -->
  <g transform="translate(300, 415)" stroke="url(#goldLeaf)" stroke-linejoin="round">
    <!-- Outer Spectral Flame Mane -->
    <path d="M -115 95 L -95 10 L -120 -35 L -80 -55 L -90 -115 L -45 -80 L 0 -110 L 45 -80 L 90 -115 L 80 -55 L 120 -35 L 95 10 L 115 95 Z" fill="#0b1713" stroke-width="3"/>
    <!-- Inner Skull/Snout Geometry -->
    <path d="M -65 -45 L 0 -90 L 65 -45 L 52 35 L 0 85 L -52 35 Z" fill="#11221c" stroke-width="2"/>
    <!-- Fangs & Jaws -->
    <path d="M -38 35 L -25 62 L -12 40 L 0 68 L 12 40 L 25 62 L 38 35" fill="none" stroke="#f7e5a9" stroke-width="2.5"/>
    <!-- Glowing Spectral Eyes -->
    <polygon points="-45,-20 -18,-10 -32,-32" fill="#6ee7b7" stroke="#f7e5a9" stroke-width="1.5"/>
    <polygon points="45,-20 18,-10 32,-32" fill="#6ee7b7" stroke="#f7e5a9" stroke-width="1.5"/>
    <!-- Third Eye Alchemical Sigil -->
    <circle cx="0" cy="-48" r="14" fill="none" stroke="#d4af37" stroke-width="1.8"/>
    <polygon points="0,-62 12,-41 -12,-41" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>
  </g>

  <!-- Swirling Grimpen Mire Mist Waves -->
  <g fill="none" stroke="url(#goldLeaf)" stroke-width="1.8" opacity="0.8">
    <path d="M 85 600 Q 190 570 300 600 T 515 600"/>
    <path d="M 75 635 Q 190 605 300 635 T 525 635"/>
    <path d="M 95 670 Q 195 640 300 670 T 505 670"/>
    <path d="M 115 705 Q 205 680 300 705 T 485 705"/>
  </g>

  <!-- Magnifying Glass & Alchemical Key Emblem at Base -->
  <circle cx="300" cy="650" r="36" fill="#09130f" stroke="url(#goldLeaf)" stroke-width="2.5"/>
  <path d="M 285 650 L 315 650 M 300 635 L 300 665" stroke="#6ee7b7" stroke-width="2"/>
</svg>
