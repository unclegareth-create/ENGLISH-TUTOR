<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <radialGradient id="abyssBg" cx="50%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#0f293a"/>
      <stop offset="55%" stop-color="#07131c"/>
      <stop offset="100%" stop-color="#03070b"/>
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e5a9"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#8c6d1f"/>
      <stop offset="100%" stop-color="#f5df98"/>
    </linearGradient>
    <radialGradient id="portholeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="840" fill="url(#abyssBg)"/>

  <!-- Ornate Victorian Outer Border -->
  <rect x="24" y="24" width="552" height="792" rx="18" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="768" rx="12" fill="none" stroke="url(#goldFoil)" stroke-width="1.2" stroke-dasharray="8 4"/>

  <!-- Concentric Bathymetric Depth Rings -->
  <g fill="none" stroke="url(#goldFoil)" opacity="0.35">
    <circle cx="300" cy="410" r="240" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="300" cy="410" r="200" stroke-width="1.5"/>
    <circle cx="300" cy="410" r="160" stroke-width="1" stroke-dasharray="12 6"/>
  </g>

  <!-- Heavy Iron Suspension Chain from Top -->
  <line x1="300" y1="36" x2="300" y2="255" stroke="url(#goldFoil)" stroke-width="8" stroke-dasharray="16 6"/>
  <line x1="300" y1="36" x2="300" y2="255" stroke="#07131c" stroke-width="3" stroke-dasharray="8 14"/>

  <!-- Leviathan Tentacles Rising from the Trench -->
  <g fill="#081824" stroke="url(#goldFoil)" stroke-width="2.2">
    <path d="M 90 780 C 70 640, 175 590, 145 450 C 120 350, 180 290, 210 320 C 185 370, 175 430, 195 510 C 215 590, 155 690, 165 780 Z"/>
    <path d="M 510 780 C 530 640, 425 590, 455 450 C 480 350, 420 290, 390 320 C 415 370, 425 430, 405 510 C 385 590, 445 690, 435 780 Z"/>
    <path d="M 210 780 C 200 660, 260 620, 250 540 C 240 480, 275 460, 280 510 C 285 570, 255 660, 265 780 Z"/>
    <path d="M 390 780 C 400 660, 340 620, 350 540 C 360 480, 325 460, 320 510 C 315 570, 345 660, 335 780 Z"/>
  </g>

  <!-- The Brass Bathysphere Vessel -->
  <circle cx="300" cy="410" r="135" fill="#102534" stroke="url(#goldFoil)" stroke-width="5"/>
  <circle cx="300" cy="410" r="122" fill="none" stroke="url(#goldFoil)" stroke-width="2" stroke-dasharray="2 14"/>

  <!-- Side Portholes -->
  <circle cx="195" cy="395" r="24" fill="#07131c" stroke="url(#goldFoil)" stroke-width="3"/>
  <circle cx="405" cy="395" r="24" fill="#07131c" stroke="url(#goldFoil)" stroke-width="3"/>

  <!-- Central Quartz Observation Viewport -->
  <circle cx="300" cy="410" r="78" fill="url(#portholeGlow)" stroke="url(#goldFoil)" stroke-width="6"/>
  <circle cx="300" cy="410" r="66" fill="none" stroke="#07131c" stroke-width="2" stroke-dasharray="4 10"/>

  <!-- Searchlight Beams Piercing the Abyss -->
  <polygon points="300,410 140,760 460,760" fill="url(#portholeGlow)" opacity="0.28"/>

  <!-- Compass Rose & Alchemical Depth Needle Inside Viewport -->
  <polygon points="300,345 314,396 365,410 314,424 300,475 286,424 235,410 286,396" fill="none" stroke="#07131c" stroke-width="2"/>
  <circle cx="300" cy="410" r="10" fill="#d4af37"/>
</svg>
