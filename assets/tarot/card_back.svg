<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <radialGradient id="backBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#10241b"/>
      <stop offset="60%" stop-color="#08120e"/>
      <stop offset="100%" stop-color="#040806"/>
    </radialGradient>
    <linearGradient id="goldBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc0"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#8c6d1f"/>
      <stop offset="100%" stop-color="#f7e5a9"/>
    </linearGradient>
    <pattern id="esotericLattice" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#d4af37" stroke-width="0.7" stroke-opacity="0.22"/>
      <circle cx="20" cy="20" r="3" fill="none" stroke="#d4af37" stroke-width="0.6" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="600" height="840" fill="url(#backBg)"/>
  <rect x="36" y="36" width="528" height="768" fill="url(#esotericLattice)"/>

  <!-- Symmetrical Reversible Filigree Borders -->
  <rect x="20" y="20" width="560" height="800" rx="22" fill="none" stroke="url(#goldBack)" stroke-width="4"/>
  <rect x="32" y="32" width="536" height="776" rx="16" fill="none" stroke="url(#goldBack)" stroke-width="1.5"/>
  <rect x="44" y="44" width="512" height="752" rx="10" fill="none" stroke="url(#goldBack)" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Top & Bottom Reversible Twin Owls / Compasses -->
  <g transform="translate(300, 420)" stroke="url(#goldBack)" fill="none">
    <circle cx="0" cy="0" r="210" stroke-width="2" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="185" stroke-width="3"/>
    <polygon points="0,-185 160,92 -160,92" stroke-width="1.8"/>
    <polygon points="0,185 160,-92 -160,-92" stroke-width="1.8"/>
    <polygon points="0,-185 185,0 0,185 -185,0" stroke-width="2"/>
    <circle cx="0" cy="0" r="92" fill="#091510" stroke-width="3"/>
    <!-- 16-Pointed Starburst -->
    <polygon points="0,-82 18,-25 75,-42 32,8 82,35 24,32 42,82 0,38 -42,82 -24,32 -82,35 -32,8 -75,-42 -18,-25" fill="url(#goldBack)" opacity="0.88"/>
    <circle cx="0" cy="0" r="22" fill="#091510" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="url(#goldBack)"/>
  </g>
</svg>
