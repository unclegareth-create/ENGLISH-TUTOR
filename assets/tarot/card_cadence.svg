<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="100%" height="100%">
  <defs>
    <radialGradient id="wheelBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#231934"/>
      <stop offset="55%" stop-color="#110b1c"/>
      <stop offset="100%" stop-color="#06040a"/>
    </radialGradient>
    <linearGradient id="goldWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc0"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#967419"/>
      <stop offset="100%" stop-color="#f7e5a9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="840" fill="url(#wheelBg)"/>

  <!-- Victorian Outer Frame -->
  <rect x="24" y="24" width="552" height="792" rx="18" fill="none" stroke="url(#goldWheel)" stroke-width="3"/>
  <rect x="36" y="36" width="528" height="768" rx="12" fill="none" stroke="url(#goldWheel)" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Corner Celestial Sun/Moon Spandrels -->
  <circle cx="85" cy="95" r="28" fill="none" stroke="url(#goldWheel)" stroke-width="1.8"/>
  <circle cx="515" cy="95" r="28" fill="none" stroke="url(#goldWheel)" stroke-width="1.8"/>
  <circle cx="85" cy="745" r="28" fill="none" stroke="url(#goldWheel)" stroke-width="1.8"/>
  <circle cx="515" cy="745" r="28" fill="none" stroke="url(#goldWheel)" stroke-width="1.8"/>

  <!-- The Great Wheel of Syntactic Cadence -->
  <g transform="translate(300, 420)">
    <!-- Outer Zodiac Ring -->
    <circle cx="0" cy="0" r="220" fill="#0d0816" stroke="url(#goldWheel)" stroke-width="4"/>
    <circle cx="0" cy="0" r="195" fill="none" stroke="url(#goldWheel)" stroke-width="2" stroke-dasharray="10 5"/>
    <circle cx="0" cy="0" r="155" fill="#171026" stroke="url(#goldWheel)" stroke-width="3"/>
    <circle cx="0" cy="0" r="95" fill="#0d0816" stroke="url(#goldWheel)" stroke-width="2.5"/>

    <!-- 8 Fountain-Nib Spokes -->
    <g stroke="url(#goldWheel)" stroke-width="2.5">
      <line x1="0" y1="-220" x2="0" y2="220"/>
      <line x1="-220" y1="0" x2="220" y2="0"/>
      <line x1="-155" y1="-155" x2="155" y2="155"/>
      <line x1="155" y1="-155" x2="-155" y2="155"/>
    </g>

    <!-- Sacred Hexagram of Rhetoric -->
    <polygon points="0,-150 130,75 -130,75" fill="none" stroke="url(#goldWheel)" stroke-width="2.2"/>
    <polygon points="0,150 130,-75 -130,-75" fill="none" stroke="url(#goldWheel)" stroke-width="2.2"/>

    <!-- Central Hub & Nib -->
    <circle cx="0" cy="0" r="42" fill="#231934" stroke="url(#goldWheel)" stroke-width="3.5"/>
    <polygon points="0,-30 18,8 0,28 -18,8" fill="url(#goldWheel)"/>
    <circle cx="0" cy="0" r="5" fill="#0d0816"/>
  </g>
</svg>
