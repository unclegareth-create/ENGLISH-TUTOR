<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronicle '88 | Interactive B1–B2 Visual Novel — Gareth's English Lab</title>
  <meta name="description" content="Play Chronicle '88: three streamlined retro visual novel adventures where B1–B2 English grammar clues solve the mystery." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-page: #0b0f19;
      --bg-card: #111827;
      --bg-elevated: #1e293b;
      --bg-subtle: rgba(30, 41, 59, 0.55);
      --border-soft: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(245, 158, 11, 0.45);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --sky: #38bdf8;
      --sky-soft: rgba(56, 189, 248, 0.12);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.14);
      --red: #f43f5e;
      --red-soft: rgba(244, 63, 94, 0.14);
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-pixel: 'Press Start 2P', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.07), transparent 55%);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.6;
      padding-bottom: 3rem;
    }

    /* ==========================================================================
       1. COMPACT TOP NAVIGATION & EPISODE BAR
       ========================================================================== */
    .top-bar {
      max-width: 780px;
      margin: 0 auto;
      padding: 1rem 1.25rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-soft);
      transition: all 0.15s ease;
    }

    .back-link:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .brand-title {
      font-family: var(--font-pixel);
      font-size: 0.75rem;
      color: var(--amber);
      letter-spacing: 0.04em;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .icon-btn.active {
      color: var(--amber);
      border-color: rgba(245, 158, 11, 0.4);
      background: var(--amber-soft);
    }

    /* Episode Switcher Pills */
    .episode-nav {
      max-width: 780px;
      margin: 0 auto 1rem;
      padding: 0 1.25rem;
    }

    .episode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      background: var(--bg-card);
      padding: 0.35rem;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
    }

    .episode-tab {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-tab:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .episode-tab.active {
      background: var(--bg-elevated);
      color: var(--amber);
      border-color: rgba(245, 158, 11, 0.3);
      font-weight: 700;
    }

    /* ==========================================================================
       2. SINGLE UNIFIED STORY CARD
       ========================================================================== */
    .story-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    .story-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    /* Scene Progress Header */
    .scene-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.35rem;
      border-bottom: 1px solid var(--border-soft);
      background: rgba(15, 23, 42, 0.6);
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .scene-progress {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .scene-step-text {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-dots {
      display: flex;
      gap: 0.35rem;
    }

    .progress-dot {
      width: 20px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.2s;
    }

    .progress-dot.done {
      background: var(--green);
    }

    .progress-dot.current {
      background: var(--amber);
    }

    .grammar-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--sky);
      background: var(--sky-soft);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }

    /* Pixel Canvas Stage */
    .canvas-stage {
      position: relative;
      width: 100%;
      height: 230px;
      background: #070913;
      border-bottom: 1px solid var(--border-soft);
      overflow: hidden;
    }

    #pixel-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      object-fit: cover;
    }

    .location-pill {
      position: absolute;
      bottom: 0.75rem;
      left: 1rem;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    /* Story Body */
    .story-body {
      padding: 1.5rem 1.5rem 1.75rem;
    }

    .speaker-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .speaker-role {
      color: var(--text-muted);
      font-weight: 500;
      text-transform: none;
    }

    .narrative-text {
      font-size: 1.04rem;
      line-height: 1.65;
      color: var(--text-main);
      margin-bottom: 1.25rem;
    }

    .narrative-text strong {
      color: #fff;
      font-weight: 700;
    }

    /* Compact 2-Column Clue Strip */
    .clue-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.65rem;
      margin-bottom: 1.35rem;
    }

    .clue-item {
      background: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      border-left: 3px solid var(--sky);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
    }

    .clue-item.key-clue {
      border-left-color: var(--amber);
      background: rgba(245, 158, 11, 0.06);
    }

    .clue-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--sky);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .clue-item.key-clue .clue-label {
      color: var(--amber);
    }

    .clue-text {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Question Prompt + Hint Toggle */
    .question-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }

    .question-prompt {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
      flex: 1;
      min-width: 240px;
    }

    .hint-toggle-btn {
      background: transparent;
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--sky);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .hint-toggle-btn:hover {
      background: var(--sky-soft);
    }

    .hint-drawer {
      display: none;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .hint-drawer.open {
      display: block;
    }

    .hint-drawer strong {
      color: var(--sky);
    }

    /* Clean Choice Buttons */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-elevated);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      line-height: 1.5;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      transition: all 0.15s ease;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--border-hover);
      background: rgba(30, 41, 59, 0.95);
      transform: translateY(-1px);
    }

    .choice-btn:disabled {
      cursor: default;
      opacity: 0.75;
    }

    .choice-letter {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    .grammar-highlight {
      color: var(--amber);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .choice-btn.correct {
      background: var(--green-soft);
      border-color: var(--green);
      opacity: 1;
    }

    .choice-btn.correct .choice-letter {
      background: var(--green);
      color: #06281e;
    }

    .choice-btn.wrong {
      background: var(--red-soft);
      border-color: var(--red);
      opacity: 1;
    }

    .choice-btn.wrong .choice-letter {
      background: var(--red);
      color: #fff;
    }

    /* Inline Feedback & Contextual Dice Banner */
    .feedback-box {
      display: none;
      margin-top: 1.15rem;
      padding: 1.1rem 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background: rgba(15, 23, 42, 0.85);
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.win {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.08);
    }

    .feedback-box.lose {
      border-color: rgba(244, 63, 94, 0.45);
      background: rgba(244, 63, 94, 0.08);
    }

    .feedback-title {
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .feedback-box.win .feedback-title {
      color: var(--green);
    }

    .feedback-box.lose .feedback-title {
      color: var(--red);
    }

    .feedback-explanation {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 1rem;
    }

    /* Contextual Inline 2d6 Dice Bar */
    .inline-dice-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      border-radius: 10px;
      background: rgba(11, 15, 25, 0.75);
      border: 1px solid rgba(245, 158, 11, 0.3);
      flex-wrap: wrap;
    }

    .inline-dice-bar.show {
      display: flex;
    }

    .dice-pair {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .die-face {
      width: 42px;
      height: 42px;
      background: #f8fafc;
      border-radius: 8px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .die-face.rolling {
      animation: rollShake 0.25s infinite;
    }

    @keyframes rollShake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-10deg) scale(1.05); }
      75% { transform: rotate(10deg) scale(1.05); }
    }

    .pip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
      place-self: center;
    }

    .pip-dot.on {
      background: #0f172a;
    }

    .dice-status-text {
      font-size: 0.86rem;
      color: var(--text-secondary);
      flex: 1;
      min-width: 180px;
    }

    .feedback-actions {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 0.6rem 1.15rem;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.15s ease;
    }

    .action-btn.primary {
      background: var(--amber);
      color: #0b0f19;
    }

    .action-btn.primary:hover {
      background: #fbbf24;
    }

    .action-btn.secondary {
      background: var(--bg-elevated);
      color: var(--text-main);
      border-color: var(--border-soft);
    }

    .action-btn.secondary:hover {
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* ==========================================================================
       3. TAP-TO-BUILD REWIND PARRY MODAL
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 18, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .parry-card {
      max-width: 540px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.65);
    }

    .parry-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--amber);
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .parry-subtitle {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .parry-prompt-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }

    .parry-keyword {
      display: inline-block;
      margin-top: 0.45rem;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      background: var(--amber-soft);
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .parry-slot-zone {
      min-height: 50px;
      padding: 0.6rem;
      border-radius: 10px;
      border: 1px dashed rgba(245, 158, 11, 0.45);
      background: rgba(11, 15, 25, 0.6);
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      margin: 0.55rem 0 1rem;
    }

    .parry-bank-zone {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .word-tile {
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .word-tile:hover {
      background: var(--amber);
      color: #0b0f19;
    }

    .word-tile.used {
      opacity: 0.25;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .episode-tabs {
        grid-template-columns: 1fr;
      }
      .canvas-stage {
        height: 195px;
      }
      .story-body {
        padding: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <!-- 1. COMPACT TOP BAR -->
  <header class="top-bar">
    <div class="brand-group">
      <a href="lab.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Interactive Lab
      </a>
      <span class="brand-title">CHRONICLE '88</span>
    </div>

    <div class="hud-controls">
      <span class="stat-pill" title="Stamina">
        <i class="fa-solid fa-heart" style="color:var(--red);"></i>
        <span id="ui-stat-stamina">20</span>
      </span>
      <span class="stat-pill" title="Rewind Tokens">
        <i class="fa-solid fa-rotate-left" style="color:var(--amber);"></i>
        <span id="ui-stat-tokens">3</span>
      </span>
      <button type="button" class="icon-btn" id="bgm-btn" onclick="Chronicle88.toggleBGM()">
        <i class="fa-solid fa-music"></i>
        <span id="bgm-label">Music</span>
      </button>
      <button type="button" class="icon-btn active" id="sfx-btn" onclick="Chronicle88.toggleSFX()">
        <i class="fa-solid fa-volume-high" id="sfx-icon"></i>
        <span id="sfx-label">SFX</span>
      </button>
    </div>
  </header>

  <!-- 2. EPISODE SWITCHER -->
  <nav class="episode-nav" aria-label="Choose Episode">
    <div class="episode-tabs">
      <button type="button" class="episode-tab active" id="tape-tab-1" onclick="Chronicle88.loadTape(1)">
        1. Neon Alibi (Narrative Tenses)
      </button>
      <button type="button" class="episode-tab" id="tape-tab-2" onclick="Chronicle88.loadTape(2)">
        2. Citadel of Echoes (Modals &amp; Conditionals)
      </button>
      <button type="button" class="episode-tab" id="tape-tab-3" onclick="Chronicle88.loadTape(3)">
        3. Station Zero (Passive &amp; Causative)
      </button>
    </div>
  </nav>

  <!-- 3. SINGLE UNIFIED STORY CARD -->
  <main class="story-container">
    <article class="story-card">

      <!-- Scene Progress Strip -->
      <div class="scene-header">
        <div class="scene-progress">
          <span class="scene-step-text" id="ui-scene-label">SCENE 1 OF 4</span>
          <div class="progress-dots" id="ui-progress-pips"></div>
        </div>
        <span class="grammar-badge" id="ui-grammar-tag">Past Perfect vs. Past Simple</span>
      </div>

      <!-- Animated Pixel Art Stage -->
      <div class="canvas-stage">
        <canvas id="pixel-canvas" width="384" height="204" aria-label="16-bit scene illustration"></canvas>
        <span class="location-pill" id="ui-location-tag">Sector 1 • CyberCorp Vault</span>
      </div>

      <!-- Story, Clues & Choices -->
      <div class="story-body">
        <div class="speaker-line">

        if (!audioCtx || freq <= 0) return;

        const gain = audioCtx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0008, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

        if (!sfxOn) return;
        ensureAudio();
        if (!audioCtx) return;

        if (bgmTimer) {

                  explanation: "Bays and seals don't repair themselves! Use the <strong>Passive Voice</strong> (<em>is being repaired / have been replaced</em>)."
                }
              ]
            },
            {
              num: 2,
              location: "Deck B • Hull Breach Control",
              grammarTag: "Causative (Have Something Done)",
              speaker: "ENGINEERING CONSOLE",
              role: "• 2d6 Shockwave Check",
              icon: "fa-robot",
              sceneType: "scifi_core",
              requiresDiceCheck: true,
              timeline: [
                { time: "Hazard Alert", desc: "Radiation outside is too high for a human crew member." },
                { time: "Command Needed", desc: "Order the system to have Drone-9 weld the hull breach.", highlight: true }
              ],
              story: "A meteoroid cracks the outer hull! You cannot go outside yourself—you must arrange for **Drone-9** to weld the breach for you.",
              mission: "Pick the command with the correct B2 Causative word order:",
              grammarTip: "Put the object <strong>between</strong> <em>have</em> and the <em>past participle</em>: <strong>have + [the hull breach] + [welded]</strong>.",
              choices: [
                {
                  letter: "A",
                  html: "\"MOTHER-88, we must <span class='grammar-highlight'>have the hull breach welded</span> by Drone-9 immediately!\"",
                  correct: true,
                  title: "Drone-9 seals the outer hull!",
                  explanation: "Perfect causative syntax: <strong>have + object (the hull breach) + past participle (welded)</strong>."
                },
                {
                  letter: "B",
                  html: "\"MOTHER-88, we must <span class='grammar-highlight'>have welded the hull breach</span> by Drone-9 immediately!\"",
                  correct: false,
                  title: "Command rejected!",
                  explanation: "Use <em>have + object + V3</em> (<strong>have the hull breach welded</strong>) when arranging for someone or something else to do the job."
                }
              ]
            },
            {
              num: 3,
              location: "Deck C • Escape Pod Dock",
              grammarTag: "Future Perfect vs. Continuous",
              speaker: "ESCAPE POD TELEMETRY",
              role: "• Final Launch Window (06:00)",
              icon: "fa-shuttle-space",
              sceneType: "scifi_dock",
              timeline: [
                { time: "05:50 (Before 06:00)", desc: "Life-support finishes booting up completely.", highlight: true },
                { time: "05:55 to 06:15", desc: "The solar storm is still passing outside at 06:00." }
              ],
              story: "You strap into the Escape Pod! The Rescue Cruiser arrives at **06:00**. Lock in the telemetry report for **06:00**:",
              mission: "Use Future Perfect for what finishes BEFORE 06:00, and Future Continuous for what is in progress AT 06:00:",
              grammarTip: "Finished by 06:00 = <strong>will have booted</strong> (Future Perfect). In progress at 06:00 = <strong>will still be passing</strong> (Future Continuous).",
              choices: [
                {
                  letter: "A",
                  html: "\"By 06:00, life-support <span class='grammar-highlight'>will have booted</span> up, and the solar storm <span class='grammar-highlight'>will still be passing</span>.\"",
                  correct: true,
                  title: "Escape Pod launched! Mission complete!",
                  explanation: "Textbook B2 Future forms! <strong>will have booted</strong> (completed before 06:00) + <strong>will still be passing</strong> (in progress at 06:00)."
                },
                {
                  letter: "B",
                  html: "\"By 06:00, life-support <span class='grammar-highlight'>will be booting</span> up, and the solar storm <span class='grammar-highlight'>will have passed</span>.\"",
                  correct: false,
                  title: "Telemetry mismatch!",
                  explanation: "Life-support finishes at 05:50 (so by 06:00 it <strong>will have booted</strong>), and the storm lasts until 06:15 (so at 06:00 it <strong>will still be passing</strong>)."
                }
              ]
            }
          ]
        }
      };

      /* ==============================================================
         3. 16-BIT PIXEL ART SCENE RENDERER
         ============================================================== */
      const canvas = document.getElementById('pixel-canvas');
      const ctx = canvas ? canvas.getContext('2d') : null;
      let animTick = 0;
      let currentSceneType = 'cyber_vault';

      function drawDitherSky(yStart, yEnd, c1, c2) {
        ctx.fillStyle = c1;
        ctx.fillRect(0, yStart, 384, yEnd - yStart);
        ctx.fillStyle = c2;
        for (let y = yStart; y < yEnd; y += 2) {
          for (let x = (y % 4 === 0 ? 0 : 2); x < 384; x += 4) {
            ctx.fillRect(x, y, 2, 2);
          }
        }
      }

      function drawPixelSpriteCharacter(x, y, coatColor, visorColor, talking) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x - 4, y + 50, 36, 6);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(x + 4, y + 34, 8, 18);
        ctx.fillRect(x + 16, y + 34, 8, 18);
        ctx.fillStyle = coatColor;
        ctx.fillRect(x, y + 14, 28, 24);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x + 11, y + 14, 6, 22);
        ctx.fillStyle = coatColor;
        ctx.fillRect(x - 2, y + 10, 32, 6);
        ctx.fillStyle = '#fcd34d';
        ctx.fillRect(x + 5, y - 4, 18, 15);
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(x + 3, y - 8, 22, 6);
        ctx.fillStyle = visorColor;
        ctx.fillRect(x + 8, y, 13, 4);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x + 11, y + 7, 6, talking ? 3 : 1);
      }

      function drawSceneCanvas() {
        if (!ctx) return;
        animTick++;
        const talking = (animTick % 14 < 7);

        if (currentSceneType.startsWith('cyber')) {
          drawDitherSky(0, 75, '#070916', '#131836');
          drawDitherSky(75, 140, '#131836', '#1e1b4b');

          const buildings = [
            { x: 8, y: 22, w: 58, h: 120 },
            { x: 72, y: 10, w: 70, h: 132 },
            { x: 150, y: 28, w: 62, h: 114 },
            { x: 220, y: 14, w: 78, h: 128 },
            { x: 306, y: 24, w: 68, h: 118 }
          ];
          buildings.forEach((b, idx) => {
            ctx.fillStyle = (idx % 2 === 0) ? '#0b1024' : '#101733';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#1e293b';
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            for (let wy = b.y + 8; wy < b.y + b.h - 14; wy += 9) {
              for (let wx = b.x + 6; wx < b.x + b.w - 10; wx += 8) {
                if ((wx + wy + idx) % 4 === 0) {
                  ctx.fillStyle = ((wx * wy) % 5 === 0) ? '#f59e0b' : '#38bdf8';
                  ctx.fillRect(wx, wy, 4, 4);
                }
              }
            }
          });

          ctx.fillStyle = '#0f172a';
          ctx.fillRect(145, 42, 94, 34);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.strokeRect(145, 42, 94, 34);
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 10px monospace';
          ctx.fillText('ALARM 23:15', 155, 57);
          ctx.fillStyle = '#38bdf8';
          ctx.fillText('LOG: 23:05', 158, 69);

          drawDitherSky(140, 204, '#080b18', '#0f172a');
          drawPixelSpriteCharacter(82, 112, '#0284c7', '#38bdf8', talking);
          drawPixelSpriteCharacter(268, 112, '#6366f1', '#f59e0b', !talking);

          ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
          for (let i = 0; i < 26; i++) {
            const rx = (i * 41 + animTick * 3) % 384;
            const ry = (i * 29 + animTick * 7) % 200;
            ctx.fillRect(rx, ry, 1, 7);
          }
        } else if (currentSceneType.startsWith('dungeon')) {
          drawDitherSky(0, 145, '#110e1b', '#1c162b');
          drawDitherSky(145, 204, '#0c0a14', '#151122');

          ctx.fillStyle = '#07050a';
          ctx.fillRect(122, 36, 140, 110);
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 2;
          ctx.strokeRect(122, 36, 140, 110);

          ['1', '2', '3'].forEach((lbl, i) => {
            const lx = 152 + i * 38;
            ctx.fillStyle = (i === 1) ? '#38bdf8' : '#64748b';
            ctx.fillRect(lx, 76, 8, 42);
            ctx.fillStyle = (i === 1) ? '#f59e0b' : '#94a3b8';
            ctx.fillRect(lx - 4, 70, 16, 10);
            ctx.font = 'bold 10px monospace';
            ctx.fillText('#' + lbl, lx - 3, 64);
          });

          const flame = (animTick % 8 < 4) ? 13 : 10;
          [75, 305].forEach(tx => {
            ctx.fillStyle = '#78350f';
            ctx.fillRect(tx, 76, 8, 22);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(tx - 3, 76 - flame, 14, flame);
            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(tx, 78 - flame, 8, 6);
          });

          drawPixelSpriteCharacter(68, 114, '#d97706', '#38bdf8', talking);
          drawPixelSpriteCharacter(292, 114, '#475569', '#f43f5e', !talking);
        } else {
          drawDitherSky(0, 140, '#060c1a', '#0f1e38');
          drawDitherSky(140, 204, '#111827', '#1e293b');

          ctx.fillStyle = '#02040a';
          ctx.fillRect(82, 22, 220, 82);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.strokeRect(82, 22, 220, 82);
          for (let s = 0; s < 22; s++) {
            ctx.fillStyle = (s % 3 === 0) ? '#38bdf8' : '#fff';
            ctx.fillRect(90 + ((s * 31) % 200), 28 + ((s * 19) % 55), 2, 2);
          }
          drawDitherSky(84, 102, '#0284c7', '#0369a1');

          ctx.fillStyle = (animTick % 14 < 7) ? '#f59e0b' : '#38bdf8';
          ctx.fillRect(180, 112, 24, 24);
          ctx.strokeStyle = '#38bdf8';
          ctx.strokeRect(175, 107, 34, 34);

          drawPixelSpriteCharacter(80, 114, '#0ea5e9', '#10b981', talking);
          drawPixelSpriteCharacter(284, 114, '#6366f1', '#f59e0b', !talking);
        }
      }

      setInterval(drawSceneCanvas, 100);

      /* ==============================================================
         4. 6-SIDED DICE PIP RENDERER
         ============================================================== */
      const DIE_PIPS = {
        1: [4],
        2: [0, 8],
        3: [0, 4, 8],
        4: [0, 2, 6, 8],
        5: [0, 2, 4, 6, 8],
        6: [0, 2, 3, 5, 6, 8]
      };

      function renderDieFace(elId, value) {
        const el = document.getElementById(elId);
        if (!el) return;
        const active = DIE_PIPS[value] || DIE_PIPS[1];
        let html = '';
        for (let i = 0; i < 9; i++) {
          html += `<span class="pip-dot ${active.includes(i) ? 'on' : ''}"></span>`;
        }
        el.innerHTML = html;
      }

      /* ==============================================================
         5. CORE GAMEPLAY STATE & CLEAN UI CONTROLLER
         ============================================================== */
      let state = {
        tapeId: 1,
        sceneIdx: 0,
        stamina: 20,
        composure: 9,
        tokens: 3,
        parryIdx: 0,
        selectedTiles: []
      };

      function updateHUD() {
        document.getElementById('ui-stat-stamina').textContent = state.stamina;
        document.getElementById('ui-stat-tokens').textContent = state.tokens;
      }

      function formatText(rawText) {
        return rawText
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/\n/g, '<br>');
      }

      function renderCurrentScene() {
        const tape = TAPES[state.tapeId];
        const scene = tape.scenes[state.sceneIdx];

        [1, 2, 3].forEach(id => {
          const tab = document.getElementById('tape-tab-' + id);
          if (tab) tab.classList.toggle('active', id === state.tapeId);
        });

        // Reset feedback, dice bar, and hint drawer
        const resBanner = document.getElementById('ui-result-banner');
        resBanner.className = 'feedback-box';
        document.getElementById('ui-dice-bar').classList.remove('show');

        const drawer = document.getElementById('ui-grammar-drawer');
        drawer.classList.remove('open');
        document.getElementById('tip-btn-label').textContent = 'Grammar Hint';

        // Progress dots
        let pipsHtml = '';
        tape.scenes.forEach((_, idx) => {
          const cls = idx < state.sceneIdx ? 'done' : (idx === state.sceneIdx ? 'current' : '');
          pipsHtml += `<span class="progress-dot ${cls}"></span>`;
        });
        document.getElementById('ui-progress-pips').innerHTML = pipsHtml;

        if (!scene) {
          renderTapeVictory(tape);
          return;
        }

        currentSceneType = scene.sceneType;
        drawSceneCanvas();

        document.getElementById('ui-scene-label').textContent = `SCENE ${scene.num} OF ${tape.scenes.length}`;
        document.getElementById('ui-location-tag').textContent = scene.location;
        document.getElementById('ui-grammar-tag').textContent = scene.grammarTag;

        // Speaker & Narrative
        document.getElementById('ui-speaker-name').textContent = scene.speaker;
        document.getElementById('ui-speaker-role').textContent = scene.role;
        document.getElementById('ui-speaker-icon').className = `fa-solid ${scene.icon}`;
        document.getElementById('ui-story-text').innerHTML = formatText(scene.story);

        // Compact 2-Pill Clue Strip
        document.getElementById('ui-timeline-nodes').innerHTML = scene.timeline.map(node => `
          <div class="clue-item ${node.highlight ? 'key-clue' : ''}">
            <span class="clue-label">${node.time}</span>
            <div class="clue-text">${node.desc}</div>
          </div>
        `).join('');

        document.getElementById('ui-mission-prompt').textContent = scene.mission;
        drawer.innerHTML = scene.grammarTip;

        // Choices
        const choicesList = document.getElementById('ui-choices-list');
        choicesList.innerHTML = '';
        scene.choices.forEach((ch, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'choice-btn';
          btn.innerHTML = `
            <span class="choice-letter">${ch.letter}</span>
            <span>${ch.html}</span>
          `;
          btn.addEventListener('click', () => selectChoice(idx, btn));
          choicesList.appendChild(btn);
        });

        updateHUD();
      }

      function toggleGrammarTip() {
        const drawer = document.getElementById('ui-grammar-drawer');
        const label = document.getElementById('tip-btn-label');
        const isOpen = drawer.classList.toggle('open');
        label.textContent = isOpen ? 'Hide Hint' : 'Grammar Hint';
        playSFX('blip');
      }

      function selectChoice(choiceIdx, clickedBtn) {
        const tape = TAPES[state.tapeId];
        const scene = tape.scenes[state.sceneIdx];
        const choice = scene.choices[choiceIdx];

        document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });

        const resBanner = document.getElementById('ui-result-banner');
        const resHeader = document.getElementById('ui-result-header');
        const resExp = document.getElementById('ui-result-explanation');
        const resAct = document.getElementById('ui-result-actions');
        const diceBar = document.getElementById('ui-dice-bar');

        if (choice.correct) {
          clickedBtn.classList.add('correct');
          playSFX('correct');
          state.composure = Math.min(12, state.composure + 1);

          resBanner.className = 'feedback-box show win';
          resHeader.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${choice.title}</span>`;
          resExp.innerHTML = choice.explanation;

          if (scene.requiresDiceCheck) {
            diceBar.classList.add('show');
            document.getElementById('ui-dice-message').innerHTML =
              `Hazard Check: Roll <strong>2d6 &le; ${state.composure}</strong> to dodge cleanly!`;
            resAct.innerHTML = `
              <button type="button" class="action-btn primary" onclick="Chronicle88.rollHazardCheck()">
                <i class="fa-solid fa-dice"></i> Roll 2d6 Hazard Check
              </button>
            `;
          } else {
            diceBar.classList.remove('show');
            resAct.innerHTML = `
              <button type="button" class="action-btn primary" onclick="Chronicle88.advanceScene()">
                Continue <i class="fa-solid fa-arrow-right"></i>
              </button>
            `;
          }
        } else {
          clickedBtn.classList.add('wrong');
          playSFX('wrong');
          state.stamina = Math.max(0, state.stamina - 3);

          resBanner.className = 'feedback-box show lose';
          resHeader.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <span>${choice.title} (-3 Stamina)</span>`;
          resExp.innerHTML = choice.explanation;
          diceBar.classList.remove('show');

          let btns = `
            <button type="button" class="action-btn secondary" onclick="Chronicle88.retryScene()">
              <i class="fa-solid fa-rotate-right"></i> Try Again
            </button>
          `;
          if (state.tokens > 0) {
            btns += `
              <button type="button" class="action-btn primary" onclick="Chronicle88.openParryModal()">
                <i class="fa-solid fa-rotate-left"></i> Rewind &amp; Heal (+3 ❤️)
              </button>
            `;
          }
          resAct.innerHTML = btns;
        }

        updateHUD();
      }

      function animate2d6(onComplete) {
        const d1 = document.getElementById('die-box-1');
        const d2 = document.getElementById('die-box-2');
        d1.classList.add('rolling');
        d2.classList.add('rolling');

        let count = 0;
        const timer = setInterval(() => {
          count++;
          renderDieFace('die-box-1', Math.floor(Math.random() * 6) + 1);
          renderDieFace('die-box-2', Math.floor(Math.random() * 6) + 1);
          playSFX('dice');
          if (count >= 7) {
            clearInterval(timer);
            d1.classList.remove('rolling');
            d2.classList.remove('rolling');
            const v1 = Math.floor(Math.random() * 6) + 1;
            const v2 = Math.floor(Math.random() * 6) + 1;
            renderDieFace('die-box-1', v1);
            renderDieFace('die-box-2', v2);
            onComplete(v1 + v2);
          }
        }, 55);
      }

      function rollHazardCheck() {
        const msg = document.getElementById('ui-dice-message');
        const resAct = document.getElementById('ui-result-actions');
        animate2d6((total) => {
          if (total <= state.composure) {
            playSFX('correct');
            msg.innerHTML = `<span style="color:var(--green);font-weight:700;">Rolled ${total} (&le; ${state.composure}) — Dodged cleanly!</span>`;
          } else {
            playSFX('wrong');
            state.stamina = Math.max(0, state.stamina - 2);
            updateHUD();
            msg.innerHTML = `<span style="color:var(--amber);font-weight:700;">Rolled ${total} (&gt; ${state.composure}) — Grazed by hazard (-2 Stamina).</span>`;
          }
          resAct.innerHTML = `
            <button type="button" class="action-btn primary" onclick="Chronicle88.advanceScene()">
              Continue <i class="fa-solid fa-arrow-right"></i>
            </button>
          `;
        });
      }

      /* ==============================================================
         6. TAP-TO-BUILD REWIND PARRY MODAL
         ============================================================== */
      function openParryModal() {
        if (state.tokens <= 0) return;
        const tape = TAPES[state.tapeId];
        const parry = tape.parries[state.parryIdx % tape.parries.length];
        state.selectedTiles = [];

        document.getElementById('parry-original').textContent = parry.original;
        document.getElementById('parry-key').textContent = 'KEY WORD: ' + parry.keyword;
        document.getElementById('parry-before').textContent = parry.before;
        document.getElementById('parry-after').textContent = parry.after;
        document.getElementById('parry-status-msg').innerHTML = '';

        const allWords = [...parry.answer, ...parry.distractors].sort(() => Math.random() - 0.5);
        state.currentParryWords = allWords;
        state.currentParryTarget = parry.answer;

        renderParryTilesUI();
        document.getElementById('parry-modal').classList.add('open');
      }

      function renderParryTilesUI() {
        const slotZone = document.getElementById('parry-slot-zone');
        const bankZone = document.getElementById('parry-bank-zone');

        if (state.selectedTiles.length === 0) {
          slotZone.innerHTML = `<span style="font-size:0.8rem;color:var(--text-muted);">Tap word tiles below to build the missing phrase...</span>`;
        } else {
          slotZone.innerHTML = state.selectedTiles.map((item, sIdx) => `
            <button type="button" class="word-tile" onclick="Chronicle88.removeParryTile(${sIdx})">${item.word}</button>
          `).join('');
        }

        bankZone.innerHTML = state.currentParryWords.map((word, bIdx) => {
          const isUsed = state.selectedTiles.some(t => t.bankIdx === bIdx);
          return `<button type="button" class="word-tile ${isUsed ? 'used' : ''}" onclick="Chronicle88.addParryTile(${bIdx})">${word}</button>`;
        }).join('');
      }

      function addParryTile(bankIdx) {
        playSFX('blip');
        state.selectedTiles.push({ bankIdx, word: state.currentParryWords[bankIdx] });
        renderParryTilesUI();
      }

      function removeParryTile(slotIdx) {
        playSFX('blip');
        state.selectedTiles.splice(slotIdx, 1);
        renderParryTilesUI();
      }

      function clearParryTiles() {
        state.selectedTiles = [];
        renderParryTilesUI();
      }

      function checkParryTiles() {
        const built = state.selectedTiles.map(t => t.word).join(' ').toLowerCase();
        const target = state.currentParryTarget.join(' ').toLowerCase();
        const statusEl = document.getElementById('parry-status-msg');

        if (built === target) {
          playSFX('correct');
          state.tokens = Math.max(0, state.tokens - 1);
          state.stamina = Math.min(20, state.stamina + 3);
          state.parryIdx++;
          updateHUD();
          statusEl.innerHTML = `<span style="color:var(--green);">Correct! +3 Stamina restored.</span>`;
          setTimeout(() => {
            closeParryModal();
            retryScene();
          }, 750);
        } else {
          playSFX('wrong');
          statusEl.innerHTML = `<span style="color:var(--amber);">Not quite — build: "${state.currentParryTarget.join(' ')}"</span>`;
        }
      }

      function closeParryModal() {
        document.getElementById('parry-modal').classList.remove('open');
      }

      function renderTapeVictory(tape) {
        playSFX('correct');
        document.getElementById('ui-scene-label').textContent = 'EPISODE COMPLETE';
        document.getElementById('ui-grammar-tag').textContent = 'Mission Clear';
        document.getElementById('ui-timeline-nodes').innerHTML = '';
        document.getElementById('ui-story-text').innerHTML =
          `<strong>Episode Complete: ${tape.title}!</strong><br>` +
          `You finished with <strong>${state.stamina}/20 Stamina</strong>. Ready for the next episode?`;
        document.getElementById('ui-mission-prompt').textContent = 'Choose your next episode:';

        const nextId = (state.tapeId % 3) + 1;
        document.getElementById('ui-choices-list').innerHTML = `
          <button type="button" class="choice-btn" onclick="Chronicle88.loadTape(${nextId})">
            <span class="choice-letter">&rarr;</span>
            <span>Play Next Episode: <strong>${TAPES[nextId].title}</strong></span>
          </button>
          <button type="button" class="choice-btn" onclick="Chronicle88.loadTape(${state.tapeId})">
            <span class="choice-letter">R</span>
            <span>Replay <strong>${tape.title}</strong></span>
          </button>
        `;
      }

      function loadTape(tapeId) {
        if (!TAPES[tapeId]) tapeId = 1;
        playSFX('tape');
        state.tapeId = tapeId;
        state.sceneIdx = 0;
        state.stamina = 20;
        state.composure = 9;
        state.tokens = 3;
        if (bgmOn) startBGM();
        renderCurrentScene();
      }

      function advanceScene() {
        state.sceneIdx++;
        renderCurrentScene();
      }

      function retryScene() {
        renderCurrentScene();
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderDieFace('die-box-1', 4);
        renderDieFace('die-box-2', 3);
        const params = new URLSearchParams(window.location.search);
        const t = parseInt(params.get('tape') || '1', 10);
        loadTape(t);
      });

      return {
        loadTape,
        advanceScene,
        retryScene,
        toggleGrammarTip,
        rollHazardCheck,
        openParryModal,
        closeParryModal,
        addParryTile,
        removeParryTile,
