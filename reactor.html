<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phrasal Verb Reactor | Gareth Montgomery</title>
    <meta name="description" content="Stabilize the reactor by matching the correct phrasal verb particle before time runs out.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reactor.css">
</head>
<body>

    <!-- Intro Screen -->
    <div id="intro-screen" class="modal open">
        <div class="modal-content">
            <h1 class="glitch" data-text="REACTOR MELTDOWN">REACTOR MELTDOWN</h1>
            <p>The core is unstable. Read the definition and inject the correct particle into the base verb to stabilize it.</p>
            <input type="text" id="player-name" placeholder="Agent Name..." maxlength="15" autocomplete="off">
            <input type="email" id="player-email" placeholder="Agent Email..." autocomplete="email">
            <button id="btn-start" disabled>INITIALIZE OVERRIDE</button>
        </div>
    </div>

    <!-- Game Over / Lead Capture Screen -->
    <div id="end-screen" class="modal">
        <div class="modal-content">
            <h1 id="end-title">CORE DESTROYED</h1>
            <p id="end-desc">You failed to stabilize the phrasal verbs.</p>
            <p>Score: <span id="final-score">0</span></p>
            
            <form action="https://formsubmit.co/de094039c8f01c6fa3862b3a6a060db1" method="POST" id="lead-form">
                <input type="hidden" name="_subject" value="Phrasal Verb Reactor Lead!">
                <input type="hidden" name="_next" value="">
                <input type="hidden" name="score" id="lead-score" value="">
                <input type="hidden" name="email" id="lead-email" required>
                <button type="submit" id="btn-claim">SUBMIT REPORT & CLAIM DISCOUNT</button>
            </form>
            <button id="btn-restart" class="secondary">REBOOT SYSTEM</button>
        </div>
    </div>

    <div class="game-container">
        <header>
            <div class="stat">CORES STABILIZED: <span id="score-display">0</span>/10</div>
            <a href="index.html" class="exit-link">ABORT</a>
        </header>

        <main>
            <div id="target-definition">DEFINITION WILL APPEAR HERE</div>
            
            <div class="reactor-area">
                <div id="base-verb" class="core pulse">VERB</div>
                
                <div class="particles-container">
                    <button class="particle" data-index="0">PART 1</button>
                    <button class="particle" data-index="1">PART 2</button>
                    <button class="particle" data-index="2">PART 3</button>
                    <button class="particle" data-index="3">PART 4</button>
                </div>
            </div>
        </main>

        <div class="timer-container">
            <div id="timer-bar"></div>
        </div>
    </div>

    <script src="reactor.js"></script>
</body>
</html>
