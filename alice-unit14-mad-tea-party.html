  let unitTimerInterval = null;
  function startUnitTimer(seconds, mode) {
    stopUnitTimer();
    let rem = seconds;
    const disp = document.getElementById('unit-timer-display');
    const tick = () => {
      const m = String(Math.floor(rem / 60)).padStart(2, '0');
      const s = String(rem % 60).padStart(2, '0');
      if (disp) {
        disp.textContent = `${m}:${s}`;
        disp.style.borderColor = mode === 'Speak' ? '#4ade80' : '#f59e0b';
        disp.style.color = rem <= 10 ? '#f87171' : (mode === 'Speak' ? '#86efac' : '#fde68a');
      }
    };
    tick();
    unitTimerInterval = setInterval(() => {
      rem -= 1;
      if (rem <= 0) {
        rem = 0;
        tick();
        clearInterval(unitTimerInterval);
        unitTimerInterval = null;
      } else {
        tick();
      }
    }, 1000);
  }
  function stopUnitTimer() {
    if (unitTimerInterval) { clearInterval(unitTimerInterval); unitTimerInterval = null; }
    const disp = document.getElementById('unit-timer-display');
    if (disp) { disp.textContent = '01:00'; disp.style.borderColor = 'rgba(245,158,11,0.4)'; disp.style.color = '#fde68a'; }
  }

  function checkWbItem(idx) {
    const item = workbenchItems[idx];
    const inp = document.getElementById(`wb-input-${idx}`);

      fb.className = 'feedback-box wrong';
      fb.textContent = `⚠️ Unchanged Keyword Guard: You must include the exact word "${item.keyWord}" without altering its form.`;
      return;

      fb.textContent = `⚠️ Word Count Alert: Your phrase has ${words.length} words. Cambridge C1 Part 4 requires between 3 and 6 words.`;

  function auditC1Writing(text) {
    const raw = (text || '').trim();
    const words = raw ? raw.split(/\s+/).length : 0;
    const wcEl = document.getElementById('transfer-word-count');
    if (wcEl) wcEl.textContent = `${words} Words`;

    const rules = [
      { id: 'c1-badge-inversion', re: /\b(?:much\s+as|[a-z]+\s+(?:though|as)\s+(?:the|a|an|it|he|she|they|we|this|that|[a-z]+)\s+(?:is|are|was|were|seem|seemed|look|looked|sound|sounded|appear|appeared|may|might)|never\s+before|seldom|rarely|little\s+(?:did|do|does)|not\s+until|only\s+(?:when|after|by)|scarcely|hardly|no\s+sooner|under\s+no\s+circumstances|so\s+[a-z]+\s+(?:was|were|is|are|has|have)|such\s+(?:was|were|is)|nowhere\s+(?:is|was|could))\b/i },
      { id: 'c1-badge-cleft', re: /\b(?:what\s+[^.!?]{2,45}\s+(?:is|was|are|were)\b|it\s+(?:is|was)\s+(?:only\s+when|not\s+until|[^.!?]{2,35})\s+that\b)/i },
      { id: 'c1-badge-participle', re: /(?:^|[.!?]\s+)(?:having\s+[a-z]+ed|having\s+been|not\s+[a-z]+ing|far\s+from\s+[a-z]+ing|hemmed\s+in|shrouded\s+in|faced\s+with|confronted\s+with|[a-z]+ing\s+[^.!?]{3,50},)/im },
      { id: 'c1-badge-passive', re: /\b(?:(?:is|are|was|were)\s+(?:widely\s+|commonly\s+|frequently\s+)?(?:believed|alleged|thought|presumed|said|reported|rumoured|claimed|known)\s+to\b|it\s+(?:is|was)\s+(?:widely\s+)?(?:believed|argued|thought|claimed|alleged)\s+that\b|corroborated\s+by\b)/i },
      { id: 'c1-badge-modal', re: /\b(?:(?:must|can't|cannot|couldn't|may|might|could)\s+(?:well\s+)?have\s+[a-z]+|ought\s+(?:not\s+)?to\s+have|were\s+[^.!?]{2,25}\s+to\s+[a-z]+|should\s+[^.!?]{2,25}\s+[a-z]+|had\s+it\s+not\s+been\s+for|but\s+for\s+the|high\s+time\s+[^.!?]{2,25}\s+[a-z]+ed|would\s+rather\s+[^.!?]{2,25}\s+(?:did|had|[a-z]+ed))\b/i }
    ];

    rules.forEach(r => {
      const el = document.getElementById(r.id);
      if (!el) return;
      const dot = el.querySelector('.da-c1-dot');
      const matched = r.re.test(raw);
      el.classList.toggle('active', matched);
      if (dot) dot.textContent = matched ? '✓' : '○';
    });
  }
