<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Golden autumn forest path with warm sunlight and steaming mug">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="68%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Sky & Golden Hour Glow -->
  <rect width="640" height="420" rx="18" fill="url(#skyGrad)"/>
  <circle cx="435" cy="135" r="190" fill="url(#sunGlow)"/>
  <circle cx="435" cy="135" r="36" fill="#fef3c7" opacity="0.92"/>

  <!-- Distant Autumn Hills -->
  <path d="M0 245 Q140 190 310 230 T640 215 L640 420 L0 420 Z" fill="url(#hillBack)"/>
  <path d="M0 285 Q180 250 370 285 T640 265 L640 420 L0 420 Z" fill="url(#hillFront)"/>

  <!-- Winding Sunlit Path -->
  <path d="M405 268 C395 305 330 330 220 420 L410 420 C435 340 425 300 416 268 Z" fill="url(#pathGrad)" opacity="0.72"/>

  <!-- Stylized Autumn Trees (Left Canopy) -->
  <g>
    <rect x="95" y="210" width="12" height="105" rx="4" fill="#292524"/>
    <path d="M101 245 L78 215 M101 232 L125 204" stroke="#292524" stroke-width="5" stroke-linecap="round"/>
    <circle cx="82" cy="178" r="46" fill="#d97706"/>
    <circle cx="122" cy="184" r="42" fill="#b45309"/>
    <circle cx="104" cy="146" r="40" fill="#f59e0b"/>
    <circle cx="62" cy="194" r="30" fill="#ea580c" opacity="0.9"/>
  </g>

  <!-- Stylized Autumn Trees (Right Canopy) -->
  <g>
    <rect x="520" y="195" width="14" height="118" rx="4" fill="#1c1917"/>
    <path d="M527 236 L496 202 M527 224 L554 196" stroke="#1c1917" stroke-width="5" stroke-linecap="round"/>
    <circle cx="496" cy="168" r="44" fill="#ea580c"/>
    <circle cx="546" cy="176" r="48" fill="#9a3412"/>
    <circle cx="524" cy="136" r="40" fill="#fbbf24" opacity="0.95"/>
  </g>

  <!-- Midground Tree Silhouette -->
  <g opacity="0.88">
    <rect x="218" y="212" width="8" height="68" rx="3" fill="#292524"/>
    <circle cx="222" cy="190" r="28" fill="#f59e0b"/>
    <circle cx="204" cy="202" r="22" fill="#d97706"/>
    <circle cx="240" cy="200" r="20" fill="#c2410c"/>
  </g>

  <!-- Falling Autumn Leaves -->
  <g fill="#fbbf24">
    <ellipse cx="182" cy="126" rx="9" ry="4.5" transform="rotate(-28 182 126)"/>
    <ellipse cx="268" cy="158" rx="8" ry="4" transform="rotate(24 268 158)" fill="#f97316"/>
    <ellipse cx="332" cy="110" rx="9" ry="4.5" transform="rotate(-16 332 110)" fill="#fde68a"/>
    <ellipse cx="458" cy="212" rx="8" ry="4" transform="rotate(35 458 212)" fill="#fb923c"/>
    <ellipse cx="145" cy="290" rx="9" ry="4" transform="rotate(-14 145 290)" fill="#f59e0b"/>
    <ellipse cx="364" cy="340" rx="8" ry="3.8" transform="rotate(18 364 340)" fill="#fbbf24"/>
    <ellipse cx="484" cy="326" rx="9" ry="4" transform="rotate(-22 484 326)" fill="#ea580c"/>
  </g>

  <!-- Warm Tea/Coffee Mug Foreground Card -->
  <g transform="translate(64, 294)">
    <rect x="0" y="0" width="114" height="94" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Mug body -->
    <rect x="30" y="34" width="44" height="38" rx="8" fill="#fef3c7"/>
    <path d="M74 42 C86 42 86 64 74 64" fill="none" stroke="#fef3c7" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="52" cy="36" rx="19" ry="4" fill="#b45309"/>
    <!-- Steam curls -->
    <path d="M43 26 C39 20 47 16 43 10" fill="none" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M54 25 C50 18 58 14 54 8" fill="none" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
    <path d="M64 26 C60 20 68 16 64 10" fill="none" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Subtle Floating Leaf Crest -->
  <g transform="translate(506, 304)">
    <rect x="0" y="0" width="76" height="76" rx="14" fill="#0f172a" fill-opacity="0.72" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M38 16 C49 26 54 40 38 56 C22 40 27 26 38 16 Z" fill="#f59e0b"/>
    <path d="M38 22 L38 61 M38 35 L46 29 M38 43 L30 37" stroke="#451a03" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
